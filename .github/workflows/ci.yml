name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # third_party/c-testsuite is a submodule and is required by the
      # conformance ledger step below.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # The dev shell pins LLVM/MLIR/Clang 21.1.8 and the Rust toolchain,
      # and exports the MLIR_DIR / Clang_DIR / LIBCLANG_PATH that
      # meson.build's toolchain discovery reads. lit comes from the same
      # shell's python environment; test/meson.build finds it on PATH.
      - name: Configure
        run: nix develop -c meson setup build

      - name: Build
        run: nix develop -c meson compile -C build

      # The --actor-mode=async crate flavor (FR-62) emits an UNCONDITIONAL
      # tokio dependency, and `emitrust-cc --build` runs
      # `cargo build --release --offline`. On a runner with a cold registry
      # that cannot resolve, and the two async EndToEnd tests fail with
      # "no matching package named `tokio` found" -- which is exactly the
      # offline-resolution failure FR-62 recorded when it chose that design.
      # It never bites locally because a developer's ~/.cargo is warm, so CI
      # is the first environment that sees it. Warm the registry with
      # precisely the dependency the emitter declares (two crates: tokio and
      # pin-project-lite). Verified: cold => 2 FAIL, warmed => 0 FAIL.
      - name: Warm the cargo registry for the async actor flavor
        run: |
          set -eu
          d="$RUNNER_TEMP/tokio-warm"
          mkdir -p "$d/src"
          printf '%s\n' \
            '[package]' \
            'name = "tokio-warm"' \
            'version = "0.0.0"' \
            'edition = "2021"' \
            '' \
            '[dependencies]' \
            'tokio = { version = "1", features = ["rt", "sync"] }' \
            > "$d/Cargo.toml"
          echo 'fn main() {}' > "$d/src/main.rs"
          nix develop -c cargo fetch --manifest-path "$d/Cargo.toml"

      # Full lit suite, both tiers: dialect round-trips, conversions,
      # importer, driver, differential end-to-end tests, and the
      # c-testsuite ledger driver (test/CTestSuite/c-testsuite.c). This is
      # the same suite the CMake `check-emitrust` target ran.
      # --print-errorlogs: without it meson reports only "Fail: 1" and keeps
      # the failing test's output in build/meson-logs/testlog.txt, which is
      # not otherwise visible from the job log. A red slow tier was
      # undiagnosable from CI output alone until this was added.
      - name: Regression suite (lit, both tiers)
        run: nix develop -c meson test -C build --print-errorlogs

      # The full log, for when --print-errorlogs is truncated or the failure
      # is in a test lit did not report inline.
      - name: Upload meson test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog
          path: build/meson-logs/testlog.txt
          if-no-files-found: warn

      # Explicit conformance gate against the required-pass list.  Every
      # test named in test/CTestSuite/expected-pass.txt must transpile,
      # build with cargo, and produce byte-identical stdout and a zero
      # exit against the recorded expected output.  The manifest ratchets
      # in both directions: a regression of a listed test fails, and a
      # newly passing unlisted test also fails until the list is
      # regenerated with --update.  Any MISCOMPILE is fatal unless
      # quarantined in known-miscompiles.txt.
      - name: c-testsuite required-pass ledger
        run: |
          nix develop -c python3 test/CTestSuite/run_c_testsuite.py \
            --emitrust-cc build/tools/emitrust-cc \
            --suite third_party/c-testsuite \
            --manifest test/CTestSuite/expected-pass.txt \
            --known-miscompiles test/CTestSuite/known-miscompiles.txt \
            --workdir "$RUNNER_TEMP/ctestsuite"
