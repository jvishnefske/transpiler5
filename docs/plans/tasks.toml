# C++17 feature-corpus implementation loop for the emitrust transpiler.
# Each task implements one feature slice, flips the named corpus entries in
# test/Cpp17Suite/Inputs from UNSUPPORTED to PASS, re-runs the ratchet with
# --update, and commits -- every commit ratchets the ledger forward.
# Protocol per task (CLAUDE.md): design.md FR entry (W2.4-W2.10) with spike
# verdict -> spike -> subagent TDD -> full check-emitrust 100% (CTestSuite
# ledger unchanged; Cpp17Suite manifest grew by exactly the named entries)
# -> commit.

version = 1

[project]
name = "cpp17-feature-corpus"
description = "C++17 features that exercise IR-level semantics: corpus, ratchet harness, and ordered implementation tasks"
verify = "nix develop -c meson test -C build --print-errorlogs"

[[tasks]]
id = "task-001"
title = "Cpp17Suite corpus + ratchet harness (W2.4)"
status = "done"
deps = []
acceptance = """
- test/Cpp17Suite/Inputs holds the 26-program corpus with committed
  .expected files (native clang++ -std=c++17 reference stdout).
- run_cpp17_suite.py (clone of the proven C-ledger runner) classifies
  PASS/MISCOMPILE/UNSUPPORTED with the two-way manifest; --update ratchets.
- Day-one manifest = 00101-00104; every frontier entry is a LOCATED
  rejection (R1 probe: structured bindings reject, no silent wrong code).
- Both ratchet directions hand-verified to hard-fail; full check-emitrust
  100% with the new cpp17-suite lit entry discovered exactly once.
"""

[[tasks]]
id = "task-002"
title = "if/switch with init-statement desugar (W2.5)"
status = "done"
deps = ["task-001"]
acceptance = """
- Replace the located rejections at lib/ImportC/ImportCStatements.cpp
  emitIfStmt ('declaration in if condition') and emitSwitchStmt
  ('declaration in switch condition') with a scope-correct desugar: the
  init/condition variable scopes over BOTH branches / the whole switch.
- Covers all three corpus shapes: 00201 if(init;cond), 00202
  switch(init;cond), 00203 condition-declaration `if (int x = f())`.
- Cpp17Suite manifest += 00201.cpp 00202.cpp 00203.cpp (exactly);
  CTestSuite ledger unchanged; new EndToEnd byte-diff green;
  full check-emitrust 100%.
"""

[[tasks]]
id = "task-003"
title = "vector front/back/pop_back + string push_back/clear (W2.6)"
status = "done"
deps = ["task-001"]
acceptance = """
- Widen the STL method if-chains in emitStlMemberCall
  (lib/ImportC/ImportCExpressions.cpp): vector front()/back()/pop_back(),
  string push_back(char)/clear(). No emitter change (opaque strings).
- Spike picks panic-equivalent Rust spellings: C++ front/back on empty is
  UB, so a Rust panic there is a safe refinement.
- Cpp17Suite manifest += 00301.cpp 00302.cpp (exactly); CTestSuite ledger
  unchanged; new EndToEnd byte-diff green; full check-emitrust 100%.
"""

[[tasks]]
id = "task-004"
title = "std::array -> !emitrust.array<NxT>, the C-array type (W2.7)"
status = "done"
deps = ["task-001"]
acceptance = """
- mapStdLibraryType (lib/ImportC/ImportCTypes.cpp) gains the `array` case;
  isStlOpaqueType widens per family; OO_Subscript dispatch and
  emitStlVectorIndexPlace generalize off the hardcoded "Vec<" prefix.
- Aggregate-init route confirmed by spike (InitListExpr, NOT
  CXXConstructExpr); one emitDefaultValue branch in TranslateToRust.cpp.
- size() maps to the array length; subscript read/write byte-diff clean.
- Cpp17Suite manifest += 00401.cpp 00402.cpp (exactly); CTestSuite ledger
  unchanged; new EndToEnd byte-diff green; full check-emitrust 100%.
"""

[[tasks]]
id = "task-005"
title = "std::pair (W2.8) -- spike REQUIRED first (risk R2)"
status = "done"
deps = ["task-001"]
acceptance = """
- Spike prototypes BOTH routes before committing to one: (a) opaque Rust
  tuple + a new tuple-member emission path (emitrust.member is
  struct-only today), vs (b) importer-synthesized real struct reusing all
  existing struct machinery (zero emitter changes -- likely winner).
  Byte-diff decides; verdict recorded in the design.md FR entry.
- Spike probes MaterializeTemporaryExpr on a pair returned by value
  (corpus 00502).
- .first/.second read AND write work (corpus 00501).
- Cpp17Suite manifest += 00501.cpp 00502.cpp (exactly); CTestSuite ledger
  unchanged; new EndToEnd byte-diff green; full check-emitrust 100%.
"""

[[tasks]]
id = "task-006"
title = "structured bindings (W2.9)"
status = "done"
deps = ["task-004", "task-005"]
acceptance = """
- DecompositionDecl handling in the DeclStmt case of emitStmt
  (lib/ImportC/ImportCStatements.cpp): desugar to a holding variable plus
  one local per BindingDecl.
- Covers pair (00601), user struct (00602), and std::array (00603).
- Cpp17Suite manifest += 00601.cpp 00602.cpp 00603.cpp (exactly);
  CTestSuite ledger unchanged; new EndToEnd byte-diff green;
  full check-emitrust 100%.
"""

[[tasks]]
id = "task-007"
title = "ranged-for over vector/array (W2.10) -- risk R3 spike-gated"
status = "done"
deps = ["task-003", "task-004"]
acceptance = """
- New CXXForRangeStmt case in emitStmt (after the ForStmt case), lowering
  to a len()-bounded counted loop reusing the task-004-generalized
  index-place helper. Conservative restrictions (safe failure direction):
  DeclRefExpr ranges only; range mutation inside the body rejects.
- R3 spike: hand-desugar and byte-diff the end-evaluation semantics (C++
  evaluates end once; the desugar re-evaluates len()); the DeclRefExpr +
  no-mutation restriction is the recorded mitigation.
- FLIP the RANGEDFOR rejection pin in test/Import/Cpp/stl-invalid.cpp to
  a positive test.
- Cpp17Suite manifest += 00701.cpp 00703.cpp, and 00702.cpp iff the
  mutation-form (`int &x`) spike GOes; CTestSuite ledger unchanged; new
  EndToEnd byte-diff green; full check-emitrust 100%.
"""
