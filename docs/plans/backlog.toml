title = "argv is the top remaining EMIT lever, the only one whose cases are all exec, and it is already half-built"
summary = "Opened 2026-09-10 from the 60/252 census re-run. The census ranks 'use of main's argv parameter' first among single fixes at +5 EMIT (exec 5, lib 0). Being exec is the whole point: an exec case runs its binary and never meets FR-233's export wall, so EMIT here can actually become PASS. The roadmap never ranked argv at all. EVERY FIGURE IS AN UPPER BOUND AND THE REASON IS NAMEABLE: all six argv cases have main DROPPED by recovery, so every blocker inside main is invisible; tractor-census.py's docstring names 004_nineality_sieve as the measured instance (depth 1, actually at least four). MEASURED by reading the six sources rather than the histogram: they are a TIGHT CLUSTER -- all six need strtoX(argv[i], &end, base) and the pointer identity end == argv[i]; strtol in 003/004/005/006, strtod in 007, strtoul in 008. Per-case residue argv alone will NOT clear, so the honest ceiling is about +3 not +5: 007_errno_pow also needs pow (a DELIBERATE bit-exactness refusal that should stay one), 006 also needs 'returned pointer value', 008 carries an unreached-by-import item. THE WORK IS SMALLER THAN THE REFUSAL SUGGESTS: argv is NOT unimplemented -- C99-43 C3 already built an ArgvTableType, an ArgvArgOp, a mainArgvAdmittedParam plan flag and a crate wrapper passing Vec<Vec<i8>>. planArgvUsesFor admits argv only when EVERY use fits a narrow read grammar (argv[i] as a direct-printf %s/%.Ns argument, or argv[i][j] read as a value) and otherwise records nothing, leaving the historical signature-time rejection. This is a WIDENING of an admitted set, not a new capability. THE REAL BLOCKER IS UNDERNEATH AND INDEPENDENT OF argv: probed on a plain local char buf[8] with no argv anywhere, strtol(buf, &end, 10) is refused with 'taking the address of a pointer variable' and strtol(buf, NULL, 10) with 'call to strtol declared in a system header'. The strtol family is not in the hosted table AT ALL, and the endptr out-parameter is a second separate gap; both are testable in EndToEnd against a clang native with no corpus dependency, which is how they should be built -- importer first, argv widening second. ADJACENT MACHINERY THAT ALREADY EXISTS: emitAtoiCall is the exact shape a strtol arm needs (emitCharRegionArg -> emitCharRegionSlice -> requestStringHelper -> CallOpaqueOp, roughly 30 lines); __emitrust_atof ALREADY IMPLEMENTS C's strtod PREFIX GRAMMAR, the expensive part of strtod; and FR-230's strchr cursor bind already landed the cursor-into-a-char-region representation an endptr needs, over FR-229's byte view. Three capabilities that landed this session are precisely this item's prerequisites. ONE HAZARD NAMED IN ADVANCE: strtod must NOT be built by copying __emitrust_atof, which carries a measured silent divergence -- build the panic classification in from the start. RUNG 1 LANDED 2026-09-10 AT +0 EMIT AND +0 PASS -- a prerequisite with ZERO standalone yield that must not be read as movement. strtol/strtoul/strtod over a char region with a NULL endptr; +740/-0 purely additive (three name-guarded dispatch arms, emitStrtoIntCall/emitStrtodCall/requireNullEndptr, three runtime helpers, and the strtox-endptr needle mirrored into run_realworld.py). WHY +0, COUNTED AS PROGRAMS AND VERIFIED INDEPENDENTLY: the corpus has 21 strto* call sites in 15 files and 20 pass a NON-NULL endptr; the single NULL site is strtol(argv[3], NULL, 10) in 003_string_slicing, which also has non-NULL sites AND needs argv. My count corrects the agent's in one way: 4 of the 15 files are Hidden-Tests which TRACTOR does not score, so the ceiling is 11 Public-Tests PROGRAMS not 15 files. THE ENDPTR FRONTIER IS FOUR FRONTIERS NOT ONE, AND THIS CORRECTS MY OWN RUNG-2 PLAN: I specced rung 2 as work in emitStrtoIntCall, but &end on a LOCAL pointer and a char ** PARAMETER -- the two shapes the corpus actually uses -- are sunk by PointerRegionAnalysis BEFORE any call is lowered, by refusals older than this feature ('taking the address of a pointer variable'; 'pointer-to-pointer parameter escapes the cursor-parameter shape'). The new refusal is reachable only through a member address or a cast. RUNG 2 MUST BE AN ADMISSION IN PointerRegionAnalysis (consumedAddrOf at lib/ImportC/ImportC.cpp:1709 is the existing hook shape), and rung 2 not rung 3 is where the corpus value sits. strtod NEEDED NO NEW FLOAT HELPER AT ALL: C 7.22.1.1p2 DEFINES atof(s) as strtod(s,NULL), so strtod lowers to __emitrust_atof verbatim -- same op, same helper, no second grammar, so FR-235's classification has literally nowhere to drift to. Accepted consequence: a strtod('0x1p3') panic still reads 'atof: hexadecimal floating-point input is not supported'; retitling would edit test/EndToEnd/libc-atof-loud-stop.c and CLOSE EPOCH-7 for a panic string, not a trade worth making. OUT-OF-RANGE BASE IS UB (C 7.22.1.4p2) AND IS REFINED NOT STOPPED ON: the helper converts nothing and returns 0, glibc's behaviour, following emitAbsCall's precedent rather than atof's -- load-bearing because atof panics on forms C DEFINES and Rust cannot reproduce, whereas here C defines nothing so there is no wrong answer to give. Bases 1 and 37 are pinned in the byte-diff and labelled a platform-refinement pin, not a conformance claim. strtoll/strtoull/strtoimax/strtoumax/strtof/strtold STAY REFUSED and are pinned as such, since each needs its own saturation constants or float width and an unverified alias is exactly the silent divergence rung 1 exists to prevent. ORACLE: 748/748 byte-diff lines identical against the clang native -- 46 forms x 8 bases x 2 functions plus 12 strtod rows, covering LONG_MAX/LONG_MIN saturation, strtoul of -1 (negate mod 2^64) and of -0 (which must NOT become ULONG_MAX), base-0 octal auto-detect, 08 as a non-octal, letter digits to base 36, the conditional 0x prefix, 1e400 to inf, and the minimum subnormal; plus a standalone 736-vector differential against glibc before wiring in. GOLDEN MOVEMENT 0, PROVEN RATHER THAN SWEPT: the diff is +740/-0 and the only insertion into an existing body is three name-guarded arms in emitCall, with no existing test source containing a strto* call; the full lit suite (the only thing that sees split-file sub-units) is green. A --recover leg was checked: a crate mixing an admitted strtol(buf,NULL,10) with a refused &s.e site builds, stubs only the bad function, and prints the native's answer. MEASURED 2026-09-10 AND IT RETIRES THIS ENTRY'S OWN '+3 HONEST CEILING' AS A FORECAST NOBODY CAN STAND BEHIND. I ran --recover --incremental on all five argv programs and counted stubs, which is the rule for reading a blocker set. Their depth is STRUCTURALLY UNMEASURABLE until argv is admitted: recovery drops c_main WHOLE (1 rejected item, tag argv, 0 stubs) and in every one of the five, main holds essentially the entire program -- 35 to 65 lines with one or two top-level definitions, so nothing else exists to stub. The census cannot see, and I cannot forecast, what these programs need beyond argv. That makes '+3 to +5' a guess about code no tool in this repo has imported -- the same error class as the nine first-failure miscounts, predicting yield from a blocker set structurally incapable of showing depth. The one honest bound is weak: these are 35-65 line programs so the residue behind main is small BY CONSTRUCTION, unlike the SPHINCS+ cases where fourteen stubs hid behind a single first error. RUNG 2 AND RUNG 3 ARE MUTUALLY ENTANGLED AND NEITHER CAN BE SCORED ALONE: planArgvUsesFor is ALL-OR-NOTHING (argv admits only when EVERY use fits the read grammar) and all five programs spell their uses as strtoX(argv[i], &end, base), so argv cannot admit until argv[i] is admissible as a char-region argument to a hosted conversion AND the &end out-parameter is admissible. Rung 2 is independently testable on a plain char buf[] with no argv, which is why it is built first, but RUNG 2 WILL SCORE +0 ON ITS OWN and rung 3 is what finally makes the residue visible. Correct sequence: land rung 2 on plain locals, widen argv's grammar in rung 3 to include the hosted-conversion argument position, THEN re-measure the depth -- do not re-forecast it before that. RUNG 2 LANDED 2026-09-10 AT +0 EMIT AND +0 PASS, AS PREDICTED. The real endptr out-parameter: a local char *end, &end as the endptr, then end == buf, *end, end - buf, end[0]. MY pairedArgQuery LEAD WAS WRONG AND I HAD FLAGGED IT AS UNVERIFIED, WHICH IS THE ONLY REASON IT COST NOTHING: both providers (ImportCFunctions.cpp:1386, :2402) open with callee->getDefinition() so a hosted strtol can never answer, and neither was touched. The implementation is instead a FOURTH admission block in PointerRegionAnalysis's CallExpr arm beside Shape-P and Shape-G, driven by a free function hostedEndptrCoIndex(callee,index,numArgs) mirroring the strchr precedent (library-supplied plan, inline, no callback), gated on !callee->getDefinition() so a PROJECT-supplied strtol is not intercepted -- verified, not assumed. TWO OTHER UNVERIFIED ITEMS RESOLVED: recordPointerWrite DOES accept a hosted co-argument (call->getArg(0) decays and classifies unchanged, no change needed); and the no-conversion case survives BUT NOT VIA THE JOIN, which is where I expected it -- C 7.22.1.4p7's 'store nptr ITSELF' is carried by the HELPER, every no-conversion exit of the scan returning 0 with the store being argCursor + 0, confirmed against glibc on base-2 over a six-byte leading whitespace run that still leaves offset 0 and end==buf true on both sides. A THIRD ANCHOR OF MINE WAS OFF: the live diagnostic is at column 24 not 26 -- same file, same site, same wording, but the fourth anchor defect I have shipped in a spec this session, and the column is the part I keep copying rather than re-running. ORACLE: 588/588 byte-diff lines identical to the clang native. Load-bearing rows: base-2 over leading whitespace (no conversion after six bytes scanned); '', ' ', '-', '+' all at offset 0 with end==buf; '0x' and '0xg' at base 16 converting the single 0 and leaving end on the x at offset 1 where an unconditional two-byte prefix skip would say 2; 23-digit overflow saturating the VALUE while the cursor still advances to 23/24; the O rows pinning the coordinate correction (end-wide 4 and 9 against end-p 2 and 2); and a Q section for self-aliasing strtol(q,&q,0), the only shape where the lowering's internal order (read argument 0 THEN store) is observable. THE IMPLEMENTING AGENT STRENGTHENED THE INHERITED TESTS AND CORRECTED NO ROW OF THEM: it added six strtod word forms because the inf/nan LENGTHS had no byte-diff coverage -- infinity consumes 8 and infin consumes 3, so a scan advancing by the matched-prefix count would print 5 for the second -- and re-measured the inherited claim that glibc leaves *endptr COMPLETELY UNTOUCHED for bases 1 and 37 (0xdeadbeef reads back), confirming that excluding out-of-range bases from the endptr table was right and storing nptr there is the safe refinement. A CENSUS BLIND SPOT LEFT OPEN DELIBERATELY AND FLAGGED RATHER THAN SILENTLY ACCEPTED: a GLOBAL char *end still refuses with the pre-existing 'taking the address of a pointer variable', which classify_blocker buckets as `other`, so that shape is invisible to the ranking instrument; no needle was added because it is not a NEW refusal class and giving it one would re-key an existing tag, but it is the THIRD other-bucket blind spot found this session (FR-230's missing needle, FR-239's errno, and now this), a pattern about the instrument rather than three coincidences. --recover produces FR-52's marker correctly for the new refusal. WHY +0, COUNTED AS PROGRAMS: 16 strto* sites across 11 Public-Tests programs; SEVEN pass argv[N] as argument 0 (003, 004, 005, 006, 007, 008, 020_lib) and are blocked at the argv frontier which rung 3 owns, and the remaining four (023, 023_lib, 025, 025_lib) share one parse_val body where --recover on 023 shows TWO surviving blockers NEITHER OF THEM THE ENDPTR: 'unsupported pointer expression: CallExpr' (errno = 0, FR-239) and 'an fgets result must be compared against a null pointer or tested for truth'. NO CORPUS PROGRAM IS ONE ENDPTR AWAY FROM EITHER STAGE, and the _lib halves additionally need a dlsym-able export. RUNG 3 SCOPED BY ENUMERATING EVERY argv USE FORM, 2026-09-10, rather than by re-reading the blocker tag. The six programs use exactly SIX distinct forms and the current grammar admits none: (1) strtoX(argv[i], &end, base), argv[i] as the char-region argument to a hosted conversion -- ALL SIX programs; (2) end == argv[i], pointer identity between the endptr cursor and argv[i]'s region base -- 003/004/005/006; (3) strlen(argv[1]), argv[i] to a different hosted function -- 003 only; (4) argv[1] + start consumed by %.*s -- 003 only, and %.*s is a SEPARATE LIVE REFUSAL ('unsupported: * precision in printf format', re-measured today) so 003 needs that fixed too; (5) fprintf(stderr, '...%s...', argv[i]), %s to STDERR VIA FPRINTF where the admitted grammar covers only a direct printf -- 007/008; (6) strtoX(argv[i], NULL, base) -- 003 only. SO THE CLEAN RUNG-3 TARGET IS FORMS 1 AND 2, AND IT IS THREE PROGRAMS: 004, 005 and 006, which use NOTHING ELSE. 003 needs three more forms including a separate printf fix; 008 needs form 5. 007 IS NOT WINNABLE AND SHOULD BE STRUCK FROM EVERY 'five programs' COUNT I HAVE WRITTEN INCLUDING THIS ENTRY'S: measured, it needs argv, form 5, errno (lines 19/21/30/32, and errno is not modelled at all -- FR-239), and pow, which is a DELIBERATE bit-exactness refusal that should stay one. Four fixes, one permanent by policy. Same shape of error as the retired '+3 ceiling': citing a program set without enumerating what each member actually needs. The per-program form table is the thing to re-read before dispatching, and the depth BEYOND the argv gate remains unmeasurable until argv admits. RUNG 3 IMPLEMENTED. THE ACCEPTANCE TARGET IS TWO PROGRAMS NOT THREE, AND I CONTRADICTED MYSELF INSIDE THIS ENTRY TO GET THE WRONG NUMBER. 006_static_alias is NOT winnable on forms 1+2: it emits argv fine now and then dies at 'unsupported: returned pointer value' (static_alias returns int *), and --recover shows a SECOND stub, 'pointer assigned a non-address value'. This entry had ALREADY RECORDED '006 also needs returned pointer value' about 200 lines above the scoping paragraph that then asserted 006 uses NOTHING ELSE. THE METHOD IS WHAT FAILED AND THE LESSON GENERALISES: ENUMERATING argv FORMS ANSWERS 'WHAT DOES EACH PROGRAM USE', NOT 'WHAT ELSE BLOCKS IT'. 006's extra blocker is a RETURN-VALUE blocker, not an argv form, so it was outside the enumeration's frame by construction and I read a complete-looking form table as a complete blocker list. A form enumeration must be crossed with the case's full blocker set, exactly as a blocker count must be crossed with kind and export. Measured acceptance: 004 and 005, both at 0 stubs under --recover. THE SLICE/REGION QUESTION WAS AN ADAPTER NOT A MISMATCH: emitrust.argv_arg already yields ref<slice<i8>>, the exact type __emitrust_strtol takes and emitCharRegionSlice produces, so form 1 is four lines of plumbing and the shared-vs-mut check falls out free (the deref's operand is a ref not a mut_ref, so argv can never become a mutable string argument). FORM 2 WAS THE REAL WORK AND MY FRAMING WAS WRONG: I asked whether the rung-2 region join survives with an argv co-argument, but it does not JOIN anything -- THERE IS NO REGION TO JOIN TO. argv is a run of DISJOINT objects selected at runtime, so an argv-rooted pointer cannot be a bare cursor: at offset 0 a cursor alone cannot tell argv[1] from argv[2], which is exactly where every corpus program's no-conversion test sits. The argument index is carried as a SECOND memref<i64> cell beside the cursor and equality is the (index, cursor) PAIR, which also dissolves the 006 worry about end walking two arguments since the selector is state the second call overwrites. argv[i] == NULL HAD TO BE EXCLUDED FROM FORM 2 AND IT IS A MISCOMPILE GUARD NOT SCOPE: argv[argc] IS a null pointer (C 5.1.2.2.1p2) and the argv decomposition carries no null state, so the test would fold to a CONSTANT -- the wrong constant at i == argc; it also flipped a pinned argv[0] != 0 rejection. I TOLD IT TO REMOVE ImportCFunctions.cpp:774-777 AND IT CORRECTLY DID NOT: the all-or-nothing rule makes that refusal exactly what keeps forms 3/4/5 failing loudly, and removing it would have been the silent behaviour change the spec's own bar forbids. THREE SILENT-FOLD HAZARDS THE SPEC DID NOT NAME, found by adversarial probing rather than by any test: an argv-rooted pointer is BASE-LESS, which is also how a statically-NULL pointer looks to this importer, so unguarded, end == NULL folded to TRUE, if (end) folded to FALSE, and *end reported 'dereference of a pointer that is only ever null' -- the right refusal for the wrong reason. None of the three mentions argv so the admission grammar cannot screen them out, and all three are reachable from an admitted main. Fixed, and the first two are byte-diff columns. FORM 6 (strtoX(argv[i], NULL, base)) CAME FREE and was not predicted. THE ORACLE WAS MUTATION-TESTED, the right response to a spec warning about compile-clean evidence: comparison-ignores-the-index and selector-stored-only-at-first-binding were each built and run and each FAILED the byte-diff; a test that cannot fail is not an oracle. Left refused with signature wording byte-identical: strlen(argv[i]), argv[i] + k, fprintf(stderr, %s, argv[i]), ordered comparison against argv[i], and a project-supplied strtol. Six new located wordings each probed from the built tool, with the argv-pointer needle placed AFTER the historical use-of-main's-argv row so first-match-wins keeps that tag byte-identical. Gate 1092/1092 (1089 + 3 new), clippy 57 (+0) with 294 files / 0 skipped / hash unchanged, binding 2307 (+0) and p95 5 (+0), CTestSuite 220/220, Cpp17Suite 35/35, golden movement 0 over 1364 sources (SAME=976 MOVED=0 BOTHFAIL=387 NEWLY_EMITS=1, the 1 being its own test). All anchors confirmed and each fired on real input -- no anchor defect this wave, the first time this session. ACCEPTANCE: strtol/strtoul/strtod with a NULL endptr over a char region, byte-identical to the clang native on a differential vector set including ERANGE overflow clamping to LONG_MAX/LONG_MIN, leading whitespace, sign, base 0/8/10/16 and no-conversion; THEN the endptr out-parameter as a cursor with end == base pointer identity; THEN the argv admission widening. Each rung a separate increment with its own byte-diff oracle. Report EMIT and PASS separately and expect PASS to lag."
