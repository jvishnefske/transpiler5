[[items]]
id = "FR-210"
kind = "defect"
status = "landed"
size = "M"
title = "%s with a field width was Latin-1 re-encoded -- but the padding was never wrong, so the fix reproduces the pad arithmetic rather than correcting it"
summary = "LANDED 2026-09-08, FR-193 item 2 -- THE LAST UNCLOSED ITEM OF THE 997-PROBE HUNT. THE SPEC WAS WRONG ABOUT THE PADDING: __emitrust_cstr yields exactly one Rust char per C byte and Rust's {:>10} pads by chars().count(), so the pad count already agreed with C's byte count -- five pad bytes in both before and after. The defect was purely the payload. FR-191's blocker ('a raw write_all cannot pad') is true of write_all alone and FALSE as a conclusion: C pads to the byte length of the converted run, precisely what the helper's own NUL scan computes, so ONE helper does both. MEASURED: native 127 B, before 150 B, after 127 B, cmp clean over %10s/%-10s/%10.3s/%3s/%5s/%-3s; %.3s alone was already correct (FR-191) and every ASCII control already byte-identical, which localises the defect. Second probe over the other admitted regions: native 115, before 138, after 115. SAFE TO SCOPE TIGHTLY because allowRawBypass is set only at the two stdout print! positions, so the width.empty() guard could drop without exposing stderr or sprintf; and since '*' width/precision and the '0' flag are already located rejections, width/precision/'-' are ALL compile-time constants. FR-192's ordering fence untouched. CAPABILITY COST NONE. Three pre-existing files shifted (paired sweep over 1070 sources, emit-failure set byte-identical), including a deliberate pin flip. RESIDUALS: argv %s + width stays a located rejection -- now a SCOPE choice, and the argv bypass would silently drop the width if widened naively; FR-194's later-side-effect residual unchanged. Gate 1021/1021, clippy 101 (+0), ratchets unmoved, TRACTOR 41/252."
