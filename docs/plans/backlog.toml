summary = "Found by T-EPOCH4's freeze 2026-08-28. Two violations, neither detected. (1) Epochs 1, 2 and 3 have ALL DRIFTED -- epoch.py verify returns 1 for each (epoch-1 3 CONTENT-CHANGED files, epochs 2/3 two each). Pre-existing, blamed to old commits, and confirmed by running the pre-patch epoch.py from git show HEAD: against the same tree. So every trajectory recorded against epochs 1-3 was measured over a population that had already moved. Nothing noticed because ledger_append compares the epoch DOCUMENT hash against the ledger, never against the files on disk, and nothing calls verify automatically. (2) The committed clippy ratchet fires at HEAD (68 -> 72) but its baseline records 180 .c files while the corpus is now 186, so the +4 is not a paired comparison and is not attributable to any emitter change. The ratchet is not in the lit gate, which is why it went unnoticed. Consequence: no clippy trajectory against epochs 1-3 and no current ratchet delta should be trusted as evidence about an emitter change until re-based; epoch 4 (238 files, measurability-filtered, frozen at 556677d) is the clean population. Directions: (a) make ledger_append/the ratchet call verify and refuse to record against a drifted epoch; (b) re-base the ratchet onto epoch 4 with a pinned file list; (c) close epochs 1-3 as history. (a)+(b) are complementary. Latent, not live: clippy_eval derives the crate dir from the basename stem in a shared tempdir, so a future foo.c + foo.cpp pair would collide -- 0 collisions across epoch 4's 238 files. NOT SPIKED."
