title = "atof silently returned the wrong number for every non-decimal form of C's strtod grammar"
summary = "Opened and LANDED 2026-09-10, found while probing FR-234's strtod prerequisite. ATOF SILENTLY RETURNED THE WRONG NUMBER FOR EVERY NON-DECIMAL FORM OF C'S STRTOD GRAMMAR, AND THE HELPER'S OWN COMMENT CALLED IT A DELIBERATE REFINEMENT. Worth +0 TRACTOR -- a correctness fix, not yield. REPRO measured before filing: atof('0x1p3') is 8.0 natively and 0.0 emitted; atof('inf') is inf and 0.0; atof('nan') is nan and 0.0. Exit 0, no panic, no diagnostic -- the silent-wrong-answer class the doctrine forbids. THE TREE HELD TWO ANSWERS TO ONE QUESTION: FR-229 settled this for scanf %f (parse inf/infinity/nan, which Rust and glibc agree on BIT FOR BIT as both are correctly rounded per IEEE-754; PANIC on hex floats and NaN payloads). atof predates that and answered 0.0 to all of them; the fix applies the settled policy rather than inventing one. THE BLAST RADIUS WAS 7x THE COMMENT'S CLAIM: the comment named three forms; over a 44-vector battery 21 of 44 were wrong before and 0 after -- every case-fold (INF, iNfInItY), every backtracking prefix (infi, infx, infinit), both signs, nanQ. -0x1p3 silently produced NEGATIVE ZERO where C gives -8.0. A CORRECTION TO MY OWN SPEC THAT REMOVES A CLASS OF FALSE ABORTS: 0x.p3 must NOT panic. I listed it with the hex forms on the strength of FR-229's note that glibc accepts it outside the C grammar; measured, glibc atof('0x.p3') is 0.0 and strict C's longest-valid-prefix rule also gives 0.0, so there is no divergence to stop on. Same for 0xyz, 0x, 0X. The hex DETECTION here is therefore deliberately SHARPER than scanf's: after the sign, 0x/0X must be followed by a hex digit (optionally behind one .) before the panic fires. scanf cannot do this (one character of pushback); atof has the whole string. The CLASSIFICATION matches FR-229 exactly, only the detection differs; those five strings are pinned as must-answer-0.0. RESIDUAL CONSERVATISM DOCUMENTED NOT HIDDEN: 0x0 panics although C reads 0.0, because proving it is a zero needs a second hex grammar. MIRRORING __emitrust_scan_float_word VERBATIM DOES NOT WORK, the finding that would have cost an hour: scanf is greedy and never backtracks so INFINIT is a MATCHING FAILURE, while strtod backtracks so infinit/infi/infx are all inf. The word-table idea and the |32 case-fold carry over; the match does not (longest-prefix, m >= 3). HEX-FLOAT PARSING DELIBERATELY NOT IMPLEMENTED: unlike decimal it is exactly representable and feasible, but subnormal/overflow rounding is precisely the bug class being fixed, so it stays a loud stop and earns its own increment. IMPORT-TIME REJECTION FOR LITERAL ARGUMENTS CONSIDERED AND DECLINED for three reasons in weight order: it would REFUSE CORRECT PROGRAMS (atof('0x1p3') on a never-executed path ports and runs today); it is strictly worse for the corpus metric (a panicking crate still emits, builds and dlsyms, while a rejection drops the CALLER and under --recover orphans everything only that caller reached); and the literal sub-case is nearly empty since real sites are atof(buf) and even the repro uses char a[16] = '0x1p3', an array, needing dataflow rather than a StringLiteral check. NO RejectionLedger NEEDLE IS NEEDED and that is not an oversight: these are RUNTIME panics, not importer diagnostics, and the ledger and census key on emitError text. Wordings probed from the built crate: 'atof: hexadecimal floating-point input is not supported' and 'atof: a NaN payload, nan(...), is not supported' -- FR-229's voice exactly. Gate 1081/1081 (1079 + 2 new). Clippy 57 (+0), epoch-7 hash unchanged. Binding free temps 2307 (+0), depth p95 5 (+0). CTestSuite 220/220, Cpp17Suite 35/35, both miscompiled=0. Moved goldens: exactly 2, and the bound is tight because the entire non-comment diff is one helper string -- a whole-file sweep over 1133 test sources found 2 requesting __emitrust_atof, and the split-file-blind gap was closed by grepping every test source for atof. Both re-verified by their own oracles (EndToEnd byte-diff; FileCheck); nothing re-blessed. test/Import/C run in full for additivity: 366/366. BIT-LEVEL EVIDENCE not committed as a test because NaN bit patterns are not C-defined: -nan/nan/-inf/inf are bit-identical to glibc (fff8000000000000, 7ff8000000000000, fff0000000000000), so the sign is carried not dropped. INCIDENTAL LOCATED NOT FIXED: two natural ways to feed a runtime-selected string to atof are both refused today -- atof(tbl[i]) over a static const char *const tbl[] gives 'row of string table v used as a pointer value (the padded lowering gives its rows no address)', and returning a literal from a helper gives 'returned pointer value'. Neither is silent; the tests work around it with a char[N][W] table copied into a local."
