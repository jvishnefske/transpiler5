title = "Safer bindings for binary dependencies: 11 of 13 system-header blockers want a safe shim table, and only openssl is a real binding problem"
summary = "Opened 2026-09-09 from an owner question (\"methods of making safer bindings for binary library dependencies with header\"). THE CORPUS SAYS THIS IS TWO DIFFERENT PROBLEMS AND ONLY ONE OF THEM IS A BINDING PROBLEM. \"call to 'X' declared in a system header; not part of the supported C subset\" is the #1 single-fix lever in the FR-223 census: it touches 15 cases, 13 of which need NOTHING ELSE, across 10 distinct functions. Measured list: sqrtf, fabsf, floorf, expf, div, abort, strcspn, atof, fputs and friends -- 11 of the 13 distinct functions have RUST-NATIVE equivalents needing ZERO unsafe (f32::sqrt, f32::abs, f32::floor, f32::exp, i32 div/rem, std::process::abort, a safe strcspn shim over slices, str::parse, write!). THOSE NEED A SHIM TABLE, NOT A BINDING. The only genuine binary dependency in the whole corpus is openssl: five EVP symbols in one file (rng.c), gating the 48 SPHINCS+ exec cases. THE RUBRIC DISQUALIFIES NAIVE extern \"C\": unsafe is scored and must be zero, so a binding that relocates the unsafe obligation rather than discharging it is not a solution. PROPOSAL -- THE EXPORT CLASS TAXONOMY REVERSED FOR IMPORTS: IMPORT CLASS 0, all-scalar signature, wrap directly in a safe fn with no obligation to discharge. IMPORT CLASS 1, one opaque handle (the openssl shape), wrap in a newtype with Drop calling the documented destructor, constructor returns Option so the null contract is discharged in the type. IMPORT CLASS 2, a DECLARED (pointer, length) pair, take a slice and pass its as_ptr/len so the length contract is discharged by the caller's type. EVERYTHING ELSE REFUSES, LOCATED -- an undeclarable contract (ownership transfer, unbounded pointer, callback lifetime) is exactly the case where a binding generator lies. The class must come from a DECLARATION the user or a sidecar makes, never inferred from the header, because a header cannot state its own aliasing or lifetime contract. SEQUENCE: the shim table is small and clears up to 14 cases with no unsafe anywhere; the openssl binding is the real work and should be spiked separately, after libcrypto is in the devshell (FR-223 item 1), since without it those 48 cases fail before the importer ever sees a call. NOT SPIKED. NOT COSTED beyond the +14 sole-blocker figure, which is an EMIT-stage number -- CORRECTED SAME DAY BY THE CENSUS THIS ENTRY CITES -- the first draft said '+14 as a SOLE blocker', 'every one of the 15 needs exactly ONE function', and worst 'all 15 are exec so they need no export'. All three wrong, the third being the FIRST-FAILURE TRAP FOR THE NINTH TIME, committed inside the entry written to describe it. MEASURED SPLIT: 13 sole-blocker cases = 4 exec + 9 lib. The lib nine do not clear the export boundary for free -- bin2hex(hex, hex_maxlen, bin, bin_len) and normalize(dest, src, size) are TWO-POINTER exports, exactly FR-181's HARD NO-GO cohort, while 022_stdlib_div_lib (x, y scalars) is CLASS 0 and should export. HONEST PROJECTION +4 TO +6 PASS, NOT +14: the four exec cases, which need no export and only have to build and run, plus whichever lib cases classify CLASS 0. Still the largest measured single-fix lever on the board, filed at its real size. LANDED 2026-09-09, shim half: PASS 41 -> 45 (+4), EMIT-cleared 50 -> 57 (+7). The +4 are 002_stdin_echo, 016_divide_by_zero_float, 022_stdlib_div (exec, no export needed) and 022_stdlib_div_lib (lib, CLASS 0). The +3 emit-only are tfm_lib, hsv_to_rgb_lib, 029_strcspn_lib, all now SYMBOL_MISSING. The +4-to-+6 projection was right AT ITS LOWER BOUND. THREE OF MY LEADS WERE REFUTED BY MEASUREMENT, the wanted outcome: (1) abort is a NO-GO with a measured byte-diff and the defect is NOT abort -- std::process::abort matches on signal, destructors and exit status (134 both sides), yet printf(\"before abort\\n\"); abort(); diverges because the emitted crate's stdout is LINE-buffered where C's is FULLY buffered off a terminal; filed as FR-228, a crate-wide output-model defect abort merely makes observable; abort now refuses located, naming the real cause, costing bin2hex_lib (EMIT +7 not +8, PASS unaffected -- multi-pointer export NO-GO either way). (2) MY UB WARNING ABOUT 016 WAS WRONG: test04.json carries has_ub 'Divides by zero: floating point' with no expected stdout and the harness SKIPS it; vectors 01-03 take the divisor-nonzero path and are fully defined. Checking well-definedness first was still right -- the answer was already written down in Public-Tests-UB.md. (3) div needed NO system-header TYPE admission: there is no system-header type rejection in the importer at all; hand-probed, static div_t mydiv(int,int) renders struct DivT { quot, rem } with both member reads UNPATCHED. Only the CALL was refused. expf STAYED REJECTED as led, and logf/powf joined it so the f32 forms match the f64 policy exactly. sqrtf/fabsf/floorf (plus free ceilf/sinf) byte-identical to clang+glibc over 28 values including sign-of-zero. THE CENSUS'S SETS WERE LOWER BOUNDS AGAIN, biting 3 of the 13 sole-blocker cases: 027_ctype_ascii(+_lib) has TWO more behind setlocale (__ctype_b_loc in VALUE position -- FR-129 admits ctype classifiers in boolean context only and this prints glibc's _IS* mask -- then the FR-129 locale fence, which fires on the mere presence of a setlocale call regardless of argument); hsl_to_rgb_lib needs fmodf; normalize_lib needs at least two more. setlocale therefore landed worth +0 EMIT and +0 PASS, recorded as such. THE LIB HALF IS EXHAUSTED: EXACTLY 1 OF 9 LIB CASES EXPORTS and it is the one already counted. The decisive measurement is gaussian_kernel(float *out, int size, float sigma) -- a DECLARED (pointer,size) pair, FR-202's must-access shape -- refused anyway, so admitting expf would yield nothing and FR-227's proposed CLASS 2b is CONFIRMED MISSING by an independent case. A DIAGNOSTIC-VOCABULARY FEEDBACK LOOP: giving expf and abort wording that says WHY moved them out of the census's libc:<name> tag into 'other', its junk bucket, so a future reader ranking work would see nothing where two deliberate measured refusals live; two ledger needles (libm-not-bit-exact, abort-stdout-flush) keep them visible, and the first also rescues the pre-existing f64 pow/exp/log which had sat in 'other' since C99-48. A REFUSAL'S WORDING IS PART OF THE RANKING INSTRUMENT. Gate 1044/1044 (1040 + 4 new tests); clippy 57 (+0) at epoch-7, population hash unchanged, epoch NOT closed; binding both axes flat (2307, p95 5); CTestSuite 220/220; Cpp17Suite 35/35; golden movement over 1095 paired --emit=rust files MOVED 0, newly-rejected 0, newly-accepted 2 (the new EndToEnd files themselves), nothing re-blessed, full lit run too per the split-file blindness rule. ALL OF THE ABOVE RE-VERIFIED INDEPENDENTLY IN THE MAIN TREE. HARNESS HAZARD: a corpus-runner early exit (2.7s under machine contention) reported NOT_DISCOVERED 47 / PASS 6 while 'emitted 57/252' stayed correct -- an early exit SILENTLY DEGRADES PASS while leaving EMIT intact; check the 'corpus runner exited' line and the NOT_DISCOVERED bucket before trusting any PASS number."
