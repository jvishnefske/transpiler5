title = "The 46 late-init merges land, epoch-6 closes, and the epoch boundary immediately exposed a distortion in the new binding metric"
summary = "LANDED 2026-09-09, implements FR-213's recommendation. FR-213 established that 46 of the remaining 51 needless_late_init were sound and blocked ONLY by the epoch-6 freeze; the owner pre-authorised an epoch-7 freeze. IMPLEMENTED: FR-61b's if-expression fold generalised to emitrust.switch, plus its op->getNextNode() adjacency test replaced by FR-132's SCOPE rule (a gap of statements that cannot observe the binding no longer blocks the fold), which is what makes IF-EXPR-SUNK reachable and IF-EXPR-DIVERGE with it. The FR-61d-slice-3 tail fold was applied alongside and earned its place: clippy::let_and_return does not appear in the epoch-7 tally at all, so the lint was not merely traded. needless_late_init 51 -> 7 (different populations across the boundary, so a direction not a trajectory). THREE PINNED ENDTOEND TESTS EDITED, and one is a genuine invariant RELOCATION: deferred-mut-slice-index.c's switch leg existed on the explicit reasoning that 'the if-expression lift only ever fires on an if, so the two-program-point rendering survives, which makes this arm the isolated pin on the mut decision itself' -- which this increment makes false BY DESIGN. The FR-142 mut invariant moved to Target/Rust/deferred-mut-slice-index.mlir @index_two_point_mut, which pins the two-point spelling byte-for-byte and stays two-point because its first arm DIVERGES and the fold refuses it outright, so it is a stable home rather than a shape a later fold absorbs. All three of that test's runtime byte-diffs passed throughout; only the text leg moved. THE EPOCH BOUNDARY IMMEDIATELY CAUGHT A DISTORTION IN FR-214'S METRIC. Frozen naively, epoch-7's binding numbers were nonsense: statements 16343 -> 47654 (2.9x for a 10% file increase), depth_max 12 -> 67, ratio 11.83 -> 4.88. Cause measured: FR-207's and FR-211's chain tests emit 14,770 and 15,893 lines -- 30,663 of 47,654 statements, 64% of the population from 2 of 296 files -- and the depth-67 statement is the generated scrutinee ladder itself. They belong in the CLIPPY epoch but are machine-generated stress inputs pinning a BOUND, not specimens of emitted style. A binding-only exclusion restores it (depth_max 12, p95 5, ratio 11.71). FR-214 said the metric wanted stability before gating; this was the instability, in the first wave. THE FREEZE ALSO CAUGHT TWO UNMEASURABLE FILES: fn-symbol-collision-fnptr.c and fn-symbol-collision-recover.c pin a LOCATED REJECTION so --emit=crate deliberately produces nothing. The population guard refused to ratchet (294 linted, 2 skipped) rather than report a number over a population it could not vouch for; epoch-7 re-frozen with both excluded, now 294 files 0 skipped. Epoch-6 CLOSED naming all three edited files. All THREE consumers repointed together (clippy_eval.py DEFAULT_BASELINE, signals.py DEFAULT_CLIPPY, controller.py CLIPPY_BASELINE) because if they diverge the controller commits a file the ratchet never reads. Gate 1027/1027, clippy pinned 57 over 294 crates 0 skipped, binding pinned free_temps 2307 / p95 5, both corpus ratchets unmoved, TRACTOR 41/252, assert_comparable(7) OK. NOT a trajectory across the boundary: 93 over 268 vs 57 over 294 are different populations."
