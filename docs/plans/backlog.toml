[[items]]
id = "FR-230"
kind = "feature"
status = "spiked"
rank = 4
size = "M"
title = "'pointer assigned a non-address value' is a catch-all, not a lever: five root causes over eight cases, ceiling +3 PASS"
summary = "Opened and SPIKED 2026-09-10. 'pointer assigned a non-address value' IS NOT ONE LEVER. NO-GO AS A SINGLE INCREMENT -- FIVE root causes over EIGHT cases, ceiling +8 EMIT / +3 PASS across three unrelated features, one of which is itself a NO-GO. MY LAUNCHING HYPOTHESIS WAS REFUTED OUTRIGHT: I said the wording came from three sites in PointerRegionAnalysis (ImportC.cpp:598/656/673) and was the CTS-P3 integer-carrier straddle; the spike tagged ALL 17 emission sites (16 in ImportC.cpp, one at ImportCExpressions.cpp:6145) and NONE of those three fires for ANY of the eight. Every case falls off the END of recordPointerWrite's classifier chain at :1396 (ImplicitCastExpr switch default) or :1499 (function-bottom catch-all). THE WORDING IS A CATCH-ALL, and reading it as one cause is what made it look like a lever. THE COHORT IS EIGHT, NOT SEVEN -- read_side_info_lib never appeared in the census list. DECOMPOSITION: A pointer-typed struct-member LOAD (flip_horizontal, dequantize_granule, read_side_info, premultiply); B a reinterpreting cast over A (premultiply); C a strchr/strrchr result bound to a pointer (028); D alloca (018; asAllocCall admits only calloc/malloc); E pointer assignment used as an rvalue/condition (028, a DIFFERENT diagnostic: 'unsupported pointer expression: BinaryOperator'); F/G surface only once C and D lift. A IS A NO-GO AND NOT MERELY EXPORT-WALLED: emitArrayMemberPointerRead is the only admitted pointer-struct-member model and represents the field as an ENUM INDEX INTO AN OWNER ARRAY PROVEN INSIDE THE UNIT; all four A-cases are lib entry points whose CALLER supplies the pointer, so no owner array exists -- flip_horizontal_lib's runner builds cp_image_t { pix: &raw mut self.pix } (a real address) against an emitted pub pix: i64 (an index). Even WRITING a pointer member from a local array is refused today. No sound emission exists to hand-write and the spike correctly did not invent one. This is FR-227's ABI-faithfulness wall arriving from the importer side. A+B+member-write is +4 EMIT and +0 PASS, and THE +0 IS STRUCTURAL. Do not fund it for yield. C IS A GO ON THE MODEL, MEASURED: __emitrust_strchr(s: &[i8], c: i32) -> i64 ALREADY EXISTS and already returns index-or--1, exactly what a cursor bind needs; the hand-written target crate is BYTE-IDENTICAL to the clang -O0 native on both corpus vectors and five adversarial inputs. A differential probe prices it: a USER-DEFINED my_strchr in 028's exact loop produces NO non-address error (FR-104's paramCursorReturnQuery already classifies it), so C is small and E and F are the real cost. CORRECTION TO MY LEAD: I called the walking re-assignment 'a third consumption shape' -- it understates it; a plain single bind const char *s = strchr(in, c); is ALSO refused, because asHostedStrchrCall has NO region-source arm at all, admitting only a %s printf argument and a null comparison. D IS A GO WITH A POLICY DECISION: the surrounding code is already fine; G is that the allocation arm of local pointer planning materialises a cursor and backing but NO nonNullCell, so good()'s data = NULL; is refused (scoped, clean fix); and bad() does alloca(10) for an int* then writes data[0..9] -- 40 bytes into a 10-byte allocation, UB IN THE C. The corpus authors disabled that vector (bad.json.backup), the live good.json exercises only good(), and the clang native prints 0 rc 0 on both paths. THE bad() DECISION, MADE: round the allocation up to whole elements (ceil(10/4)) and let RUST'S OWN BOUNDS CHECK fire on the UB access -- not a synthesized trap but the same class as FR-229's over-length byte-view read, which panics index-out-of-bounds rather than reading stack garbage and was accepted on exactly that ground. C says the access is undefined so any behaviour conforms, a bounds panic is the LOUD direction, and the path is never executed by the scored vector; refusing would cost 018 and 018_lib for a path the corpus itself disabled. MY '+2 CEILING' GUESS WAS ONE LOW: 018_..._loop1_lib exports void driver(int) -- ALL-SCALAR, #[no_mangle] pub extern \\\"C\\\" -- and its runner dlsyms it as extern \\\"C\\\" fn(c_int). Export classes measured not inferred: 028 exec YES, 018 exec YES, 018_lib YES, 028_lib no (driver(const char*)), flip/premultiply no (not ABI-faithful), dequantize/read_side_info no (three pointers). PASS CEILING +3. RANKING: (1) D+G+the bad() decision -> 018 + 018_lib = +2 EMIT, +2 PASS, best ratio and the only sub-feature where every part is scoped; (2) C+E(+F) -> 028 + 028_lib = +2 EMIT, +1 PASS -- LANDED 2026-09-10, AND 'PRICE E AND F AS REAL FRONTIERS' WAS PESSIMISTIC. THE SPIKE'S UNRESOLVED QUESTION IS ANSWERED: F DOES NOT FIRE FOR 028 AT ALL, because the hosted argument goes through emitCharRegionArg and not the user-function argument gate -- so F still fires for a user-defined my_strchr (pinned as such) and never for the hosted one. FRONTIER C ALONE (classify hosted strchr/strrchr as a param-0 nullable cursor return) lifted BOTH the single bind and the walking statement form, and E turned out to be ONE ARM, ~14 lines: a BO_Assign on a tracked pointer local in emitPointerRValue that stores through the existing storePointerAssign then reads back. TRACTOR 59 -> 60, EMIT 72 -> 74; 028_lib moved EMIT_FAIL -> SYMBOL_MISSING, export-walled exactly as predicted, so PASS is +1. Verified on 415 adversarial inputs on 028 verbatim and 612 on a seven-shape probe (four loop spellings, strrchr, a non-search RHS): ZERO divergences, zero unsafe, zero clippy lints in the emitted crates. ONE EndToEnd VECTOR WAS WRITTEN AND THEN REMOVED, THE RIGHT CALL: walking on the needle 0, where the clang native SEGFAULTS because strchr(s,0) matches the terminator so s++ steps off the object -- undefined C, not a comparable difference, caught by the byte-diff oracle, and the file now says so explicitly rather than quietly omitting the case. The STRCHRBIND pin moved forward into the new positive test plus a seven-unit frontier file. RESIDUE FLAGGED NOT FIXED: RejectionLedger's strchr-result-bind tag is now largely stale since the bind it names is supported, but nothing consumes it and removing it is a hand-mirrored two-language change for zero measured gain; (3) A+B -> +4 EMIT, +0 PASS, fund only as an EMIT/diagnostic item and say so explicitly. A DIAGNOSTIC IMPROVEMENT WORTH +0 CASES AND GREAT CLARITY: RejectionLedger.cpp:708 ALREADY refines this wording by cited source line into dynamic-memory / strchr-result-bind / pointer-local-nonaddress, but citedLineAllocates does not list alloca, so 018 tags as pointer-local-nonaddress and lands in the same bucket as the four pointer-member-load cases -- PRECISELY WHY THE CENSUS READ FIVE UNRELATED FEATURES AS ONE LEVER. Adding alloca and a member-load refinement is cheap and would have prevented the whole mis-ranking; the sharpest instance yet of 'a refusal's wording is part of the ranking instrument', since here the wording did not merely hide a case, it MANUFACTURED A LEVER THAT DID NOT EXIST. Hand-mirrored contract: test/RealWorld/run_realworld.py:605-611 (_ALLOC_KEYWORDS, _AMBIGUOUS_POINTER). UNRESOLVED: whether F fires for 028's for-loop form (unmeasurable until E lifts; measured only on the equivalent while rewrite), and whether any export class could unwall 028_strchr_lib without unsafe (believed not per FR-224's doctrine, not built). ITEM (1) LANDED 2026-09-10: TRACTOR 55 -> 57, +2 PROGRAMS AT PASS (018_stack_buffer_overflow_loop1 and its _lib twin), EMIT 67 -> 69, zero regressions, gate 1061/1061. MY ANCHOR WAS INCOMPLETE IN A WAY THAT WOULD HAVE PRODUCED A NO-OP: <alloca.h> defines alloca as a function-like MACRO for __builtin_alloca, so the corpus call's DirectCallee is __builtin_alloca and matching only 'alloca' would have left 018 refused exactly as before. Both spellings now matched and pinned (the literal one needs --extra-arg=-isystem, since declared in the main file it dies earlier on 'unsupported: pointer return type'). A FIFTH anchor defect from me in one session and a subtler class: the line was right, the MATCHING CONDITION was incomplete. A MISCOMPILE THE NAIVE NULL-FLAG FIX WOULD HAVE INTRODUCED, caught by the implementer: materialising the flag defaulted to false is wrong for int *p = malloc(4); ...; p = NULL; -- the DECLARATION is the binding and takes the store-0-and-stop path, so the flag would stay false while p genuinely holds an allocation and a later if (p) would read null; seeded from var->getInit() && asAllocCall(var->getInit()) instead. CARGO BUILD CANNOT SEE THIS CLASS -- a wrong-answer bug, exactly why the byte-diff oracle is the authority. Second consequence not in the spec: a nullable allocation-backed region now inherits the shared CTS-P8 deref guard so each deref emits assert!(flag); it folds away before Rust is emitted in the corpus case, pinned positively and negatively. THE ROUNDING IS UNIFORM ACROSS malloc/calloc/alloca, a DELIBERATE deviation from a literal reading of the spec, REPORTED NOT HIDDEN. It cannot move an already-admitted lowering because ceil == exact whenever the size divides evenly (pinned both ways in alloc-size-round-up.c). It DOES widen admission for previously-REJECTED malloc shapes; an allocator-specific rule would have been arbitrary since the C is UB either way. BUT THE WIDENING IS NOT UNIFORMLY LOUD, AND THAT IS WORTH STATING PLAINLY: int *p = malloc(10) now backs [i32; 3] = 12 bytes, LARGER than the C object, so writing p[2] -- UB in C, bytes 8-11 of a 10-byte allocation -- now SUCCEEDS SILENTLY rather than trapping. For 018's shape the rounding IS loud (alloca(10) for int* written through p[0..9] panics at index 3), but the general case can round INTO the silent direction. No defined program changes behaviour so this is not a miscompile, but the emitted crate can mask a heap overflow the C had. THE TIGHTENING IF EVER WANTED: keep the rounded backing (a Rust array must be whole elements) but bounds-check against the C-DECLARED BYTE EXTENT so p[2] on a 10-byte allocation traps too. Not done, not costed, recorded so the looseness is a known choice rather than a later discovery. THE LEDGER HEURISTIC CAN BE SPOOFED BY AN IDENTIFIER, found the hard way: a probe named uses_aligned_alloca tagged dynamic-memory on BOTH binaries because citedLineAllocates keys on the whole SOURCE LINE and the substring matched inside the function name. Anyone extending that table should know it matches identifiers, not just calls. Before/after measured on identical input: unpatched [pointer-local-nonaddress], patched [dynamic-memory]; the Python mirror verified by CALLING classify_blocker with negative controls, not by eye. THE OPTIONAL MEMBER-LOAD REFINEMENT WAS DECLINED, CORRECTLY: those cases reach the same ambiguous wording, the only ledger lever is another cited-line substring, and the only discriminator is ->/. which would sweep in unrelated lines and reclassify existing entries; doing it properly needs a bespoke diagnostic at the member-load site with its own golden churn. GOLDEN MOVEMENT: paired sweep over 926 inputs, 3 hashes changed, ALL 3 the new test files moving REJECTED -> emitting, ZERO movement in the 923 pre-existing files; two new files are split-file sources REJECTED on both sides (counted rejected-by-both, not moved), and since a hash sweep is blind to split-file sub-units the full lit suite was run at the final tree state too. Clippy 57 (+0), binding flat, CTestSuite 220/220, Cpp17Suite 35/35 with manifests untouched. All re-verified independently in the main tree. ACCEPTANCE in the ranked order, each measured and reported separately: (1) DONE -- alloca joined the allocation model, the null-assign gap G closed, bad() rounds up and bounds-panics, TRACTOR 55 -> 57; (2) hosted strchr classifies as a param-0 nullable cursor return with E and F costed as their own frontier; (3) A and B NOT scheduled for yield. The ledger refinement lands with (1), since it is what makes the next census readable."
