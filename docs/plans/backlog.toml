[[items]]
id = "FR-212"
kind = "defect"
status = "no-go"
size = "M"
title = "--c-abi-exports CLASS 1 hands a &mut T to memory a C caller is entitled to leave uninitialized, in already-shipped code"
summary = "Opened 2026-09-08 by the FR-178 re-measurement spike, which surfaced it and could not pursue it. FR-182's CLASS 1 generates unsafe { f_rs(&mut *p) }, and a C caller may legally pass a pointer to an object it has NOT yet initialized -- the single most common shape for an 'initialize this struct for me' entry point, which is precisely what the export tier exists to reach. Creating a &mut T to uninitialized memory is UB in Rust's model even with no read. FR-202's CLASS 2 builds a SHARED &[u8] via from_raw_parts, at least as exposed and arguably worse since a shared ref also asserts no concurrent mutation. CLASS 0 is presumably clean. Unrecorded in both FR-182 and FR-202. NOT A KNOWN MISCOMPILE: the TRACTOR case that exercised it passed because the harness initializes first. The open question is the gap between what the Rust reference guarantees, what Miri flags, and what rustc/LLVM exploit at -O3 -- three things this ledger has conflated before. A latent model violation nobody exploits is a different severity from a silent wrong answer and must be labelled as such. ALL OPTIONS ARE COSTLY: recording it as a bounded divergence has precedent (FR-206 did exactly that for long double on the owner's decision); threading MaybeUninit through the wrapper breaks the 'translated body is TEXTUALLY UNCHANGED' property FR-182 deliberately bought and pinned; refusing out-parameter shapes refuses the very initialize_hash_function shape the tier was built for. Gated behind --c-abi-exports, default OFF. SPIKE VERDICT 2026-09-08: LATENT MODEL VIOLATION (confirmed by the letter), NOT AN OBSERVABLE MISCOMPILE. Record it, do not fix it -- every fix option is strictly worse and one was MEASURED to produce a silent wrong answer. RULE SOURCED: MaybeUninit::assume_init_mut's own worked counterexample is a no-niche plain-integer struct out-param, and slice::from_raw_parts requires 'properly initialized values' -- both unhedged. repr(C)/no-niche does NOT change it; padding IS exempt. The Reference's reference-validity clause is the hedged one ('remains a subject of some debate'). MIRI IS SHALLOW under both Stacked and Tree Borrows: creating &mut T/&T/&[u8] over uninit is CLEAN every time; only READS are reported, and both detected shapes are C UB too. NO NATIVE DIVERGENCE at -O0/-O1/-O2/-O3, debug-assertions, or lto=fat+cgu=1+target-cpu=native, over stack/poisoned-frame/malloc storage; 200 runs each gave one distinct output. WHY, from the IR: LLVM has NO attribute expressing 'this pointee is initialized' (initializes() is a WRITE fact), and &[u8] does not survive opt>=1 -- SROA splits it into exactly the bytes the source loads. STRUCTURAL MITIGATION NOBODY RECORDED: FR-182's width-fidelity whitelist refuses _Bool (8 vs 1) and enums, so every type with an invalid bit pattern is unreachable behind a class 0/1/2 reference -- only integers and IEEE floats, where every bit pattern is valid. That removes the one mechanism rustc/LLVM actually exploit. The whitelist was built for width fidelity and buys this for free. SCOPE: CLASS 0 not exposed (symmetric -- passing an indeterminate object by value is already C UB). CLASS 1 exposed. CLASS 2 exposed MORE SHARPLY: cAbiProvenSliceBound is max(index)+1 with NO contiguity requirement, so 3 of 5 pinned shapes have never-read holes inside the slice -- including hdr_bitrate, the corpus's own case (reads {1,2}, bound 3, index 0 never read), where the C caller has no UB at all. THE BYTE-DIFF ORACLE IS STRUCTURALLY BLIND TO THIS CLASS and that, not the UB, is the fact worth recording: 4 of 252 crates carry a wrapper and all 4 are plausibly callable with uninit, but ZERO are exercised that way -- the harness's state_member! supplies every field and the lit driver assigns all five members. OPTIONS: MaybeUninit NO (destroys FR-182's pinned 'body textually unchanged' property and does not even close it, since all three corpus cases READ fields). Default pre-write NO and MEASURED: where no must-write proof holds it gave native 'rc=0 seeded=2 total=43' vs patched 'rc=-1 seeded=9 total=0' -- exit 0, clean build, no warning: a SILENT WRONG ANSWER. Refusing out-params NO (TRACTOR 41->38, deletes the shape the tier exists for). Tightening class 2 to an exactly-{0..N-1} accessed set is the only clean removal of an asymmetric exposure (~4 lines at TranslateToRust.cpp:4785-4815) but costs hdr_bitrate, TRACTOR 41->40 -- the shape to reach for IF THE RULE EVER HARDENS. DEFERRED EXPOSURE AND THE TRIGGER: FR-178's +20 SPHINCS+ ceiling is the paradigm out-parameter and would arrive as a byte-region class 3 over a WHOLLY uninitialized object. Class 3 is NO-GO at +0 today so this is deferrable, BUT THE DECISION MUST BE MADE BEFORE CLASS 3 EVER LANDS. NOT RESOLVED: whether opsem lands recursive reference validity (a cargo miri gate would then go red); Miri could not be driven through a real cdylib export from a C process, so the probe omits the FFI boundary -- stated as a modelling gap, not a proof."
