summary = "LANDED 2026-09-07, FR-193's _Bool as f64 and keyword-global unbuildables. SEVERITY UNDER-STATED IN THE SPEC: the importer emits arith.sitofp %x : i1 to f64 -- a SIGNED widening, so true -> -1.0. Merely respelling the cast (bool as i8 as f64) would have BUILT and been a silent miscompile. Fix belongs in the importer: a _Bool source now takes arith.extui to i32 first, giving v as i32 as f64 -- byte-identical to the already-correct b * 2.5 sibling, whose two-hop was the tell. UIToFPOp is irrelevant (convertScalarValue, ImportCStatements.cpp:7545, already hard-rejects i1 on either side), so CK_IntegralToFloating was the only reachable site. Two guards added beyond the named site: CastOpConversion now refuses an i1 SOURCE (extsi/sitofp/index_cast are all signed; the legal spelling lives in ExtUIOpConversion), and emitrust.cast's verifier rejects i1->float. THE KEYWORD DIAGNOSIS WAS WRONG TWICE: not a struct-typed global bypassing createGlobal, and not two sites. Both the demoted-global local binding and the FR-62 actor STRUCT FIELD come from ONE function, ActorLiftPlan.cpp:114 derivedName. And ImportCGlobals.cpp:614 was never broken -- under the FR-53 idiomatic rename cGlobalSymbolName emits pub as PUB, not a keyword, and derivedName snake_cases it straight back to pub; emitrust-import-c and --preserve-c-names both still reject correctly, only the RENAMED path leaked. Escaping was measured to work everywhere else first (locals match_/loop_/impl_, param move_, fields type_/ref_ all byte-diff clean), which localised the defect to the file-scope lowerings. Fixed by appending mangleMemberName's single _ in derivedName. The pub/pub_ collision was already handled on the actor path and now warns and keeps both cells distinct; HONEST NOTE: the guard added to the demoted-local list is defensive and untested-by-construction, since a K/K_ pair always collides earlier on the synthesised type name. GOLDEN MOVEMENT ZERO, measured not assumed: a paired --emit=rust snapshot over all 282 EndToEnd inputs with reverted vs patched tools differs in exactly 2 files, both new tests. Gate 1013/1013, clippy 101 (+0), both ratchets unmoved."
