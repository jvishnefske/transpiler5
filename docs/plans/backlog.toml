summary = "LANDED 2026-08-31 on FR-181's recommendation. Admits exactly two shapes -- class 0 (every param and result a scalar or ABI-faithful struct, plain extern \"C\", ZERO unsafe) and class 1 (exactly ONE ref/mut_ref to a faithful struct, a one-statement generated wrapper carrying the unsafe, translated body textually unchanged) -- under a HARD structural cap of at most ONE reference/slice parameter, because FR-181 measured that two &mut from two C pointers are noalias while a C caller may legally alias them. The faithfulness predicate is an importer-side WHITELIST, transitive: a width-checked scalar, a non-zero fixed array of a faithful type, or a faithful nested record. Refused BY NAME: pointer members, fn-ptr members, bit-field runs, flexible and zero-length arrays, unions anywhere, anonymous struct/union members, enum members, C++ bases/dtors/vtables. THE POINTER MEMBER IS WHY THE YIELD IS +3 AND NOT FR-181's +4: it keeps the historical i64 CURSOR, the same width on LP64, so no offset assertion can catch it -- struct tflac_bitwriter carries tflac_u8 *buffer, so bitwriter_add is REFUSED and is now a required negative test (FR-181 counted it, but its clean byte-diff held only because the function never reads that field). A second narrowing nothing else would have caught, found by comparing clang getTypeSize against the emitted primitive width: long double maps to f64, a 128-bit C type silently narrowed to 64; _Bool maps to i1. Build-time backstop: #[repr(C)] plus size_of/align_of/offset_of! const-asserts from clang's own numbers on every faithful struct transitively reachable from an admitted signature, so any residual divergence is E0080 at cargo build. THE ORACLE BITES: deleting the repr(C) lines gives wide_mix=11000.000000 vs native 7011.125000 and tflac fields=64 1000 67 0 1027 vs native 64 1000 3 4 67, exit 0 no diagnostic. Fixed a cross-TU dedup defect that left the second TU's decl with no cached verdict, refusing any record containing it. MEASURED: TRA