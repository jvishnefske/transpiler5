32 on top of FR-179; +1 more (hdr_bitrate) only with a new must-access-bound analysis. SPHINCS+ is +0 today (case 053 still stops at import, re-confirming FR-177 by a second method) and +20 of 80 at the CEILING, not +80 -- 3 of the 4 symbols are multi-pointer. No new ops, no golden movement if gated on the default-OFF flag. NOT MEASURED: the harness was not run, no lit run, one platform/toolchain, the must-access analysis was not built, the faithfulness gate's coverage was not enumerated."
