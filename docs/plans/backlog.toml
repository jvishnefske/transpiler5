summary = "PHASE 1 LANDED 2026-08-29, gate 912/912 with zero golden shift. The 501-object systemd whole-program crate now EMITS: rc=0, 12,265,476 bytes, 60 ::std::slice::from_mut sites, and cargo drops from 63 errors to SEVEN, all E0596, all FR-153. The transitive element-0 fence was proved load-bearing by ABLATION -- short-circuited to true it emits the FR-75-forbidden a[0]+a[1] shape against a one-element slice, a guaranteed index-out-of-bounds panic. No new op, no dialect change; call_opaque with the from_mut callee renders verbatim. FR-153 is now the only thing between this project and a compiling whole-program crate. Split out of FR-158 2026-08-29 so the remaining work is indexed. f(&x) where x is a scalar local or struct field and the defining TU classifies that parameter as a slice. The ENTIRE residue of FR-158 Phases 1+2: 60 slots, 55 caller functions, 25 shards, top offender config_parse_unsigned_bounded with 24 -- and it is what stands between the systemd whole-program link and a crate being emitted at all. Reproduces in three files; a distinct -D per TU is required or the joint re-import rescues the pair. Directions: ::std::slice::from_mut(&mut x) is semantically EXACT (C passes a pointer to ONE object, so a one-element slice is precisely the legal range, and p[1] becomes a panic where C has UB) but slice_of accepts only array/slice bases so it needs a widened verifier or a new op; stubbing the caller at the merge was the spikes preference but deletes 55 functions behaviour with no recovery path since --link --incremental does not recover at the merge; a one-element array import has unbounded blast radius. SETTLE FIRST whether FR-158 Phase 4 (7 functions) is the same defect as FR-153 (35 crates). NOT SPIKED."
