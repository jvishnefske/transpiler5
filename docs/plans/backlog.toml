title = "A namespaced enum took no namespace prefix, falsely colliding with a root enum and silently collapsing item-graph nodes"
summary = "Opened and LANDED 2026-09-10, found while landing FR-231 and reproduced before filing. AN ENUM INSIDE A NAMESPACE TOOK NO NAMESPACE PREFIX AT ALL, AND THE ITEM GRAPH WAS SILENTLY COLLAPSING NODES BECAUSE OF IT. WORTH +0 TRACTOR (C has no namespaces) -- a correctness fix for legal C++ that was being refused. REPRO, two defects in one line: namespace lib { enum Color { Red, Green }; } beside a root enum Color { Blue, Black }; gives 'conflicting definition of enum Color with a different shape in another translation unit' -- but those are distinct enums in different namespaces so NOTHING CONFLICTS, and they are in the SAME TU so 'in another translation unit' is FACTUALLY FALSE. Isolated, a namespaced enum emitted a bare struct Color(u32) while a namespaced RECORD emitted NsLibS. ONE ROOT CAUSE: namespacePrefix was applied at exactly three sites (records, functions, globals) and THERE WAS NO ENUM SITE; importedEnumShapes was keyed on the BARE C spelling so two enums in different namespaces shared a key. enumRustName now mirrors recordRustName (prefix before the camel fold, namespaceModulePath under FR-231's flag), the dedup key is the EMITTED symbol, and the five other enumTypeRustName call sites move with it. THE FR-40 ITEM GRAPH WAS SILENTLY COLLAPSING NODES, the finding that outranks the diagnostic: on the new test the pre-fix graph emits 5 enum nodes for 7 enums (ns::Color onto Color, q::E onto p::E). CSymbolNaming.h's header says the graph's node keys must BE the emitted item names byte for byte precisely so the two cannot drift; the enum path had drifted, and ItemGraph.h's doc explicitly and wrongly said enums keep a bare spelling. Both corrected, pinned with a GRAPH-DAG leg. FIVE OF MY SIX ANCHORS HAD MOVED AND I CAUSED IT: namespacePrefix is at :279 not :265, recordRustName at :177, the call sites at :225/:808/:861 not :211/:725/:768 -- because FR-231 SHIFTED THEM AN HOUR EARLIER AND I REUSED PRE-FR-231 LINE NUMBERS. Self-inflicted staleness of exactly the kind the anchor rule exists for. There are also three parallel namespaceModulePath sites the spec never mentioned; enumRustName covers both shapes. A CORRECTION TO MY SPEC: std:: ENUMS DO TAKE THE PREFIX NOW. I said std:: types never reach this path, true for RECORDS only -- mapType diverts a RecordType in std to mapStdLibraryType before importRecord, and THERE IS NO SUCH ARM FOR EnumType. So std::float_round_style becomes NsStdFloatRoundStyle. Kept deliberately as the safe direction, since it stops a user enum float_round_style composing onto libstdc++'s; zero goldens moved because nothing in the tree emitted a std:: enum, and the pre-fix binary in fact REJECTED such a program from inside <limits>, a false clause pointing at a system header. Enum VARIANTS need no prefix, confirmed by p::E{A} beside q::E{A} emitting NsPE::A and NsQE::A with different runtime values. TWO RESIDUAL SAME-TU COLLISIONS PINNED AS REJECTIONS RATHER THAN FIXED, each now telling the truth about which TU it is in: an enum nested in a RECORD (namespacePrefix walks NamespaceDecl only, the same posture recordRustName takes for a nested class) and a BLOCK-SCOPE enum (records get a <function>_<tag> mangle; enums have none). Same-TU SAME-shape collisions still dedup silently, unchanged and deliberately: unlike a record an enum has no methods, so two identical shapes emit literally the same item and the dedup cannot miscompile. New wording with mirrored RejectionLedger/classify_blocker rows verified by CALLING classify_blocker: 'unsupported: enum X collides with the emitted name of a different enum in this translation unit' (enum-name-clash); the cross-TU wording is retained where true and now names the emitted symbol. Gate 1070/1070 (1066 + 4 new). Golden movement over 1341 files x {plain, --namespace-modules}: 0 bytes shifted under an already-emitting test, 0 emit->reject, 2 reject->emit (both the new tests, the intended flip). Clippy 57 (+0), binding both axes flat with statements unmoved, CTestSuite 220/220, Cpp17Suite 35/35, TRACTOR 57/252 (+0 as predicted). All re-verified independently in the main tree. MINOR UNRELATED NOT FIXED: ?: on enum operands is refused ('conditional operator on a non-scalar operand'), a pre-existing gap the EndToEnd test worked around with an if."
