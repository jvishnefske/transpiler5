title = "scf.while legalization fails on gperf-generated lookup tables"
summary = "LANDED 2026-08-29. The entry's root cause was WRONG -- not 'machine-generated C is a distinct shape class' but: a place-backed local declared INSIDE an unbounded-loop body whose value ESCAPES becomes an !emitrust.lvalue<T> loop-carried RESULT of scf.while, for which WhileLowering has no default value. Type-independent (unsigned, enum, struct, address-taken, fn-ptr all fail; signed ints never place-backed). Fix: a func-nested pass between lift-cf-to-scf and its canonicalize that moves the escaping operand-free emitrust.variable out of the region; the existing upstream canonicalization then drops the invariant carried value, no new ops. Fenced on emitrust.has_drop -- unfenced it deletes every drop but the last (measured). All 7 systemd units import; detect-virt now yields 501/501 shards, up from 495. Gate 900/900, zero golden churn. Residue left as a located rejection: the bounded-loop ub.poison sibling, 1 file across 1601 TUs."
