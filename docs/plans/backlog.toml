size = "S"
title = "The export gate is where the corpus's value is locked: 9 cases emit clean and export nothing, and 67 sit behind FR-181's measured miscompile"
summary = "Opened 2026-09-09, measuring the EXPORT boundary rather than the importer. THE EXPORT GATE, NOT THE IMPORTER, IS WHERE THIS CORPUS'S REMAINING VALUE IS LOCKED, AND 67 CASES SIT BEHIND A SOUNDNESS BARRIER THAT IS NOT A MISSING FEATURE. NINE CASES EMIT COMPLETELY CLEAN (emit_rc == 0) AND EXPORT NOTHING -- 8 SYMBOL_MISSING plus update_md5_lib (which scores VACUOUS_PASS only because its single vector is has_ub and skipped; symbol_present is False, so summing PASS+VACUOUS overcounts). For these the export IS the only remaining blocker. THEY DO NOT SHARE A FIX -- the cohort fragments 1/1/7. crc16(const tflac_u8 *d, tflac_u32 len, tflac_u16 crc16) alone is cheap: ONE const pointer plus a DECLARED LENGTH parameter. FR-202's CLASS 2 correctly cannot take it because that class proves a CONSTANT bound from the body and this bound is a runtime argument; but the emitted body makes the pairing visible (pub fn crcish(d: &[u8], v0: u32, ...) with for i in 0u32..len { d[i] }), so every index is provably < v0. That supports a CLASS 2b, the PARAMETER-BOUNDED SLICE: the wrapper takes *const u8 plus the existing scalar and builds from_raw_parts(d, v0). Sound on FR-202's own argument generalized from a constant to a parameter -- a C program that reads d[len-1] must already give d that many elements or it has UB of its own. WORTH +1 CASE, filed at that size deliberately: a clean class, not a lever. bitwriter_add reaches CLASS 1 and is refused on FAITHFULNESS not arity (a pointer to TflacBitwriter whose layout model is not ABI-faithful -- a pointer member emitted as an i64 cursor); harder, and FR-181 already refused it for this reason correctly. THE OTHER SEVEN take two or more reference parameters. THE WALL, MEASURED: 67 CASES, 27% OF THE CORPUS -- seven clean-emitting organic cases plus SPHINCS+'s prf_addr, gen_message_random and hash_message at 20 configs each. Every one is FR-181's HARD NO-GO, which is not a gap but a MEASURED MISCOMPILE: two &mut built from C pointers a caller may legally alias, kernel(a,b) with a == b returning 10 against the clang native's 104, exit 0, no diagnostic. FR-222's MUTABILITY INSIGHT DOES NOT RESCUE THEM, checked before assuming: exactly ONE of the 67 has an all-shared signature, hdr_compare(const uint8_t*, const uint8_t*). Every other carries at least one mutable pointer, and ONE &mut ALIASING ONE & IS UB PRECISELY AS MUCH AS TWO &mut, so the insight stops at the first output parameter -- worth at most 1 case here, not 67. WHY A C POINTER NEVER REACHES THE ARITY CAP AT ALL (FR-226, re-verified by probe): f(const uint8_t*, const uint8_t*), f(uint8_t*, uint8_t*) and f(const uint8_t*, uint32_t len) ALL get FR-139's generic 'not all-scalar' sentence, because a C pointer parameter imports as a SLICE and the sliceCount != 0 branch fires before any class analysis; the arity cap's careful wording is not even the diagnostic these shapes receive. WAYS OUT, so nobody re-derives this: restrict IS the language-level escape and &mut from a restrict pointer is sound, but NONE of the 67 declare it -- honouring it is correct, cheap and buys nothing here. Raw pointers throughout costs unsafe, which the rubric scores at zero (FR-224's doctrine: relocating an obligation is not discharging it). Copy-in/copy-out is sound against aliasing and SEMANTICALLY WRONG -- C's behaviour when the buffers really overlap is defined and staged copies do not reproduce it, which is FR-201's finding in the other direction and MUST NOT BE TRIED. The index-based single-region model (FR-201, split_at_mut) is sound and fixes INTERNAL calls but does not cross the C ABI, where the pointers arrive as genuinely separate arguments. ACCEPTANCE: this entry implements nothing. Its claim is a CEILING -- without overturning FR-181, which has a measured miscompile behind it and should not be overturned on argument alone, 67 corpus cases are unreachable. Cost any export work against these numbers first."
