summary = "LANDED 2026-09-03: MEASURED TRACTOR 31 -> 40 of 252, exec 4 -> 13, exactly the nine predicted cases with ZERO regressions; gate 972/972; clippy 101 -> 101 (+0). A 7681-case differential fuzz against clang/glibc comparing stdout, exit status AND residual stream bytes found 0 divergences. THE DEVIATION THAT MATTERS: %c needed a helper PAIR (i8 and u8) -- a single i8 helper would have made %c a platform-dependent REJECTION wherever plain char is unsigned (ARM), a trap the x86-64-only spike could not surface. The spike's one unmeasured risk is now clean: the FR-40 planner does not react to &x inside scanf. Portability handled by splitting the evidence -- the committed differential pins only C11-defined shapes while glibc edges live in helper comments and Import goldens. Original ranking follows. NOT SPIKED beyond this ranking. Measured with the FR-178 instrument: per-case blocker SETS over the 83 non-SPHINCS EMIT_FAILs, cross-tabbed with case KIND, then a greedy marginal-yield curve over the EXEC cases ONLY -- because an exec case needs no exported symbol, so for it a cleared emit set really IS a PASS. 77 of 83 measured; blocker-set sizes {0:3, 1:45, 2:28, 3:1}. Exec curve: +1 variadic call = 9, +2 FILE* stream argument = 13, +3 address-of-scalar-string-region = 16, +4 pointer-has-no-known-target = 18, +5 CStyleCastExpr = 20, +6 pointer-assigned-non-address = 22. THE FIRST TWO STEPS ARE ONE CAPABILITY, costed before ranking: the variadic blocker here is NOT printf (every hosted output variadic is already name-intercepted) but scanf/fscanf, and the FILE* blocker is stdin reaching emitFileHandleArg (ImportCHosted.cpp:130), which admits only an fopen-created function-local handle. There is no scanf, getchar or stdin recognition anywhere in lib/. The corpus really drives it: an exec vector is literally {\"argv\": [], \"stdin\": \"0\\n0\"}. So modelling standard input is worth 13 of the 34 exec cases with ZERO interaction with FR-139 or the dlsym stage. A second input capability sits beside it: 5 exec cases refused at main's argv -- but that is a FIRST-FAILURE number and therefore a CEILING, not a yield, because argv is rejected at signature import so --recover never walks the body and the rest of each blocker set is invisible until argv lands. argv machinery largely exists (argv_table type, argv_arg op, process wrapper, EndToEnd/argv-echo.c differential); the gap is the admission grammar argvUseAdmitted plus a bridge into emitCharRegionArg. TAKEN TOGETHER the exec half is gated on how a program receives its input, not on the pointer model that dominates the lib half. CAUTION: scanf is a PARSER whose failure modes C programs routinely ignore; a rendering that silently diverges on malformed input is the miscompile class this repo forbids, and the vectors are adversarial. Needs a real spike with a differential over malformed input."
