size = "S"
title = "011/012: the C is undefined and the refusal is correct, but the case is winnable by refining the UB into a deterministic panic"
summary = "Opened 2026-09-10 from FR-236's export-aware cover; READ THE VECTORS BEFORE TOUCHING THIS. 4 cases (011_uninit_char_ptr, 012_uninit_int_ptr, each exec + lib), refused today with 'unsupported: pointer variable data has no known target object' at depth 1. ALL FOUR CHECKED AND ALL FOUR HOLD UP, WHICH MAKES THIS THE BEST RATIO ON THE BOARD: 4 CASES BEHIND ONE BLOCKER. Every one is depth 1; all four ship a real good vector beside the skipped has_ub one; and both _lib halves EXPORT (driver, matched exact, via plain no_mangle) so neither meets FR-227's wall. Compare FR-237, which I filed as '4 cases' and had to correct to 2 for exactly the check run here. THE C, measured: void bad() { char *data; printLine(data); } -- an UNINITIALIZED pointer read and passed, which is undefined behaviour, so emitrust-cc refusing it is RIGHT and 'model an indeterminate pointer' is not a coherent request. WHY IT IS NEVERTHELESS WINNABLE, the part a blocker name cannot tell you: the corpus ships two vectors and TAGS the UB one -- bad.json carries has_ub 'Program is killed after segmentation fault' and the harness SKIPS it, while good.json (stdin 1) takes the initialized path and expects 'string'. Only the well-defined path is ever scored. THE LEGAL MOVE: since the bad() path is undefined, ANY behaviour is conforming, including a DETERMINISTIC PANIC -- the refinement this tree already applies elsewhere ('C undefined behavior refined into a deterministic panic'). Emitting bad() as a panic lets the crate emit, build and run the scored path. What is NOT legal is choosing a value for data and carrying on. CAUTION: a case whose ONLY vector is has_ub scores VACUOUS_PASS not PASS (update_md5_lib is the live example); 011/012 each keep one real vector so they can score properly, but verify that before costing any sibling by the same argument. LANDED 2026-09-10 AT +4 EMIT AND +4 PASS -- TRACTOR 60 -> 64, EMIT 74 -> 78, all four named cases individually PASS. The first item this session to move PASS and the only queued one that survived all three ranking axes. THE PANIC GOES AT THE USE, WIDENED TO THE ENCLOSING EXPRESSION STATEMENT, NOT AT FUNCTION ENTRY WHICH IS UNSOUND: void pick(int c){ char *data; if (c) printLine(data); else printf(ok); } has a fully defined c==0 path and a function-entry panic miscompiles it (pinned twice, as an --emit=rust golden and a runtime byte-diff). Statement granularity rather than EXPRESSION granularity because a !-typed hole has no representation in this value model: PtrExprValue must be handed back and fabricating one after a panic IS the 'invent a value' failure; replacing the whole statement evaluates no argument and fabricates no address, and the emitter's existing diverging-callee rule truncates the rest of the block. THE ORACLE CAUGHT A MISCOMPILE cargo build NEVER SAW, the most instructive thing here: the first cut broke c-testsuite 00219, which declares an uninitialized const int *const ptr and asks _Generic(ptr, int *:1, int * const:2, default:20). C11 6.5.1.1p3 says the controlling expression of a generic selection IS NOT EVALUATED, so the program is well defined and prints 20 -- but clang's AST still spells the operand with an LValueToRValue cast because the selection is made on the CONVERTED type. Counting that as a read panicked a defined program and the build was clean the whole time it was wrong. collectPointerVarReads now skips GenericSelectionExpr controlling expressions (descending only into the selected association), UnaryExprOrTypeTraitExpr and OffsetOfExpr; skipping a subtree can only LOSE a panic, never manufacture one. Regression-pinned. MY SUGGESTED PRECEDENT WAS REJECTED WITH A BETTER REASON THAN I HAD: returning PtrExprValue{} (the statically-null path) for an UNINITIALIZED pointer would fold its null tests to FALSE and (int)p to 0, which is inventing the value NULL, exactly what the spec forbade. An uninitialized pointer is not the neighbour of a statically-null one; it has no value at all, which is why the answer had to be a diverging STATEMENT rather than a representation. TWO INDEPENDENT NEVER-WRITTEN CHECKS, the syntactic one load-bearing: for char *data; char **pp = &data; the address-of is CONSUMED by the CTS-P5 second-order binding so it does not invalidate the region and regionOf(data) stays null -- the region analysis alone would wrongly call it never-written. ADMITTED: an expression statement free of &&/||/?:/({...}) containing an lvalue-to-rvalue read of an automatic pointer local with a null region, not address-taken, not pointer-to-pointer/pool/carrier, never written under the function body. LEFT REFUSED with today's wording unchanged: if/while conditions, return, DeclStmt initializers, short-circuit and conditional operands, for increments, write-through, globals, parameters, struct members, second-order pointers. A pointer uninitialized on SOME paths stays refused -- a false panic on a defined path is a miscompile and strictly worse than the status quo. THREE CORRECTIONS TO MY SPEC: 012 does NOT match the repro I gave (it dereferences *intNumber with no null guard and its good() takes the address of a local rather than a string literal; only 011 matches); printLine's line != NULL test plays NO role because the parameter lowers to &mut [i8], a slice that is never null, so the test folds to unconditional true; and the lib halves route through the IDENTICAL entry point, differing only in driver vs main. Gate 1089/1089 (1086 + 3 new), clippy 57 (+0) with population 294 files / 0 skipped / hash unchanged, binding 2307 (+0) and p95 5 (+0), CTestSuite 220/220, Cpp17Suite 35/35 both miscompiled=0, golden movement 0 from a paired sweep over all 1141 test sources. Verified independently in the main tree including running corpus case 011 by hand: emits, builds, prints string on stdin 1, matching its good.json. ACCEPTANCE: 011 and 012 emit and the good vector byte-diffs against the clang native; the UB path must abort loudly and must never produce a value."
