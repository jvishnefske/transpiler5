summary = "Opened 2026-09-11. Both existing conformance ledgers are SATURATED (CTestSuite 220/220 of the submodule's single-exec programs, Cpp17Suite 35/35) so a new suite is the only open frontier. User decision: llvm-test-suite as a git submodule (third_party/llvm-test-suite, shallow=true), the C++ analog of third_party/c-testsuite. TWO COMMITS because lit auto-discovery is a hair trigger. (a) corpus, no lit test yet: pinned-SHA submodule; test/CppStdSuite/curate_candidates.py (never run by lit/CI) enumerating SingleSource/Regression/C++, SingleSource/UnitTests, SingleSource/Benchmarks/Misc-C++; .cpp suffix only; drop files whose sibling build files declare RUN_OPTIONS/stdin/extra sources/defines/HASH_PROGRAM_OUTPUT; require standalone clang++ -std=c++17 build; run natively TWICE in different cwds requiring exit 0, byte-identical stdout, under ~2s, no files outside cwd; target 100-300 survivors in candidates.txt (relative paths ARE the ledger names; workdirs keyed on sanitized relpath since basenames collide); expected/<relpath>.expected generated once from pinned clang 21.1.8, NOT *.reference_output (missing/appended lines/fpcmp tolerances). (b) ledger live: run_cppstd_suite.py thin wrapper; cppstd-suite.cpp lit driver (REQUIRES: cargo); lit.local.cfg parallelism_group heavy-harness MANDATORY same commit (fast tier can OOM an 8GB host, misreported as MISCOMPILEs); expected-pass.txt day-one MEASURED via --update (from-zero ratchet valid); day-one MISCOMPILEs go to known-miscompiles.txt AND get a defect FR same commit; missing submodule = HARD FAIL with init hint (UNSUPPORTED-skip rejected: it would drop the ledger while the gate stayed green); CLAUDE.md worktree rule gains the second submodule (with --reference note); spike-worktree-setup.sh updated if it inits submodules. Tier: auto-joins fast, wall-time delta recorded, third-tier tripwire noted."
