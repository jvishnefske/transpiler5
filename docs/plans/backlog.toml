summary = "PHASES A+B+C ALL LANDED 2026-08-30; phase C shipped WITH FR-166 phase 2 in one increment because phase 2 alone is a measured silent miscompile. Gate 938/938, corpus 12,415,236 bytes, cargo 0 errors, and the ENTIRE corpus delta is EPOLL_EVENTS being admitted -- two functions going from unimplemented stubs to real bodies. The mixed failure direction was reproduced before fixing: with phase C reverted one shape miscompiles silently while three fail as located rejections. Four brief premises falsified: three pins flipped not one (one a live fast-tier failure); the does-not-fit-in-i32 diagnostic is now UNREACHABLE from C and C++ because clang widens rather than hand over an out-of-range 32-bit enum, so it survives only at the dialect verifier; verifier check ordering had to change so the negativity check precedes the range check; and phase C is NOT byte-identical for WIDE unsigned enums since clang gives the DeclRefExpr the promotion type. PHASES A+B LANDED 2026-08-30. I FILED THIS AS UNREACHABLE AND THAT WAS FALSE: it was a LIVE miscompile at HEAD, verified myself -- enum M {M_A=1,M_B=2} with an object holding 3e9 gives native 1 0 0 against crate 0 1 0, with both enumerators in i32 range and no patch. My error: the i32-range guard bounds ENUMERATORS, not the values an enum-typed OBJECT can hold; C17 makes the enum type compatible with an implementation-chosen integer type and clang picks unsigned int when no enumerator is negative. 5 of 16 value-driven shapes miscompiled, all enum-vs-enum relational. Fix uses a promoted-int cast at two sites only, taking signedness from the EnumDefOp marker rather than clang promotion so churn stays tiny, and the ui32 cast lets an identity-fold collapse the tail so output gets SHORTER. Six other sites left alone with measured reasons. Phase B fixed a ninth seam emitting arith.sitofp on an enum operand. Churn: 1 lit golden, corpus -688 bytes, cargo 0 errors, gate 934/934. MISCOMPILE found by the FR-166 spike 2026-08-30, unreachable today and that is the only reason it is not live. castEnumToI32 at ImportCExpressions.cpp:7370, called from 8 sites, casts both relational operands to signed i32 whatever the underlying type. With the range opened: enum M { M_MAX = 4294967295u } gives native cmp 1 1 1 versus rust cmp 1 0 1, because 4294967295 as i32 is -1. HEAD is safe only because the i32-range guard makes such a value unreachable -- so that guard is load-bearing for CORRECTNESS, not merely representation. Must be fixed before any 32-bit-unsigned relaxation: the relational path needs an unsigned emitrust.cmp rather than a signed arith.cmpi. Payoff inside systemd is ~2 items but EPOLL_EVENTS is a glibc enum so the reach past systemd is much wider. NOT SPIKED."
