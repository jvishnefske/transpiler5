size = "L"
title = "The char-pointer byte-view family: 12 programs, a zero-unsafe to_ne_bytes lowering, and four shapes that must stay refused"
summary = "Opened and SPIKED 2026-09-09. THE CHAR-POINTER BYTE-VIEW FAMILY -- GO WITH CONSTRAINTS, 12 PROGRAMS NOT 4, and the spike found a DEFECT IN THE CENSUS on its way past. THE BRIEF WAS WRONG IN THREE MEASURED WAYS: (1) it is 12 programs -- 034/035/036/037/038/039 x {exec,_lib} -- and 035/038 are the FLOAT variants the brief never mentioned; six are exec. (2) 'CONFIRMED sole blocker' was FALSE for 037/038/039, proven IN SITU: neutralise ONLY the memcpy in the real corpus file and the NEXT blocker appears in the same function; 039 then needs a THIRD. (3) The cause is a defect in scripts/tractor-census.py (see FR-223's correction): it counted only 'dropped' while RejectionLedger prints stubbed OR dropped, and a stubbed item hides its interior identically -- 138 stubbed against 12 dropped corpus-wide. THE ZERO-unsafe ANSWER, verified by byte-diff on 22 vector/input pairs: for a scalar T::to_ne_bytes(x) into a synthetic [u8; N] local; for an aggregate, per-field to_ne_bytes scattered AT THE FIELD'S BYTE OFFSET in C declaration order, which makes Rust's own layout irrelevant and is why this is sound where transmute is not. THE NO-PADDING PROOF IS ALREADY IN THE IR as emitrust.abi_layout {align, offsets, size} on struct_def -- clang's own numbers. NO NEW DIALECT OPS for any shape; f32/f64::to_ne_bytes flow through call_opaque unchanged and only neBytesTypeName (ImportC.cpp:3019, integer-only) must widen. Existing machinery: emitWideByteStore (ImportC.cpp:3078), emitWideByteLoad, annotateAbiFaithfulness; isByteRegionRecord is only a PARTIAL precedent since it demands unsigned char leaves and REPLACES the struct with [u8; N]. FOUR SHAPES MUST STAY LOCATED REJECTIONS, two of them MEASURED MISCOMPILES: (1) PADDED AGGREGATES -- one program, one clang -O0 binary, same struct value, two different byte strings (0100000007000000 clean stack vs 01dddddd07000000 after dirtying the frame); padding is INDETERMINATE and this is exactly the byte-diff oracle's uninitialized-memory blind spot (FR-212); admit only when size == sum(field sizes) with contiguous offsets from abi_layout. (2) A BYTE VIEW WHOSE CALLEE WRITES, WITH NO WRITE-BACK -- native -1431655766 against a naive Rust 1, silently wrong; always write back via from_ne_bytes or refuse (dead-store elimination removes the write-back when the object is never read again). (3) AN ESCAPING BYTE VIEW -- already refused as 'pointer assigned a non-address value', and THAT GUARD IS WHAT MAKES THE NON-ESCAPE PREMISE HOLD FOR FREE; do not touch it. (4) THE GLOBAL + *p++ AGGREGATE WALK, pinned deliberately in byte-region-aggregates-invalid.c; 036 differs on both axes (local object, p[i] indexed) so admitting it means SPLITTING that pin, not deleting it. HONEST YIELD LADDER in PROGRAMS at the PASS stage (A scalar byte view at a slice arg, Af float widening, B padding-free aggregate view, C memcpy with an object-representation source, D the i8/u8 domain crossing, E (unsigned char*)&arr, S scanf %f out of family): A -> +2; A+Af -> +3; A+Af+B -> +5; +C+D -> +7/+8; +E -> +10; +S -> +12. Non-family residue is ZERO for 10 of 12, measured by replacing each driver body with a supported byte print in the real corpus sources; 035 and 038 report only scanf %f. The _lib twins are NOT FR-224's export trap -- their exported signature is a by-value scalar emitting #[no_mangle] pub extern \\\"C\\\" fn driver(_x: i32) with zero unsafe -- but they die at emit, so THE LIB HALF IS PROJECTED, NOT MEASURED. A HARD VERIFIER STOP: slice_of cannot bridge i8 to u8; the zero-unsafe route is a copy-in/copy-out [u8; N] view with per-byte as u8 / as i8, bit-preserving in Rust and round-tripped through the dialect. LARGEST UNRESOLVED UNKNOWN, reported not guessed: where the post-call WRITE-BACK hook goes -- GlobalWriteback exists for lvalues but the argument path returns a Value while the call op is built by its caller, and RejectionLedger.cpp:236 says outright that 'the method-call path has no writeback flush'; it cannot be settled without writing the code. Also unresolved: which rendering the borrow-bundle planner picks for the synthetic byte-view local (probes show both an &mut [u8] slice and an owner-bundle method for near-identical inputs) -- both safe, so the risk is to golden SHAPE not correctness. GOLDEN MOVEMENT TO EXPECT: the Kernel rejection report pins 1060x CStyleCastExpr, 842x the scalar-as-slice wording, 6x the element-type wording -- EVENT counts over kernel sites, NOT programs; they will move and must be re-verified, never re-blessed. Any new wording needs a row in BOTH RejectionLedger.cpp and run_realworld.py's classify_blocker, hand-mirrored by contract; all four current diagnostics classify as [other] today. WAVE 1 LANDED 2026-09-09: TRACTOR 45 -> 50, +5 PROGRAMS AT PASS, THE SPIKE'S PROJECTION EXACTLY. Newly PASS: 034_cast_to_char_ptr_int, 034_..._lib, 035_cast_to_char_ptr_float_lib, 036_cast_to_char_ptr_struct, 036_..._lib; zero regressions, zero other outcome changes; EMIT 57 -> 62. THE _lib TWINS ARE NOW MEASURED not projected -- they clear dlopen+dlsym with zero unsafe. 035 exec still blocks on scanf %f (always out of wave). THE WRITE-BACK UNKNOWN RESOLVED WITHOUT ARCHITECTURAL WORK: pendingStagedGlobalStores already proved a post-call flush point exists in emitCall; it is mirrored as an EXPLICIT OPT-IN OUT-PARAM (the FR-146/147 allocBacking idiom) rather than a member vector, so a call path with NO flush point takes a LOCATED refusal instead of silently dropping the store. RejectionLedger.cpp:236's note is confirmed TRUE -- the C++ method-call path has no flush -- and a byte view there refuses, pinned; the FR-93 dispatch arm deliberately does not opt in. FIVE DEVIATIONS FROM THE SPEC, all improvements, two of them corrections to facts I asserted: (1) MY ANCHOR WAS WRONG -- 034/035 do not reach ImportCExpressions.cpp:6788, they die earlier at ImportC.cpp:4113 CStyleCastExpr, and the :6788 message is UNREACHABLE for the (u8*)&x spelling; I passed the spike's anchor through without re-verifying, the exact failure CLAUDE.md warns about. (2) The view is matched SYNTACTICALLY in emitBorrowArgument, NOT in emitPointerRValue's cast branch -- a byte view is a materialized COPY and a PtrExprValue carrying one would be a miscompile the moment another consumer treated it as the object's address; this is also why the golden sweep measured 0 MOVED. (3) root is the viewed VarDecl, not null, so f((u8*)&x, &x) routes into the existing aliasing rejection instead of having the callee's writes stomped by a stale reconstitution. (4) A CK_NoOp qualification peel was required -- (unsigned char*)&x feeding a const unsigned char* parameter arrives wrapped in an implicit cast stripTrivia does not strip, and without it the whole const-parameter half of the family fell through silently. (5) Non-scalar members keep the OLD wording to minimise pin churn; padding gets new wording because 'non-byte members' is factually wrong for {char; int;}. Three new refusals, each mirrored in BOTH RejectionLedger.cpp and run_realworld.py's classify_blocker and each verified through --recover AND classify_blocker directly, none landing in the other bucket: 'byte view of an aggregate with interior padding', 'byte view of the global object X', 'byte view with no write-back point for the callee's writes'. THE PIN WAS SPLIT FORWARD, NOT WEAKENED: int-leaf-view.c is unchanged as source and still refuses (now naming the GLOBAL), and a second sub-unit int-leaf-array.c keeps 'byte view of an aggregate with non-byte members' pinned at its own site -- both halves of the original claim survive. ADVERSARIAL PROBES all correct, including an over-length read (UB in the C) PANICKING with index-out-of-bounds rather than reading stack garbage. Gate 1052/1052, clippy 57 (+0), binding flat, CTestSuite 220/220, Cpp17Suite 35/35, golden sweep 1104 sources with 0 MOVED. All re-verified independently in the main tree. ONE STALE ARTEFACT FLAGGED NOT RE-BLESSED: test/Kernel/linux-6.6.94-allnoconfig/rejection-report.txt records 1060x CStyleCastExpr and 842x the scalar-as-slice wording over kernel SITES, now stale for byte-view-shaped sites; NOTHING in the build or test system reads that directory (verified -- it holds only the report and a ratchet-manifest.txt that nothing ratchets), so it is a recorded snapshot in the evidence ledger, not a gated golden. ACCEPTANCE, SPLIT INTO TWO WAVES. WAVE 1 (A+Af+B) -- DONE, measured +5: scalar and padding-free-aggregate byte view at a slice argument with MANDATORY write-back; float widening of neBytesTypeName; padded aggregates, global bases, *p++ walks and escaping views each refused LOCATED with its own ledger needle; the byte-region-aggregates-invalid.c pin SPLIT rather than deleted; runtime byte-diff on all four shapes; TRACTOR measured and reported as PROGRAMS. WAVE 2 (C+D+E) LANDED 2026-09-10, measured +5: TRACTOR 50 -> 55. Newly PASS: 037_cast_to_char_ptr_int_no_strict_aliasing, its _lib, 038_..._float_..._lib, 039_..._struct_..., its _lib. The spike's projection exactly again; zero regressions, zero other outcome changes; EMIT 62 -> 67. THE FAMILY IS NOW 10 OF 12 -- 035 and 038 exec are short only on scanf %f (capability S, always out of wave). WAVE 2 INTRODUCED NO NEW REFUSAL WORDING AT ALL: every rejection routes into a Wave 1 or pre-existing string, so no new RejectionLedger needle was needed and nothing new landed in the census's other bucket (verified by calling classify_blocker directly and by --recover tag pins). FOUR DEVIATIONS, three better than specified: (1) MY ANCHOR WAS WRONG AGAIN, THE SAME CLASS OF ERROR AS WAVE 1's -- I gave ImportCExpressions.cpp:6810 as the element-type gate; :6811 is the STRING-LITERAL-BACKING gate, the local-array one is :6984, and NEITHER is reached because emitPointerRValue dies first at ImportC.cpp:4119. Twice in two waves I passed a spike's anchor through without re-verifying. (2) Capability D is NOT the per-byte unrolled 'as u8' I described -- unrolling N casts is O(N) emitted statements needing an arbitrary size cap plus a new refusal wording; the implementation uses two const-generic safe helpers, __emitrust_bytes_as_u8<const N>([i8; N]) -> [u8; N] and its exact inverse, riding call_opaque: O(1) emitted code, no cap, no new wording, still zero unsafe, still bit-preserving per byte. (3) Capability C materializes NO intermediate image -- memcpy(raw, &obj, sizeof obj) scatters each component's to_ne_bytes straight into the DESTINATION at the C offset past the destination cursor via emitWideByteStore, so memcpy(w + 8, &x, 4) works for free. (4) (unsigned char *)&arr over an already-u8 array makes NO COPY -- it borrows the region, joining the decay spelling's lowering, since a copy would be a needless behaviour change for a mutating callee; pinned with an AV-NOT on the helper name. The domain crossing is intercepted ONLY when the domain must cross, which is why the sweep measured 0 MOVED for the second wave running. REPORTED NOT STRETCHED, four shapes left refusing and each verified located: the memcpy object-representation DEST direction (the acceptance line said source/dest but the corpus needs only source); the implicit-conversion spelling print_hex(raw, n) with no cast, a BitCast node that would have muddied the sweep; a MEMBER byte array (unsigned char *)s.buf, since the matcher requires a DeclRefExpr; and a partial/windowed view ((unsigned char *)&raw[1], memcpy(raw, &x, 2)), for which the copy-out has no windowed form. All four pinned as negatives. ADVERSARIAL PROBES: aliasing rejections hold, two distinct mutably-viewed arrays are byte-identical to native, and an over-length read (UB in the C) panics index-out-of-bounds rather than reading stack garbage. byte-view-invalid.c prose item (5) CORRECTED not weakened -- its array-base.c sub-unit (int a[3]) is now explicitly the REJECTING side of the symmetry pin; RUN and CHECK lines untouched. Gate 1056/1056, clippy 57 (+0), binding flat, CTestSuite 220/220, Cpp17Suite 35/35, golden sweep 1108 sources with 0 MOVED. All re-verified independently in the main tree. WAVE 3 LANDED 2026-09-10: scanf %f, +2 PASS, AND THE FAMILY IS NOW 12 OF 12 (035 and 038, both exec). TRACTOR 57 -> 59, EMIT 70 -> 72. THE PARSE HAD TO BE BIT-EXACT NOT CLOSE, because these programs print the float's RAW BYTES through the very byte view Waves 1-2 built. Verified not assumed: 120,000 random values (f32/f64 bit patterns, long digit strings, exponent forms, halfway cases) BYTE-IDENTICAL, and all six corpus vectors exact including -0 -> 00000080 (negative zero, not 00000000); re-checked by hand in the main tree. FR-183's REFUSAL WAS RIGHT AND ITS REASON SURVIVES: glibc's %f accepts 0x1p3, inf, nan(chars), Rust's parser takes some and not others, and the input arrives from RUNTIME STDIN so it cannot be refused at compile time. Resolution: greedy C-syntax scan + Rust's correctly-rounded parser, with a LOUD PANIC on the two forms Rust cannot reproduce. Measured: 4,352 malformed inputs gave 4,233 byte-identical and 119 LOUD PANICS, every one classified (87 hex, 32 nan-payload), ZERO silent divergences; confirmed by hand that 0x1p3 prints 00000041 natively and panics at rc 101. HEX FLOATS ARE A PANIC NOT AN IMPLEMENTATION AND THE MEASUREMENT IS WHY: glibc accepts 0x.p3 as the value 0, a quirk outside the C grammar, so even a full ~20-line hex scanner would still diverge -- implementing it would have bought the appearance of coverage and not exactness. Admitted %a %e %f %g either case onto float*, same with l onto double*; %Lf stays refused (x87 80-bit). Four frontier pins in stdin-scan-invalid.c were FLIPPED FORWARD into positive tests, not deleted, and replaced by four new ones (%Lf, %lc, both argument-type mismatches). Gate 1076/1076 at that point; golden sweep 0 byte-moved."
