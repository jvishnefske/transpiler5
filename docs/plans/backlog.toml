title = "p[-1] is not an as-usize bug; the two pointer models disagree about the base place"
summary = "LANDED 2026-09-07, FR-193 item 4. Confirmed the divergence by measurement first: ONE array in the TU -> 7 byte-identical; TWO arrays -> cargo build CLEAN then index out of bounds ... 18446744073709551615. Both models carry an i64 cursor and both add the displacement in i64 BEFORE the as usize, so the cast was never the cause. They differ in the BASE PLACE. Owner model (planOwners, one storage base): base is the receiver's WHOLE array, the pointer param IS the cursor, so self.data[(p + -1i64) as usize] with 1 + -1 = 0 hits a real element. Phase-1b slice model (>=2 storage bases, ImportCPlanning.cpp:311): the base offset is consumed AT THE CALL SITE by slice_of -> &mut a[1..] and the callee's cursor is re-initialised to 0 (ImportCFunctions.cpp:1873-1875), so the base place is the TAIL ONLY and the element is not in the slice at all. Fenced structurally on exactly that (base type is SliceType AND cursor folds provably negative), not on the symptom. THE FIRST FENCE WAS TOO WEAK AND THE SUITE DID NOT CATCH IT -- a widened probe did: p--; return *p still emitted p[(-1i64) as usize] because the cursor cell has two stores; strengthened to the last store ahead of the load in the load's own block, falling back to the one-store rule across block edges. p[-1] through a pointer LOCAL is fine even with two arrays, so the defect is pointer PARAMETERS specifically. The genuinely-OOB case is now refused at import rather than reading garbage. COST: element access through a slice-classified pointer param at a provably-negative cursor (p[-c], *(p-c), q = p-c; *q, p--; *p) with >=2 storage bases -- all previously PANICKED at run time, so no correct answer was lost. RESIDUE STATED PLAINLY: int k = -1; p[k] and a loop-carried q-- still build clean and PANIC on well-defined C; no static fold can prove those negative. The only fence that would catch them (reject unless provably non-negative) was built and measured at 43 fast-tier failures including CTestSuite 220->216 (00182, 002