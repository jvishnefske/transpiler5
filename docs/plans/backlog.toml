[[items]]
id = "FR-208"
kind = "defect"
status = "landed"
size = "S"
title = "--c-abi-exports emits a symbol the C program never had, whenever the C name is not lowercase"
summary = "Opened 2026-09-08 by the FR-178 re-measurement spike. The flag's whole contract is 'there is a bare symbol to dlsym', but #[export_name]/#[no_mangle] are written from the MLIR symbol -- the FR-53 IDIOMATIC RENAME, not the C spelling. TranslateToRust.cpp:5613 writes the name under a comment calling it 'the BARE C symbol'. It is not. MEASURED: int SPX_pair_sum(Pair *p) emits #[export_name = 'spx_pair_sum'] where the C caller wants SPX_pair_sum; CLASS 0 has it too. PROVEN END TO END TWICE: a link probe shows nm -D carrying T spx_initialize_hash_function while the C host fails with undefined reference to 'SPX_initialize_hash_function'; and a corpus-runner NEGATIVE CONTROL with the export name set to what the emitter actually produces reports Test Vectors Failed: 1, i.e. exactly the SYMBOL_MISSING bucket. The failure is LOUD (dlsym returns NULL), so not a miscompile -- a correctness gap in the flag's stated contract. CORPUS COST TODAY +0: the only five uppercase dlsym'd symbols are the four SPHINCS+ ones and smallestValue, all EMIT_FAIL. LATENT, which is exactly why it must be fixed before anyone counts a SPHINCS+ win -- it would have silently eaten one. --preserve-c-names avoids it but is a whole-crate mode switch. Fix: carry the original C spelling on the func op; --preserve-c-names output proves the target text. The adjacent name-FOLDING collision case is already handled correctly and loudly. LANDED 2026-09-08. A THIRD SITE THE ENTRY DID NOT NAME: TranslateToRust.cpp:5567, the FR-179 actor wrapper, had the same bug; fixed and pinned. THE PROPOSED FIX WAS SUBTLY WRONG -- func->getName() is NOT the string to carry. The named oracle (--preserve-c-names) and the raw C identifier are different strings, so the fix calls the SAME cFunctionSymbolName with idiomaticRenameEnabled() temporarily off, preserving main->c_main, the Rust-keyword mangle and FR-114 overload suffixes. The C spelling was NOT already available (emitrust.c_name exists only on emitrust.variable, never on a func), so a new emitrust.c_symbol attribute was necessary. THE ATTRIBUTE IS SET ONLY WHEN THE SPELLING DIFFERS, which is what keeps goldens still: that makes it structurally invisible to emitrust-import-c, which never enables the rename. CLASS 0 had to change ATTRIBUTE KIND, not just its string, since #[no_mangle] can only export the item's own name. C++-linkage functions deliberately untouched -- their real symbol is an Itanium mangling neither spelling approximates, and that is exactly where a collision could exist; isExternC() removes the risk. main excluded on purpose. MEASURED: nm -D before 'T spx_add T spx_pair_sum', after 'T SPX_add T SPX_pair_sum'; a C host went from linker failure to running and printing 7 7. --link SHARDS HANDLED: the attribute survives shard serialization, and the collision it could introduce does not exist -- the merge already refuses folded spellings, located, and export names are injective by construction. --preserve-c-names is now a no-op for the export name, proven at the dlsym level. GOLDEN MOVEMENT ZERO: 2146 paired invocations per side over 1073 files in both flag states; flag OFF is 1073/1073 byte-identical. COST: a C name that is a Rust keyword still exports the mangled spelling (match -> match_), in both naming modes; pinned so it cannot drift. Gate 1023/1023, clippy 101 (+0), ratchets unmoved, TRACTOR 41/252 unchanged -- CONFIRMING the FR-178 census, since all five uppercase-symbol cases are still EMIT_FAIL."
