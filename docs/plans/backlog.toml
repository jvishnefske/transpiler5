title = "errno is not modelled at all and its refusal is invisible to the instrument that ranks all work"
summary = "Opened 2026-09-10, verified by CALLING both mirrors. A RejectionLedger gap first, a feature second. MEASURED: errno = 0 expands to *__errno_location() = 0 and is refused with 'unsupported pointer expression: CallExpr'; I called classify_blocker directly on that string and it returns `other`, the junk bucket, so errno never appears as a lever in any census ranking. FOUR CORPUS PROGRAMS ARE NAMED FOR IT -- 007_errno_pow, 023_struct_and_errno, 025_struct_and_errno_and_static, and the hidden 014_errno-pow-subfunction -- and a reader ranking work from the census would never learn that. Exactly the hazard CLAUDE.md's 'a refusal's wording is part of the ranking instrument' rule names, and the SECOND instance this session (FR-230's missing needle was the first, and it did worse than hide a case: it manufactured a lever that did not exist). THE CHEAP HALF IS THE VALUABLE HALF: give the __errno_location shape its OWN located diagnostic and a matching RejectionLedger needle, with the run_realworld.py mirror in the SAME commit, verified by CALLING classify_blocker rather than reading it -- worth doing EVEN IF errno is never modelled, because it makes the size of the errno question visible to whoever ranks next. THE EXPENSIVE HALF, actually modelling errno, is NOT scoped here and should not be started from this entry: C's errno is a thread-local lvalue that libc writes as a side effect, the supported subset has no image of it, and FR-234 rung 1 already scoped the ERANGE half of strtol's contract out explicitly for this reason. ACCEPTANCE: errno = 0 and a read of errno each produce a located diagnostic naming errno, both mirrors agree under a direct classify_blocker call, and the census shows an errno tag instead of other. +0 TRACTOR expected and that is the point."
