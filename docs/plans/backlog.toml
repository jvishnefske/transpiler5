title = "long double -> f64 is a known, bounded, owner-accepted divergence -- recorded, not fixed"
summary = "OPENED 2026-09-07, FR-193 item 9. ImportCTypes.cpp:153 maps long double to f64 as a DELIBERATE PINNED POLICY (CTS 00204 / C99-8) asserting the substitution is unobservable because the supported shapes perform no long-double-only arithmetic; pinned by test/Import/C/long-double-f64.c. THE ASSUMPTION IS TRUE OF THE CORPUS AND FALSE IN GENERAL: re-read at HEAD, CTS 00204 only stores/copies/prints (%.1Lf), the pinned test does conversions and a select, varargs-monomorph passes and prints -- NO GATED TEST PERFORMS LONG-DOUBLE ARITHMETIC. But a mantissa-bit count (while (1.0L + ld != 1.0L) { ld /= 2.0L; c++; }, fully well-defined C, only halving and an exact equality test) measures native 64 vs emitted 53, exit 0 both sides, cargo build clean, ZERO diagnostics. It walks through both existing fences (sizeof/alignof and %La/%LA), which guard the width and the hex-float spelling but not arithmetic. OWNER DECISION 2026-09-07: leave the policy, record the divergence. Widening the fence to reject long-double arithmetic was costed and would very likely have moved nothing, but it is a capability reduction against a pinned policy and was declined. Deliberately an OPEN box: this is the one place in the tree where 'recovery must never silently emit wrong code' is knowingly suspended. Bounded by the two existing fences, and by FR-202's class-2 export being const unsigned char *-shaped by construction so the width hazard cannot reach the C ABI. THE WAY OUT if it ever matters: reject arithmetic whose operand type is long double with a located diagnostic, keeping the f64 mapping for storage, conversion, passing and printing. A real 80-bit type is not available -- Rust has no f80."
