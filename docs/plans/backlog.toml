summary = "LANDED 2026-09-07, closes FR-181's residue. FR-181 projected +4; FR-182 landed three and bitwriter_add was correctly refused, so the entire residue was hdr_bitrate alone. THE SPIKE'S OWN CAVEAT WAS CLOSED FIRST: FR-181 recorded hdr_bitrate was exercised on the spike's inputs, not the corpus's; re-tested on the corpus's OWN runner (103 passed / 0 failed / 14 skipped), bound is exactly 3 and the harness declares h: [u8; 3] -- the bound exactly. CAbiClass::SliceBound admits an export only when ALL hold: exactly one reference parameter and it is a SHARED &[u8]; 8-bit element (the only width provably the C one absent a faithfulness marker); other params scalar, no by-value struct, scalar-or-void result; ONE block, NO region-carrying op, every op on a pure-value whitelist; every arg use a deref, every deref use a subscript at a CONSTANT NON-NEGATIVE index, every subscript use a load; at least one access (bound 0 refused -- from_raw_parts(p,0) still demands non-null). N = max index + 1, sound because C already demands it. Wrapper takes *const u8 (ONE register, so FR-181's argument shift cannot arise) and the length is a LITERAL. MEASURED FACT: ImportCTypes.cpp:1278-1284 gives shared &[T] only to a walked const unsigned char *; const int/short/double * all import as &mut [T], so class 2 is const unsigned char *-shaped BY CONSTRUCTION and the long double->f64 hazard (FR-206) cannot reach it. The region rule catches shapes that only LOOK straight-line (c ? p[0] : p[9], && and || all import as emitrust.if). ORACLE VERIFIED TO BITE BOTH WAYS: bound patched 3->2 gives SIGABRT via panic-in-nounwind with cargo build CLEAN; and FR-181's silent shape reproduced in this very test -- exporting &[u8] directly builds with only an FFI-safety warning and yields byte_pick=21 vs native 53, exit 0. One-reference cap respected, multi-reference NO-GO stands, all behind --c-abi-exports, no golden moved. Gate 1013/1013, clippy 101 (+0), both ratchets unmoved, TRACTOR 40->41/252 with a