summary = "WITHDRAWN 2026-08-29, central claim disproved. findSignatureStarvedDecls (LinkMerge.cpp:725) ALREADY compares every body-less extern_decl against the definer across all shards, and already drives a joint re-import remedy; step 2 name-only erase is the second line of defence, not the only one. I wrote the entry from step 2 without looking for a prior check. It also explains why three of four attempted reductions built clean -- the link output was a joint import -- and two of those were vacuous besides. Systemd never got the remedy because union-find collapses the starved pairs into one component and the first per-TU -D difference vetoes the group: re-import fires 0 times, cannot-re-import once, across 501 objects. Folded into FR-158 Phase 1, whose rejection path is this entry with better wording and 99.6 percent of the divergence actually fixed. DEPRIORITIZED below FR-158 2026-08-29: the repo rule says a hard rustc error IS the safe failure direction, so this buys diagnostic LOCALITY not safety, and landing it alone would take the 501-object systemd link from exit 0 back to failing. Judge it as a backstop AFTER FR-158. Found by building the FR-156 whole-program link 2026-08-29. mergeShards step 2 erases a declaration on a NAME hit with no type check, so a cross-shard pointer-model divergence becomes an exit-0-unbuildable crate. Measured: log_assert_failed is declared !emitrust.mut_ref<i8> in caller shards and defined !emitrust.mut_ref<slice<i8>> in assert-util, giving rustc 'expected &mut [i8], found &mut i8' at 2827 call sites; 6538 E0308 in total across ~40 functions, 99.9% of all errors in the merged crate. The small correct half: compare the obligation's signature with the definition's and emit a located diagnostic naming both shards and both types. Converts 6538 rustc errors into one link error, and makes the systemd link fail honestly rather than emit an unbuildable artifact. NOT SPIKED."
