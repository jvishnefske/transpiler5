anchor = "FR-212 (opened and SPIKED 2026-09-08; found by the FR-178"

[[items]]
id = "FR-213"
kind = "defect"
status = "landed"
size = "M"
title = "clippy 101 -> 93 via a narrowed drop-order gate; 46 of the remaining 51 are sound but blocked by the epoch-6 freeze"
summary = "LANDED 2026-09-09. needless_late_init was 60 of 101 warnings (59% of the debt). All 60 classified BEFORE any change, into four disjoint classes: SWITCH-EXPR 32 (sound), IF-EXPR-DIVERGE 8 (sound), IF-EXPR-SUNK 6 (sound), DROP-GAP 14 (11 sound / 3 not). THE 46 SOUND ONES ARE BLOCKED BY A TEST FREEZE, NOT BY SOUNDNESS: each blocked class needs one CHECK block updated in an EPOCH-6-PINNED corpus source (late-init-merge.c:112-114, FR-132's region_write refusal pin; fnptr-literal-unwrap.c:136-139, FR-133's multi_arm scope pin). Editing either makes assert_comparable(6) fail and clippy_eval exit 2, so NO clippy number can be reported at all. Unlocking them needs an epoch-7 freeze plus FR-61b's if-expression fold generalised to emitrust.switch, with the FR-61d-slice-3 tail fold so it does not trade this lint for let_and_return. WHAT LANDED: gapValueIsConsumedByMerge() narrows FR-132's gate on a proof needing NO move analysis and NO liveness -- a gap value whose ONE AND ONLY use is the merging assignment runs no destructor at scope end either way, since a Copy type cannot also be Drop and a non-Copy one is MOVED by the assignment. The rule is 'the single use IS the merging assign', not 'has a single use': a value consumed AFTER the write is still owning at the write. FIVE REFUSED AS UNSOUND: compound-literals.c:62 (emitrust.member projections in the gap -- FR-132's 'any mention refuses' correctly fires); cpp-copy-ctor.cpp:72 (gap declares a live droppy local, merging swaps two destructors); and stl-string.cpp:4,27 plus flexible-array-nullable-return.c:163, which are CHAINS where only the last link's use is the merging assign -- admitting earlier links needs by-value-vs-by-reference knowledge this fold lacks, with println! a live counterexample to 'a value operand is always a move'. std::make_unique<T> lowers to exactly that chain. ONE LINT ROSE AND IT IS THE GOOD DIRECTION: unnecessary_literal_unwrap 2->3, VERIFIED at the source -- the merged let lets clippy const-trace None into a later unwrap_or that the two-point form hid. GOLDEN MOVEMENT 21 files, every one a shrink, unified diff of each read by hand (every hunk exactly the fold, zero renumbering), all 21 re-verified by their own byte-diff not re-blessed; 0 return-code changes; 32 both-rejected correctly NOT counted as moved. ANTI-GOODHART: train -6, held-out -2. Gate 1025/1025, clippy 101->93 re-pinned IN PLACE at epoch-6 (population unchanged, same corpus_hash -- a ratchet tightening, not a new epoch), both ratchets unmoved, TRACTOR 41/252."
