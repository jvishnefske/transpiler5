summary = "Proposed 2026-08-29 by an agent, NOT requested and NOT acted on; recorded so the measurement survives. NEEDS AN OWNER DECISION -- architectural, not a loop item. Measured in a nix sandbox from a clean HEAD export: a meson derivation builds and installs all five tools under the same names, satisfying nix/corpus's only contract. Total change is TWO files -- install:true in tools/meson.build (meson installs nothing today, the only real gap) and flake.nix swapping cmake for meson plus llvm.dev. The argument cuts both ways and FR-163 is the evidence: CMake caught a link defect meson structurally cannot see, but that defect exists only because CMake demands hand-maintained per-component lists, so migrating deletes a hazard class rather than losing a safety net. What would genuinely be lost is the ability to build against a non-monolithic MLIR (meson.build globs libMLIR.so* and hard-errors if absent), which forecloses distro-package builds permanently. Deciding question: will this project ever build against a non-monolithic MLIR? If not, migrate and decide PDLL explicitly since it is CMake-only and default OFF. If unsure, keep CMake and wire the cheap component-scan guard into the fast tier instead."
