[[items]]
id = "FR-153"
rank = 11
kind = "defect"
status = "landed"
size = "M"
title = "E0596 mutable borrow through a shared reference (35 crates)"
summary = "PHASE 1 LANDED 2026-08-30. THE 501-OBJECT SYSTEMD WHOLE-PROGRAM CRATE NOW COMPILES: cargo exit 0, zero errors, a 23.4 MB rlib from 265,920 lines of emitted Rust, verified independently by regenerating all 501 shards with the patched importer. Gate 917/917, zero golden churn. Neither proposed direction was right: unconditional MutRef buys 816 needs with 888 signatures and no proof; honouring const fixes at most 2 of 7, regresses 64 of 357 clean units, and collides fatally with FR-158 for 3458 link errors. The shipped fix is DEMAND-DRIVEN -- the cursor region borrows mutably iff the callee body demands it, with missing a demand as the safe direction. Two fences: literal-backing rematerialization reusing the pattern that already existed for ordinary mutable slice args, and a located rejection for two cursors over one region with a mutating callee. Recorded coverage limit: 911 of 1427 units DEFINE a cursor-param function and ZERO call one, so caller-side work is invisible to the systemd oracle. ROOT CAUSE FOUND 2026-08-29 by the FR-161 spike, and MERGED with FR-158 Phase 4 -- one defect, not two: the same five DEFINE_TRIVIAL_CLEANUP_FUNC functions with the same source text. A C T** parameter is a CTS-00204 cursor parameter lowering to TWO inputs, a SHARED region slice plus an &mut i64, at ImportCFunctions.cpp:679-686 where the base is pushed as RefType::get(sliceType); the body must then reborrow that shared base mutably to hand the region to a callee whose slice parameter is &mut [T]. Minimised to ELEVEN lines, single TU, no --link. Constness is NOT the trigger: char** and const char** emit identically. THIS IS WHAT MAKES THE WHOLE-PROGRAM CRATE BUILD -- after FR-161 Phase 1 the 501-object systemd crate has seven rustc errors and all seven are this. Found by the systemd probe 2026-08-28. 35 crates fail error[E0596]: cannot borrow *p or p[_] as mutable, behind a & reference (src/core/manager, src/coredump/coredumpctl-journal, ...). Exit-0 unbuildable, the FR-145 class again. Ranked last of the five systemd findings because it is the only one that is not obviously narrow: a borrow-model question, not a naming or cast fix. NOT SPIKED."
