[[items]]
id = "FR-211"
kind = "defect"
status = "landed"
size = "M"
title = "Irreducibility is not the driver of the goto-ladder blowup -- adding it makes the lowering cheaper -- and on that path the growth is cubic, not quadratic"
summary = "LANDED 2026-09-08, closes FR-197's THIRD AND LAST residual. THE LEAD WAS REFUTED AND THE REFUTATION IS THE FINDING: a genuinely irreducible two-entry loop lowers to 52 lines FLAT in N, and closing the ladder with a back edge -- making it MORE irreducible -- is CHEAPER (2638 lines/0.21s at N=32 vs 14344/1.11s acyclic, and merely quadratic). The driver is the ACYCLIC fall-through ladder, as on both switch paths. FR-197's 'quadratic node splitting' is quadratic on the SWITCH paths only: the goto path is CUBIC, constant THIRD difference of 2, closed form L(N)=44+sum(j^2+7j+14) reproducing N=24 -> 6600 exactly. N=60 reproduces FR-197's recorded 83,383 lines (83,448 measured); N=100 does not finish in 400s and emits NOTHING. FOUR CONTROLS make the bound a scalpel: 'terminated' (same 33 labels and gotos, every section returns) is exactly 4N+18 lines flat, pinning the CHAIN not the label count; 'untargeted' is N+12, pinning that a label must be a JOIN; 'iflad' -- the same ladder with NO SWITCH AT ALL, the C error-cleanup idiom -- blows up identically, which is why the bound sits at FUNCTION scope and ImportCStatements.cpp is untouched; plus the two refutations above. kMaxGotoLabelFallThroughChain = 32, a NEW constant rather than reusing FR-207's, because the growth law differs. Boundary exact: 32 imports, 33 rejects; --recover stubs and terminates. CENSUS: largest real chain anywhere is 5 (c-testsuite 00213.c) against a bound of 32 -- 6.4x headroom, better than FR-207's 4x; coverage checked rather than assumed (32 files contain goto, 20 measured >0, the 12 zeros individually verified). CAPABILITY COST with the risk named up front: the kernel-style err_b/err_a cleanup ladder IS this shape and does blow up; chains 33..81 went from compiling in 0.1-268s to rejected, past ~90 from never returning to rejected. Recorded in the constant's comment. GOLDEN MOVEMENT ZERO verified directly over 1,419 inputs (same=927 moved=0 both-rejected=492 status-flips=0), run twice. NOT DONE: still lowers cubically below the bound. Gate 1021/1021, clippy 101 (+0), ratchets unmoved, TRACTOR 41/252."
