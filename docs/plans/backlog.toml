title = "The 20-case lever is two fixes not five, and 12 of them hinge on exporting a function that does nothing"
summary = "Opened and SPIKED 2026-09-09 from FR-225's ranked item 1. THE 20-CASE LEVER IS TWO FIXES, NOT FIVE, AND ONE OF THEM IS A FUNCTION THAT DOES NOTHING. THE CENSUS'S 5-BLOCKER SET FOR THESE CASES WAS OVER THE WRONG SOURCES: run through the harness's own cmake_configure -> target_closure -> filtered_compdb path, 053_blake_128f_s_initialize_hash_function_lib has a closure of 5 sources not 28, and strict emit reports EXACTLY ONE error -- utils.c:79:13 aliasing mutable pointer arguments (two arguments borrow object 'buffer'), which is thash(buffer + SPX_N, buffer, 2, ctx, addr): two overlapping reslices of ONE buffer, the FR-221 archetype and the textbook split_at_mut shape. Measured over ALL 20 cases carrying this symbol (12 blake at 5 sources, 8 sha2 at 4): every one is rc=1 with exactly one error and all 20 report the SAME one; extrapolating from one config was deliberately not done. WHY IT STILL WOULD NOT EXPORT: with --recover the crate emits clean as pub fn spx_initialize_hash_function(_ctx: &mut [u8]) {}, a FAITHFUL translation of void initialize_hash_function(spx_ctx *ctx) { (void)ctx; }, but --c-abi-exports emits nothing with the FR-139 'not all-scalar' sentence. classifyCAbiSignature DOES implement CLASS 1 (struct reference) and CLASS 2 (single slice with a proven must-access bound), but A C T* PARAMETER IS IMPORTED AS &mut [T], A SLICE, NEVER &mut T -- verified by differential probe across named struct, anonymous typedef struct and tagged typedef struct, and across member shapes ({int x;int y;} -> &mut [IntsCtx], {uint8_t a[16];int n;} -> &mut [MixedCtx], {uint8_t a[16];} -> &mut [u8]). CLASS 1 essentially CANNOT FIRE for a C struct pointer today, which CORRECTS FR-225's 'CLASS 1, exportable'. That leaves CLASS 2, which needs a proven must-access bound -- and the body is { (void)ctx; }, so there are ZERO accesses and nothing to prove a bound from. The function trivially safest to export is exactly the one the bound analysis has no material for. PROPOSED FIX -- A NEW EXPORT CLASS, THE UNACCESSED POINTER: if a pointer parameter is never accessed in the body no bound is NEEDED; pub extern \\\"C\\\" fn f(_p: *mut u8) {} that never dereferences _p is sound for any pointer value including null, is ordinary SAFE Rust with no unsafe block anywhere, and satisfies the rubric's zero-unsafe requirement outright; the wrapper calls the inner fn with an empty slice, sound precisely because the inner never reads it. CONFIRMED AGAINST THE HARNESS: the runner dlsyms SPX_initialize_hash_function, calls it as unsafe extern \\\"C\\\" fn(*mut Ctx) with &raw mut self.spx_ctx, and its vectors have lib_state_in == lib_state_out -- it expects NOTHING to change; the unsafe is the harness's own, outside the emitted crate. YIELD: 12 CASES, NOT 20. The 20 split blake 12 / sha2 8 and only blake's body is a no-op; sha2's is { seed_state(ctx); } which reads ctx->pub_seed and writes ctx->state_seeded, so the pointer IS accessed, the class does not apply, and its vectors expect state to change. Writing '20' would have been the tenth instance of the trap. THIS VINDICATES SET-COVER ON THE CASE THAT MOTIVATED IT AND FR-221's NO-GO STANDS UNAMENDED: FR-221 measured the aliasing fix ALONE at +0 and was RIGHT -- alone it clears emit and the case still dies at dlsym; paired with the export it is worth 12. Neither is worth anything without the other. THE OTHER THREE SYMBOLS' BLOCKERS, read off their recovery stubs via the FR-52 marker contract: prf_addr 'string function argument must designate a char array'; gen_message_random and hash_message 'the address of a scalar object cannot be passed as a slice parameter'. Those 60 cases need those PLUS the multi-reference export NO-GO overturned, so FR-225 ranking them last is unchanged. CORRECTED SAME HOUR, BEFORE DISPATCH: THE HEADLINE IS WRONG -- IT IS NOT TWO FIXES. THE CENSUS'S FIVE WAS RIGHT, and I reached 'one' by committing the FIRST-FAILURE ERROR AT SINGLE-CASE LEVEL, one entry after writing FR-225 about it. emitrust-cc in STRICT mode STOPS AT THE FIRST ERROR; I read 'exactly one error' off twenty strict runs and concluded one blocker. Recovery does not stop -- on the same case and closure it stubs 14 top-level items across FIVE distinct blockers (6 address-of-scalar-as-slice, 4 non-constant array size, 2 ArrayToPointerDecay pointer cast, 1 aliasing mutable pointer arguments, 1 string function argument), which is the census's set exactly. The 20 cases all report the same FIRST error because emission halts there, not because it is their only one. ALL FOURTEEN must import, because tractor-eval.py's contract is 'STRICT MODE ONLY: never --recover, never --incremental. The rubric awards no partial credit' -- a crate whose 13 unrelated functions are unimplemented!() scores zero even though the one dlsym'd symbol works. REVISED COST: the 12 blake cases need the census's FIVE importer fixes PLUS the unaccessed-pointer export -- SIX, not two. Still the largest measured lever, at three times the quoted price. WHAT SURVIVES, all independently verified: the export analysis is untouched (a C T* imports as &mut [T] so CLASS 1 cannot fire; the body is { (void)ctx; } so CLASS 2 has zero accesses to bound; the unaccessed-pointer class is sound and needs no unsafe; the harness wants extern \"C\" fn(*mut Ctx) with in == out; the yield is 12 not 20 on the blake/sha2 split). Only the import-side cost was wrong. METHOD LESSON, the durable part: A STRICT-MODE ERROR IS A FIRST-FAILURE READING OF A SINGLE CASE -- never read a blocker set from strict output however many cases agree, since twenty agreeing runs are twenty first failures, not corroboration; re-run with --recover and COUNT THE STUBS. Now enforced as a rule in CLAUDE.md. THE EXPORT HALF LANDED 2026-09-09 AT THE PREDICTED +0 (TRACTOR 45 -> 45; intended, not a failure -- the 12 blake cases still need the five importer fixes, so the class is worth nothing until they land; filed at +0 so nobody reads it as yield). Gate 1046/1046, clippy 57 (+0) epoch-7, binding flat, CTestSuite 220/220, Cpp17Suite 35/35. Emitted shape, NO unsafe anywhere: #[export_name = \"initialize_hash_function\"] pub extern \"C\" fn __emitrust_cabi_initialize_hash_function(_ctx: *mut core::ffi::c_void) { initialize_hash_function(&mut []) }. 'NEVER ACCESSED' IS NOT 'ZERO USERS' and that distinction IS the increment: the importer turns (void)ctx; into an emitrust.deref of the parameter WITH NO USERS, emitting no Rust at all, so a literally empty use-list would reject the exact shape this exists for; the predicate is every user is a deref whose own result is unused. The proof is the MIRROR IMAGE of cAbiProvenSliceBound's and needs none of its machinery -- that shows an access on EVERY path (a control-flow claim, hence one basic block plus an op whitelist), this shows an access on NO path (a universally quantified negative over the use-list, which MLIR's SSA form makes complete by construction); an op whitelist would have wrongly refused f(p) { (void)p; helper(); }. unsafe IS DROPPED FOR THIS CLASS ONLY: every other wrapper reconstitutes a reference from a raw pointer and owes the validity obligation; this performs no unsafe operation, so a safe extern \"C\" fn is the honest signature, exports the identical symbol with the identical ABI, and safety is not part of a function pointer's ABI. It is the one export class that DISCHARGES its obligation rather than relocating it -- FR-224's doctrine satisfied exactly. The parameter is *mut core::ffi::c_void deliberately: no layout claim about a pointee never read, so the struct behind it does not join the #[repr(C)] closure. THE PRE-EXISTING ZERO-BOUND REFUSAL IS UNCHANGED AND STILL RIGHT -- its premise (from_raw_parts(p,0) needs p non-null and aligned while C may pass NULL) is correct, only its conclusion did not follow, since this class builds no slice from the pointer at all. The untouched pin was MOVED FORWARD, not deleted: same function now pinned as EXPORTED plus an EndToEnd byte-diff calling it through dlsym with NULL. FR-181 DOES NOT APPLY: &mut [] is a fresh zero-length temporary of the wrapper's own, not a reborrow, so it can neither alias caller storage nor promise LLVM anything; the one-reference cap is untouched. OBSERVED SIDE EFFECT, REPORTED NOT FIXED: the paired sweep moved test/Import/C/Inputs/multi-tu-varargs-def.c under --c-abi-exports only -- a va_list MONOMORPHIZATION CLONE, logf__1, never reads its format-string parameter, so the class fires and exports it under a SYNTHESIZED name existing nowhere in the C. Sound, and the linkage gate still works (a static function does not export), but a library probably should not publish a symbol whose name embeds a monomorphization index, which could vary with clone numbering across TUs. A FOLLOW-ON SHOULD DECIDE whether this class must additionally require a name the C program actually declares. No case moved, nothing regressed. STILL OPEN: clauses 1, 3 and 4. ACCEPTANCE, revised: (1) all five census blockers import for this target closure, verified by --recover producing ZERO stubs rather than by strict reporting no error; (2) a pointer parameter with no accesses in the body exports with the C ABI and a bare symbol, refusing LOCATED when any access exists; (3) TRACTOR measured 41 -> 53 with the 12 blake cases newly PASS and NO case lost; (4) the 8 sha2 cases still refuse LOCATED and are recorded as such rather than silently emitting a wrong export."
