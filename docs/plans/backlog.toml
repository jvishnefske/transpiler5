title = "(*p).field = v on a unique_ptr payload is a silent miscompile, and the fix is widening not rejection"
summary = "FIXED 2026-09-03 by widening, both halves; verified independently (native id=6 tag=2, emitted id=6 tag=2). Gate 974/974, clippy 101 -> 101 (+0), TRACTOR unchanged 40/252. THE ROOT CAUSE WAS ONE LEVEL DEEPER THAN FILED: *p is a CXXOperatorCallExpr, which IS a clang::CallExpr, so emitMemberBasePlace's f().m branch claimed (*p).field first and staged a COPY of the whole payload. Teaching isStlBoxWriteExpr the non-arrow form alone would have fixed the borrow mutability but not the copy -- turning the silent miscompile into a loud E0594 and leaving the read half at E0507. A second edit in emitMemberBasePlace, ahead of the CallExpr branch, deletes the copy and makes both spellings converge on one path. TWO MORE BROKEN SHAPES found by probing and also fixed: the ARROW nested/subscript writes p->a.x and p->arr[i] were E0594 unbuildable. ADDITIVITY PROVEN BY DIFFERENTIAL over all 1026 test files plus 220 c-testsuite files: changed = 2, both the new tests; zero rc changes, zero IR-byte changes, no golden moved. Original filing follows. Opened 2026-09-03 by FR-188, deliberately NOT fixed there. Same root cause -- isStlBoxWriteExpr does not recognise the non-arrow member form -- but the ASSIGNMENT spelling, which FR-188's argument-side predicate does not cover. Measured: native id=6 tag=2, emitted crate id=0 tag=0. Builds clean, wrong answer. Left unfixed ON PURPOSE: p->field = v already works, so (*p).field = v is the identical operation spelled differently and the correct repair is to teach isStlBoxWriteExpr the non-arrow form, which KEEPS the capability; rejecting would have bought a green gate by deleting working-shaped code and made the eventual widening harder to justify. A SECOND independent defect sits next to it, also unfixed: a non-arrow member READ, constfield((*p).tag), does not build -- the read loads the WHOLE payload out of the shared borrow, rustc E0507 as soon as the payload is non-Copy. Both are the FR-140/141/142/146 class; neither is reachable through the arrow spelling, which is why the corpus never caught them."
