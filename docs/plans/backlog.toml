title = "The dead_code override hides 56 warnings across 294 crates, zero of them the kind that would signal an emitter defect"
summary = "Opened 2026-09-09 from an owner question. MEASURED at HEAD over the whole epoch-7 population with the blanket allow stripped and every crate built: only 33 of 294 crates warn at all, 56 warnings total -- 89% of emitted crates are already clean. By kind: 21 associated constants (C ENUMERATORS the TU never mentions), 15 fields never read, 10 structs never constructed, 6 methods, 4 variants. ZERO 'function X is never used' across 294 crates. That is decisive: a dead emitted fn is the case that would indicate an EMITTER DEFECT and it never fires, while everything that does fire is faithful translation of a declaration the C program made and did not use. DROPPING THE ITEMS IS THE WRONG LEVER and the FR-40 item graph cannot support it: its own scope note says C++ member functions are not nodes (yet 6 of the 56 are exactly those), only NAMED FILE-SCOPE records and enums become nodes, and the graph is CLOSED so an edge exists only when BOTH endpoints are nodes. A closed graph with skipped node classes UNDER-reports reachability and will call live items dead -- safe for placing an allow, unsafe for deleting. Dropping is also a fidelity loss under --link. THE REPO ALREADY HAS THE PATTERN one line above: unused_assignments was moved out of the blanket header onto the 4 of 3475 functions that need it, precisely to keep the tripwire on the other 3471. Every other lint the blanket header silenced is now DENIED in Cargo.toml; dead_code is the last survivor. PLAN: put #[allow(dead_code)] on the emitted enum impl block, the struct (which covers its fields) and the C++ impl block -- all of which the emitter knows it is writing, no analysis needed -- leave plain fn uncovered, and add dead_code = 'deny' to the lints table so a future dead function is a HARD BUILD ERROR. Costs nothing today. COSTS: shifts emitted bytes on EVERY crate, so a full byte-diff wave with substantial golden movement. And rollbackTo deliberately leaves unused definitions rather than unwinding a dozen registries (a missed one is 'a dangling symbol rather than a dead one'); its comment cites the blanket allow as cover. --preserve-c-names has its own allow header needing the same treatment. LANDED 2026-09-09. THE ZERO WAS CORPUS-BOUND: epoch-7 IS test/EndToEnd, our own hand-written programs which by construction call everything they define, so dead_code = 'deny' was falsified by two oracles the plan itself named as gates -- c-testsuite regresses by 10 (an external-linkage C function uncalled in its own TU is not even a C warning; the deadness is an artifact of privatizing it for a bin crate), and FR-44's guarantee breaks because recovery drops a rejected CALLER and orphans every function only that caller reached. Recovery STRUCTURALLY MANUFACTURES dead functions. THE TRIPWIRE COMES FROM THE RATCHET INSTEAD: clippy_eval filtered to clippy:: prefixes so dead_code was never counted; a named TRACKED_RUSTC_LINTS allowlist now admits it, which works precisely because this evaluator measures the FROZEN EPOCH ONLY, never c-testsuite and never --recover, exactly where deadness is legitimate. Epoch-7 measures 0, the pin stays 57, and a new dead function fails the gate without a hard error in the emitted crate. Crate-root allow GONE; targeted #[allow(dead_code)] on struct_def, on enum_def (BOTH the newtype and its sibling associated-constant impl), data enums, inherent impls, and the __EmitrustFile verbatim blob. --preserve-c-names keeps its three naming lints. TRIPWIRE PROVEN BY POSITIVE CONTROL: reinstating the blanket header fails both new tests, and a file with FOUR dead things reports 'generated 1 warning' -- only the function surfaces, and it is still EMITTED. GOLDEN MOVEMENT as a complete LINE INVENTORY over 1308 inputs: 945 removed blanket allows + 945 blank lines, 1432 added targeted ones, nothing else. 22 goldens each verified not re-blessed. A DEFECT IN THE PREPARED WORK, found by the implementing agent: six comments still asserted the dropped deny, and rollbackTo claimed 'recovery never leaves a dead fn behind' -- measured false in ten seconds. Also: the depCrates rework had NO test pinning it; one was added. Gate 1037/1037, clippy 57 (+0) with dead_code at 0, binding flat, both ratchets unmoved, TRACTOR 41/252. METHOD LESSON: a zero measured over one corpus is a claim about that corpus."
