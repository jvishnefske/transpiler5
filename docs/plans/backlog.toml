title = "NO-GO: the SPHINCS+ package is +0 PASS, because its export side IS FR-181's hard NO-GO"
summary = "Opened 2026-09-10 from the 60/252 census re-run and measured the same hour. THE SPHINCS+ PACKAGE (FR-226) IS WORTH +0 PASS, NOT +12, BECAUSE ITS EXPORT SIDE IS FR-181'S HARD NO-GO; the two entries were written as if independent and they are the same wall. This corrects docs/plans/roadmap.md item 3 and FR-226's headline, both mine, and it is the RULE-4 TRAP (clearing a stage is not passing; cross every blocker count with kind) committed inside a document that lists that rule as its own rule 4. MEASURED: (1) the census at 60/252 ranks a 3-fix set (aliasing mutable pointer arguments, non-constant array size, string function argument must designate a char array) at +34 EMIT -- exec 0, lib 34 -- so every case it clears must still export a dlsym-able symbol. (2) Those 34 are 4 distinct symbols x 8 build configurations, not 34 problems: initialize_hash_function, prf_addr, gen_message_random, hash_message; FR-225's denominator point again, now inside the SPHINCS+ subtree. (3) Every one takes at least one pointer that imports as a MUTABLE byte slice and each such export is refused. CORRECTED THE SAME DAY BY FR-236 AND THE CORRECTION IS MINE TO OWN: I PROBED A BODY I INVENTED INSTEAD OF THE CORPUS'S. I wrote void initialize_hash_function(spx_ctx *ctx) with a body writing ctx->pub_seed[0] = 1, saw the not-all-scalar refusal, and generalised from it; that body is NEITHER backend's. The real blake body (test_case/lib/blake/src/hash_blake.c:29) is a bare (void)ctx, a genuine no-op, so FR-226's UnaccessedPointer class exports it soundly and ALL 12 BLAKE initialize_hash_function CONFIGURATIONS DO EXPORT TODAY through an export_name attribute naming SPX_initialize_hash_function. The sha2 body calls seed_state(ctx) and really is refused. The WRITE was in my probe, not in the program -- rule 7 failing in its other direction: I ran the tool, on the wrong input. The conclusion about the 34-case cover survives and was independently re-measured at 33 of 34 walled; the generalisation about the SHAPES does not, and 12 blake cases are EMIT-only opportunities that would PAY. (4) classifyCAbiSignature explains it and the explanation is SOUND: class 2 (SliceBound) requires sliceIsShared because a &mut [T] is noalias to LLVM where a C caller may legally alias, which is FR-181's measured miscompile (crc16 native 21983 against export 25322, exit 0, no diagnostic); all four SPHINCS+ symbols write through an output pointer and are &mut by nature. (5) Class 2 is narrower still: cAbiProvenSliceBound requires ONE block with no operation carrying a region, CONSTANT indices, and READS only -- ANY LOOP DISQUALIFIES IT. Probed: unsigned ctx_sum(const unsigned char *b) { for (int i=0;i<32;i++) s+=b[i]; return s; } -- read-only, shared, constant 32-trip bound -- is REFUSED. SPHINCS+ functions are loops over buffers; the class that exists to admit them cannot see them. SECOND CORRECTION 2026-09-10 THAT PARTLY REINSTATES FR-226'S ORIGINAL HEADLINE: I OVER-GENERALISED FROM sha2 TO ALL OF SPHINCS+ AND NEARLY WROTE OFF THE ONLY PAYABLE WORK IN THE SUBTREE. Measured over FR-236's export verdicts, of the 80 SPHINCS+ lib cases EXACTLY 12 EXPORT AND 68 ARE REFUSED; the 12 are all blake SPX_initialize_hash_function, all matched exact rather than through the name fold, all with body_derived_risk False. Those 12 are NOT among the 34 the 3-fix cover clears (the 34 are sha2 only): the blake 12 sit at DEPTH 6 -- five distinct importer blockers plus unreached-by-import -- with crates reporting 19 refused symbols against 3 exported. tractor-eval.py is STRICT MODE ONLY and pays no partial credit, so EVERY ONE of the 19 must emit before ANY of the 12 scores: all-or-nothing, exactly what FR-221 measured when it fixed one blocker of a set and got +0, and depth is a LOWER bound so '+12 after five fixes' is an upper bound on an upper bound. Corrected board: 12 blake initialize_hash_function cases up to +12 PASS behind ~5 importer fixes; the other 68 are +0 PASS, export-walled behind FR-181 as items 3-5 establish. FR-226's '+12' named the RIGHT CASES FOR THE WRONG REASON and my retraction was too broad -- correct for sha2 and for prf_addr/gen_message_random/hash_message in every backend, wrong for blake initialize_hash_function. Three passes over one question, each correcting the last, which is the ledger working not failing. CONSEQUENCE: the three importer fixes are worth +34 EMIT and +0 PASS. Not nothing (FR-228 and FR-232 also landed at +0 PASS and were worth landing) but never again quotable as '+12 PASS'. The SPHINCS+ subtree is 128 of 252 cases and ITS GATE IS THE EXPORT SIDE, NOT THE IMPORTER. NOT AN ARGUMENT FOR OVERTURNING FR-181 -- the &mut-is-noalias reasoning is correct and the miscompile was measured. A widening worth spiking LATER, recorded so it is not lost: for sliceCount == 1 && refCount == 0 with everything else scalar there is NO SECOND REFERENCE IN THE SIGNATURE to alias against, a different situation from the multi-argument shape FR-181 killed. That is a HYPOTHESIS; it does not survive a caller that aliases the slice with a global the body also touches, and it must be spiked with the byte-diff suite in the loop. ACCEPTANCE: nothing is implemented; the claim is that FR-226 must be re-ranked to +0 PASS and its 'up to +12' headline retracted."
