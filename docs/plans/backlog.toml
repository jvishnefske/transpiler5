title = "FR-167 phase 2: the union-declaration frontier closes to two deliberate soundness exclusions, and the spike that ranked it fell into the trap it catalogued"
summary = "LANDED 2026-09-09, FR-167 PHASE 2 -- the last of its two phases. The same trial/rollback one level down, inside collectUnionSlot, falling back to the FR-78 sizeof blob when the union is C, non-empty, and has no bit-field or incomplete-array arm. One blob builder now serves both paths. BYTE IDENTITY WAS CLAIMED BY CONSTRUCTION AND ACTUALLY VERIFIED, with the split-file sweep FR-167's own method correction demands: whole-file 2 of 1109 changed (one the new test, one a rejection moving LATER); split-file-aware, 187 tests expanded to 1187 sub-units x 2 modes, 18 moved, all 13 pre-existing movers had base_rc=1, and ZERO sub-units with base_rc=0 changed a byte. THE FR-215 HYPOTHESIS: TWO SITES CONFIRMED, ONE REFUTED, AND THE REFUTATION IS THE FINDING. NLAPolicy.policy_set 133->137 resolved, NLAPolicySetUnionElement.string 7->7 resolved, but sd_json_variant.parent 48 predicted -> 0 resolved. sd_json_variant has TWO anonymous unions: the one FR-215 named IS unlocked, but forty lines later a second carries DECLARE_FLEX_ARRAY(char, string), an incomplete-array arm the eligibility screen deliberately excludes because sizeof does not cover a flexible tail and a blob sized by it would SILENTLY DROP storage the C program reaches. FR-215 attributed 48 items to parent because parent was merely the FIRST failure -- a further instance of the first-failure trap FR-215 ITSELF catalogued as the sixth occurrence. AND THE 193 WERE UNLOCKED AS CASCADES, NOT POINTER-WORDED ITEMS: pointer type outside a parameter position moves only 723->720 in raw containment. FR-215 was right that the amplifying bucket was a union item; wrong about which union. LEDGER over all 1604 units of the configured tree (FR-215's 501-object pin is gone, so absolutes are NOT comparable): 53916 -> 53876, NET -40 (304 resolved, 264 surfaced), 28 symbols blocked->clean and ZERO clean->blocked, 749 of 1604 units improved. FRONTIER CLOSED to two residuals, both deliberate soundness exclusions: the FAM-arm union