[[items]]
id = "FR-193"
kind = "defect"
status = "landed"
size = "L"
title = "A 10-agent adversarial hunt found a compiler hang and ~14 distinct defects in a tree whose every gate was green"
summary = "Opened 2026-09-04. 33 agents, 997 probes over ten partitioned areas of the C/C++ surface, each byte-diffed against a clang native, every finding then handed to an independent agent instructed to REFUTE it and to check well-definedness FIRST. CORRECTS FR-187, which concluded the correctness signal was exhausted and needed external corpora: it needed new PROGRAMS, not new repositories. HONEST CAVEAT: 0 of 23 findings were refuted, which from a default-to-refuted verifier is normally a rubber-stamp signature; sampled verdicts are rigorous (both sides rebuilt, three locales, hexdumps, UB analysis) so the rate is probably real, but it is recorded rather than presented as clean. AND 23 FINDINGS ARE ~14 DEFECTS -- seven are one root cause through seven entry points; counting reports as defects would overstate by 60%, the same error class as counting first-failures as yields. Ranked: (1) (x as u8) as char UTF-8 expansion in __emitrust_fmt_c -- every byte >= 0x80 becomes two, reached via printf(%c), putchar, sprintf(%c) (which also returns 2 not 1), std::string +=; documented out of scope (C99-48) but silently wrong bytes are still a defect under the repo's own rule, and __emitrust_byte_out already does the right thing for argv. (2) %s with a FIELD WIDTH Latin-1 re-encoded -- the path FR-191 explicitly excluded as a scope note; the reasoning was right, recording it as a limitation was wrong. (3) recover mode SILENTLY REBINDS a caller onto a colliding function where plain mode correctly rejects -- violates FR-53's contract. (4) p[-1] emits p[(-1i64) as usize] only on the multi-object lowering, a divergence between the two pointer models. (5) non-termination: exponential CF-to-SCF blowup on long switch fallthrough. (6) statements hoisted past a loop-body destructor -- C++ drop order. (7) v[i].f = x lost through a std::vector element place, the SAME defect FR-189 fixed for unique_ptr a day earlier through a different container. (8) unary float minus as 0.0 - x, losing -0.0 and -inf. (9) long double silently f64. Plus UNBUILDABLE: keyword-named extern global unescaped, mem*/str* helpers with two cursors into one array (even DISJOINT), _Bool as f64, aliasing method arg E0499, s += s E0502. Repros under scratchpad/hunt/<area>/. FULLY DISCHARGED 2026-09-08: every item closed across FR-194/195/196/198/199/200/201/203/204/205/206/207 and FR-210 (item 2, the last one). SCORECARD: 23 findings became ~14 defects and closed as 12 FRs, so this entry's own 'counting reports as defects would overstate by 60%' warning was accurate. Gate 961 -> 1021, clippy flat at 101 throughout, TRACTOR 40 -> 41 on unrelated work -- NONE of the 12 fixes cost a corpus case, the strongest available evidence the hunt found real defects rather than shapes the tree disliked. THE HONEST CAVEAT RESOLVED THE OTHER WAY: '0 of 23 refuted' was NOT a rubber stamp -- every increment reproduced its defect against the clang native first. What got refuted repeatedly was this entry's own account of the CAUSES: FR-204 (not an as-usize bug), FR-205 (the keyword fence was never broken), FR-203 (the named blocker did not exist), FR-210 (the padding was never wrong), FR-211 (irreducibility is not the driver). The findings were sound; the diagnoses were not. A hunt should record what it MEASURED and hold its explanations loosely."
blocked_by = []
anchor = "FR-193 (opened 2026-09-04 by a 10-agent adversarial differential hunt;"

[[items]]
id = "FR-194"
kind = "defect"
status = "landed"
size = "M"
title = "The %c Latin-1 funnel closed on stdout and buffer paths, refused where unrepresentable; also fixed a miscompile FR-191 left open"
summary = "LANDED 2026-09-04, FR-193 item 1. Verified independently: a 256-value putchar sweep plus a sprintf(%c) length check is BYTE-IDENTICAL to clang (266 bytes each); the cat loop previously turned 512 bytes into 768, first differing at byte 27. Gate 978/978, clippy 101 -> 101 (+0), TRACTOR 40/252 unchanged, neither corpus ratchet moved. THREE ENTRY POINTS, THREE DIFFERENT RESOLUTIONS. (1) stdout printf(%c)/putchar/fprintf-alias FIXED via __emitrust_byte_out -- and the FIELD WIDTH came with it, which %s could not manage, because %c pads ONE byte to a compile-time-constant column so the padding becomes literal text in the print! segments either side of the raw write; FR-191's ordering fence was reused, not duplicated. (2) sprintf/snprintf %c FIXED, and the soundness argument is the interesting part: __emitrust_byte_out is unavailable, so the fix is at the OTHER end -- the formatted String is LATIN-1 BY CONSTRUCTION (format literal restricted to printable ASCII, numeric conversions ASCII, %c as (x as u8) as char, %s per-byte likewise, every non-ASCII data route already a located rejection), so walking s.chars() instead of s.as_bytes() inverts the widening exactly, with assert!(code < 256) as a loud backstop. BONUS VERIFIED: this also fixes %s inside sprintf for non-ASCII, the shape FR-191 recorded as STILL A MISCOMPILE -- FR-191 concluded the *_out helpers were structurally unavailable and stopped, but it was looking at the wrong end of the pipe. (3) std::string += c REFUSED correctly: a Rust String is UTF-8 by invariant and cannot hold a lone 0xC8; size() is len() over the ENCODING, reporting 2 where C++ reports 1 -- a representation limit, not a rendering bug. Split by decidability: constant operand is a located rejection, runtime operand aborts loudly; a blanket refusal would have rejected all ASCII char-at-a-time string building and could only move the Cpp17Suite ratchet DOWN. RESIDUAL inherited not introduced: printf(%c, x, ...f()) with a side-effecting later argument still takes the funnel -- the same residual FR-191 named, pinned as the declined path."
blocked_by = []
anchor = "FR-194 (opened and LANDED 2026-09-04; FR-193 item 1): **THE `%c`"

[[items]]
id = "FR-195"
kind = "defect"
status = "landed"
size = "L"
title = "Recovery dropped a name-collision loser and let its call sites fall onto the survivor; the naming pass had already computed the right answer"
summary = "LANDED 2026-09-04, FR-193 item 3. Plain mode refuses the collision with a precise located diagnostic, so DETECTION was never the problem; under --recover the loser was classified DROPPED not STUBBED, nothing rewrote its call sites, and since the survivor already occupied the symbol the loser would have emitted as, every dangling call silently resolved onto it -- exit 0, zero warnings, wrong answer, a direct breach of the CLAUDE.md/FR-53 contract. The hunt's decisive observation: every OTHER recovered rejection already stubs and panics with exit 101, so one path had fallen out of an otherwise-sound design. MECHANISM: the loser now RESERVES a unique symbol (<name>_collision<N>) memoized by canonical decl, the stub emits under it, and boundFunctionSymbol routes every call AND every address-of through the memo; plain mode reserves nothing so its bytes are unchanged by construction. Reservation happens on the FIRST real import attempt, not the stub retry, so a loser the retry cannot rebuild is still recorded and the lookup FAILS CLOSED with a located diagnostic instead of binding to the survivor. THREE MORE CHANNELS of the identical rebind were found by probing and closed by the same mechanism: FR-73 underscore fold (_set/set, 2 4 -> was 2 3), keyword mangle (match_/match, 2 4 -> was 2 3), and va-clone names (Sum/sum). The fourth is a CAPABILITY FLIP not a rejection: a monomorphized variadic emits only per-call-site clones, and clone names were uniquified per-plan so Sum and sum both chose tu0_sum_1; making them mutually unique ACROSS plans makes both import correctly in plain mode, byte-neutral for anything working today. FUNCTION-POINTER IDENTITY restored -- three distinct Some(...) constants where a == b was previously true for two different functions, collapsing any fn-ptr-keyed dispatch table; this is the trap FR-52 already recorded once. One new deliberate rejection: a caller of a loser that cannot be stubbed now takes a located rejection rather than silently calling the survivor; no correct program regressed. Gate 983/983, clippy 101 (+0), both ratchets unmoved, TRACTOR measured 40/252 unchanged. NOT VERIFIED: C++ MEMBER collisions are excluded from reservation at every guard and were not probed for the same hazard."
