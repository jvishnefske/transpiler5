title = "Reconcile the cross-shard pointer model so the whole-program crate builds"
summary = "ROOT CAUSE LOCATED 2026-08-29; the entry hypothesis was close but wrong. collectSliceParams walks the BODY and promotes a pointer parameter to slice when the body merely REFERENCES it -- indexing is not required -- so a declaration always takes the scalar default for want of a body. Narrower than 6538 suggests: four small repros carrying the IR divergence all link and BUILD CLEAN; the surviving failure needs a cursor already bound into a LOCAL at a computed offset. Found by building the FR-156 whole-program link 2026-08-29. The real prize behind FR-157. UNTESTED HYPOTHESIS: a definition has a body so the importer sees the parameter indexed and picks the slice model, while a bare header prototype has no body evidence and defaults to the single-object cursor mut_ref<i8>; if so the divergence is predictable from declaration-vs-definition alone and could be fixed by giving the declaration path the model the definition will choose, or by deferring the choice to link. MEASURE IT FIRST -- it is the entry's own guess. Note the per-UNIT crates never show this, because within one unit the callee is an FR-52 obligation carrying the caller's own inferred signature, so the two agree by construction; only two independently-imported units meeting can expose it. NOT SPIKED."
