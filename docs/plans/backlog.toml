summary = "LANDED 2026-09-05, FR-193 item 8. Root cause one layer BELOW the spec: the importer already emits arith.negf; NegFOpConversion rewrote it to emitrust.sub(0.0, x) because the dialect had no unary negation op. Fixed by adding emitrust.neg (F32/F64). THE SPEC WAS WRONG IN BOTH DIRECTIONS: it asserted infinities were also broken -- they were NOT, 0.0 - inf == -inf at both widths; and it dismissed NaN sign as 'if observable' when it WAS observable and broken the OPPOSITE way, since subtraction PROPAGATES the NaN sign bit while -x FLIPS it, so x86 inf-inf gave native nan vs emitted -nan. Verified independently after landing: signed zero, -inf, nan and integer -1 all byte-identical to clang. AN ADDITIVITY TRAP the spec did not anticipate: isLiftableConditionOp already allow-listed emitrust.sub, so a new op unregistered there would have made float negation in a while-condition SILENTLY stop lifting to emitrust.while -- same class as FR-190 constraint 2. Integer unary minus untouched and pinned. Gate 995/995, clippy 101 (+0), TRACTOR 40/252, both ratchets unmoved; one CHECK golden flipped forward deliberately, no crate byte-identity golden moved. NOT VERIFIED: non-x86 NaN-sign behaviour."
