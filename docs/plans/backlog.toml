title = "aliasing mutable pointer arguments is 83 of 202 EMIT_FAIL cases -- the largest measured lever in the corpus, never spiked"
summary = "Opened 2026-09-09. Re-derived at HEAD: 83 of 202 EMIT_FAIL cases, 41% of all failures and 33% of the whole 252-case corpus. The next genuine reason is 8; the 48 'missing header (openssl/conf.h)' above it are SPHINCS+ variants where that is only the FIRST failure, worth +0 per FR-178 measured twice. Roughly a TEN-FOLD lead over anything else on the board. THE CHECK is ImportCExpressions.cpp:3140-3160, refusing a call when two arguments borrow the same root object or the same heap allocation. THE ARCHETYPE is B01_organic/merge_sort_lib -- merge(arr, lo, mid, hi), two slices of ONE array, the single most ordinary shape in C and not an aliasing hazard a human would recognise. THE LEAD IS STRONG: FR-201 ALREADY SOLVED A SIBLING. It established that the mem*/str* two-cursor unbuildable was BORROW GRANULARITY in the Phase-4 owner lift, NOT aliasing -- the tell being that DISJOINT ranges failed too -- and routed same-region cursors through __emitrust_memcpy_within. FR-181 separately noted __emitrust_split_mut_u8 was 'not needed' for that shape. Two slices of one array is exactly what Rust's split_at_mut exists for, so the spike must answer whether the 83 are that granularity problem generalised, or genuine aliasing no representation fixes. CONSTRAINTS THAT DO NOT APPLY, so a spike does not mis-scope: FR-181's HARD NO-GO is about the multi-reference C-ABI EXPORT boundary (noalias on two &mut from two C pointers a caller may legally alias) -- these are INTERNAL calls. FR-136's points-to NO-GO does stand. FR-203 (2026-09-07) is recent adjacent context: it fixed the receiver/argument arm of this same family. NOT SPIKED. Rank first on measured yield -- nothing else is within an order of magnitude. SPIKED 2026-09-09: NO-GO ON YIELD. The 83 is 83 raw first-failure EVENTS over THREE source programs and FOUR sites -- 80 of them ONE SPHINCS+ site (utils.c:79:13) built 128 ways, plus merge_sort_lib, plus the 030 pair. THIS ENTRY COUNTED EVENTS NOT PROGRAMS, i.e. it committed the first-failure error it cited FR-136 and FR-178 for. A --recover scan over all 252 returns exactly the same 83, so no hidden population exists. DECISIVE: deleting the ENTIRE check is worth +0 -- with both rejections gated off the three-stage harness gives PASS 41, newly PASS [], lost PASS []. All 83 hit another blocker in the same TU (81 non-constant array size, 1 string-function argument, 1 scanf argument); blocker depth is 2/2/2 and FIVE for SPHINCS+. AND FR-181's HARD NO-GO DOES TRANSFER, which this entry explicitly said it did not: hand-rewriting merge_sort_lib into the index form a perfect fix would produce yields pub fn merge_sort(a: &mut [T], b: &mut [T], size: i32) with NO #[no_mangle] -- two reference parameters at the C-ABI boundary. merge_sort IS the exported entry point, so it was never the internal-call question. Both _lib archetypes stay SYMBOL_MISSING even with a perfect fix. FR-201's insight HALF transfers: disjointness says granularity (disjoint constant indices refuse, and so do two const-pointee read-only borrows), but the mechanism does not -- FR-201 could refine because the callee was a known BUILTIN whose read/write order is modelled; thash and fma_array are user functions and a staged copy is a silent miscompile whenever the callee reads an index it already wrote. The merge_sort shape ALREADY imports when the region is a caller-LOCAL constant array via the Phase-4 owner lift, gated by planOwners at ImportCPlanning.cpp:309-325. MACHINERY AUDIT: two shared borrows need NO new ops; split_at_mut is expressible today via a 2-result call_opaque (FR-181's 'not needed' was about need, not capability, and the dialect does not refuse it unlike FR-215's array-element gate); widening const T * beyond u8 is worth 0 here. The one real finding is a provably-wrong refusal, filed as FR-222."
