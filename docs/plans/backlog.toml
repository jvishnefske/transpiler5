summary = "PHASES 1+2 LANDED 2026-08-29, gate 910/910 zero churn. Divergence is 100 percent one shape (mut_ref<T> to mut_ref<slice<T>>) across 3796 declarations, and 99.58 percent of 14363 mismatched slots are addr_of(subscript), rewritten at the merge to the existing slice_of op -- no new op or metadata. Phase 2 fixed an unlogged order-dependence: the re-import dropped a DEFINITION when the caller came first; definitions-first ordering is provably impossible since a mutual-call cycle loses one either way. Systemd 501-object link goes from exit 0 with 6567 E0308 to exit 1 with 60 LOCATED rejections and no crate -- the repo posture, but it costs the artifact; relaxed to a warning the crate emits at +1.30 percent bytes with 56 E0308, a 99.1 percent reduction, which is Phase 3s job. Measured: --link --incremental does NOT recover these, recovery is import-stage only. ROOT CAUSE LOCATED 2026-08-29; the entry hypothesis was close but wrong. collectSliceParams walks the BODY and promotes a pointer parameter to slice when the body merely REFERENCES it -- indexing is not required -- so a declaration always takes the scalar default for want of a body. Narrower than 6538 suggests: four small repros carrying the IR divergence all link and BUILD CLEAN; the surviving failure needs a cursor already bound into a LOCAL at a computed offset. Found by building the FR-156 whole-program link 2026-08-29. The real prize behind FR-157. UNTESTED HYPOTHESIS: a definition has a body so the importer sees the parameter indexed and picks the slice model, while a bare header prototype has no body evidence and defaults to the single-object cursor mut_ref<i8>; if so the divergence is predictable from declaration-vs-definition alone and could be fixed by giving the declaration path the model the definition will choose, or by deferring the choice to link. MEASURE IT FIRST -- it is the entry's own guess. Note the per-UNIT crates never show this, because within one unit the callee is an FR-52 obligation carrying the caller's own inferred signature, so the two agree by construction; only two independently-imported units meeting can expose it. NOT SPIKED."
