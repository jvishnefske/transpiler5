title = "A %s argument was materialized at argument-lowering time, not read at conversion time -- and the argv %s/%c bypasses had the same ordering bug"
summary = "LANDED 2026-09-08. THE ENTRY WAS WRONG ABOUT ITS OWN BLOCKER: there is no borrow problem. Deferring the ENTIRE %s read -- not just the deref -- past the later arguments puts the shared borrow AFTER the mutable one, so nothing spans anything. WELL-DEFINEDNESS CHECKED FIRST and it is determinate C, not UB: C17 6.5.2.2p10 leaves argument evaluation order unspecified but places a sequence point before the call, and array-to-pointer decay does not ACCESS the stored value, so there is no unsequenced conflict; clang and gcc agree on [Bb] 1. The contrast is pinned: a %d argument IS read during argument evaluation, so writing that object later IS plain UB -- no such shape is pinned and only %s is reordered. IT IS THREE DEFECTS SHARING ONE PREDICATE: FR-191's ordering fence was never applied to the ARGV bypass, for %s AND %c, both writing raw bytes to stdout at argument-lowering time -- an output-order inversion wrong even for pure ASCII (native <1>[hello] 1 vs emitted [hello<1>] 1). 9 of 12 test lines wrong at baseline. One shared laterArgSideEffects predicate replaces three duplicated loops and drives both consequences; a deferred %s reserves an operand slot filled at end-of-scan AND inside flushSegment so a later raw bypass cannot flush a segment holding an unfilled slot; a declined argv %s is DEFERRED not rejected, so no shape is lost. String-literal/__func__ arguments never move, and a %s with its OWN side effects is left alone since C leaves that order unspecified. CAPABILITY COST: none -- nothing that imported before now refuses. Three pre-existing goldens shifted, all correct, verified by a paired --emit=rust sweep over 746 sources; the emit-failure set was byte-identical. Gate 1017/1017, clippy 101 (+0), both ratchets unmoved, TRACTOR 41/252. INCIDENTAL NOT FIXED: a const char * slice parameter is rejected in %s when the buffer is a loop-filled local array; reproduces on the BASELINE tool, so it predates this work."
