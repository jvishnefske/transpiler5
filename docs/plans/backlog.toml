summary = "LANDED 2026-09-09, implements FR-209. The 'not all-scalar' refusal now names the delegation and its callee, with a located note at the forwarding call. +0 items and +0 TRACTOR BY CONSTRUCTION -- wording, not admission; emitted Rust byte-identical. The note was reachable by carrying the facts on a discardable emitrust.func attribute with a LocationAttr, which round-trips through emitrust-opt. TWO DEFECTS THE SPEC DID NOT PREDICT, both surfaced by the paired sweep rather than review. (1) INDEX MISALIGNMENT: keying on the C parameter position and ParamKind::Slice described the WRONG argument on array-self-ref-member-cross-param.c and union-find.c -- an FR-62 owner method carries a synthesized receiver (shift of one), and in those functions parameters classify Slice but emit as i64 CURSORS, so ParamKind is not the last word on the emitted type. Fixed by anchoring on the built FunctionType and failing closed; MLIR churn 6 files -> 2. (2) THE SENTENCE COULD LIE: 'both(Ctx *c) { return helper(c) + c[1].a; }' forwards AND subscripts, so it is still a slice without the call and blaming the delegation would be false. A soleReason check suspends the forward's demand, asks, then restores it wholesale (identical set, no signature moves); only sole-reason records surface. Verified independently: outer gets the new wording plus note, both keeps the original sentence. A SECOND REAL INSTANCE was found in the shipping suite, not just the synthetic differential: do_indexing in flexible-array-member-tail-local.c, whose own source comment already read 'slice-classifies hse'. ON WIDENING THE FORWARDING EDGE -- reported, deliberately NOT implemented, and NOT costed: one sole-reason delegation-induced slice on an externally-visible C function across 785 sweep files, rarer than FR-215's write-up implies. But that is NOT a blast-radius measurement: the attachment gate excludes internal-linkage functions which a widening would INCLUDE, so re-measure with the gate removed. TRACTOR separately +0 -- no slice-parameter reason appears in the EMIT_FAIL tally, where the front is aliasing mutable pointer arguments at 80/252. Gate 1035/1035; paired sweep 0 byte-diffs over 758 emitted-Rust files and 2 intended diffs over 785 MLIR; clippy 57 (+0) at epoch-7; binding both axes flat; both corpus ratchets unmoved; TRACTOR 41/252. No existing test edited and no Driver pin moved -- entirely additive, epoch-7 stays open."
