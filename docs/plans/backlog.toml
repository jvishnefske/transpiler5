summary = "Opened 2026-09-10 from FR-236's export-aware cover, and PROBED BEFORE FILING because the previous entry's forecast had to be retired for being unmeasured. Ranked as one leg of an 11-payable trio; 4 cases (024_struct_and_static, 025_struct_and_errno_and_static, each exec + lib). THE C IS WELL-DEFINED -- no UB, checked FIRST -- a static house_t the_house with mutators taking house_t * and readers touching the global directly; this matters because the sibling leg (011/012) looks like the same kind of work and is NOT, its C being undefined. MEASURED, two probes at d7028c0: (1) add_floor(&the_house), the corpus form, is refused with 'unsupported: taking the address of a global variable' from the asGlobalDataPointerRef arm of the UO_AddrOf handling in ImportC.cpp; (2) THE SAME GLOBAL ACCESSED DIRECTLY BY ITS FUNCTIONS ALREADY LIFTS -- the emitted Rust is struct Tu0TheHouseActor { tu0_the_house: HouseT } with impl Tu0TheHouseActor { fn ...(&mut self) { self.tu0_the_house.floors += 1 } }, which is FR-62's C-owner-method form with &mut self, no unsafe and no static mut. So the representation this work needs is NOT hypothetical and does not have to be designed: it is what the tree emits today for the neighbouring shape. THE INCREMENT IS THEREFORE NARROW: when a global that is ALREADY owner-lifted has its address taken and passed to a function whose parameter is a pointer to that global's struct type, lower the call as a METHOD on the owner instead of refusing it; everything else about &global stays refused. CORRECTED THE SAME DAY BEFORE ANY WORK STARTED: THIS IS 2 CLEAN CASES, NOT 4. I filed '4 cases' without checking the _lib halves' export verdicts, the rule-4 trap, caught this time by running the check instead of assuming. Measured against FR-236's verdicts: 024_struct_and_static (exec) 1 blocker payable; 024_struct_and_static_lib 1 blocker and it EXPORTS (driver, matched exact, via plain no_mangle) so payable; 025_struct_and_errno_and_static (exec) has THREE blockers not one -- the address-of-global, 'unsupported pointer expression: CallExpr' (that is errno, FR-239), and 'unsupported: an fgets result must be compared against a null pointer or tested for truth' which I had not recorded at all; and 025_struct_and_errno_and_static_lib is EXPORT-REFUSED ('its signature is not all-scalar'), so it is +0 no matter what the importer does until the export wall itself moves. The clean one-fix target is 024 and 024_lib: TWO cases behind a single blocker. 025 is a three-fix case whose lib half is walled outright. DO NOT COST 025 FROM THE CENSUS -- it is deeper than its blocker set shows, ALSO needing errno (not modelled at all, see FR-239) and a strtoX endptr (FR-234 rung 2). 024 is the clean one; 025 is a three-fix case wearing a one-fix label, the set-cover marginal-yield trap in miniature. ACCEPTANCE: 024_struct_and_static emits and byte-diffs against the clang native with zero unsafe and no static mut; report EMIT and PASS separately; do NOT forecast 025 until errno and rung 2 are settled."
