title = "Two read-only borrows of one object are refused, and two copies of the same rule disagree about whether they should be"
summary = "Opened 2026-09-09 by the FR-221 spike. emitCall's aliasing key IGNORES borrow MUTABILITY, so f(const S *a, const S *b) called as f(p, p+4) is refused PROVABLY WRONGLY: with the check disabled it emits two shared reslices, cargo builds clean, and stdout is BYTE-IDENTICAL to the clang -O2 native. The diagnostic's own word 'mutable' is factually wrong for that shape. THE C++ ARM ALREADY HAS THE RULE RIGHT AND ITS COMMENT MIS-STATES THE C ARM: ImportCExpressions.cpp:3633 (FR-203) tests (argIsMut || heldIsMut), and its comment at :3613-3619 claims 'emitCall applies the same rule to a free function's arguments'. It does not. The check is duplicated at FOUR non-mutability-aware sites (:3140 direct call, :3157 heap, :7314 FR-93 dispatch, :7466 CallIndirect) against two aware ones (:3633, :3745). INCREMENT: make :3140 and :3157 mutability-aware mirroring :3633 verbatim -- borrowRoots carries {root, path, mut}, borrowBackings {value, mut}, collision skipped when neither is mutable. ~20 lines, no new ops or types, no dialect change. MEASURED on a reverted evidence patch: full gate 1035/1035, TRACTOR 41->41 with newly PASS [], lost PASS [] and ZERO per-case changes -- FR-201's additivity signature. AN EMIT-STAGE CORRECTNESS WIN WORTH +0 PASS, filed with that label so nobody mistakes it for yield. Worth landing anyway: it removes a refusal of a correct program and a disagreement between two copies of one rule where one copy's comment claims they agree, and it is the prerequisite for any const-shared or MOD/REF widening. The heap arm is DEAD in the corpus (83 root-object, 0 heap) so it is fixed for consistency. :7314 and :7466 were NOT patched -- a follow-on should decide whether the rule belongs in ONE shared helper rather than four copies, which is the actual root cause. LANDED 2026-09-09. :3141 and :3155 are now mutability-aware, mirroring FR-203's :3633 verbatim; +47/-12, no new ops or types. The admitted shape emits two shared reslices, cargo-builds clean, and is BYTE-IDENTICAL to the clang native at both seeds. JUDGEMENT CALL: mutability is read off borrowType, not input -- for FR-88's nullable slot, input is the Option WRAPPER while borrowType is the synthesized shared &[u8] inside it. THE SPIKE'S OWN WITNESS WAS VACUOUS and the implementing agent caught it: b13_native.c uses a main-local u8 b[8], which the Phase-4 owner lift promotes to i64 indices, so it ALREADY PASSED at baseline. The real witness puts the buffer in a struct field so the lift cannot promote it. SIX negative shapes pinned with exact wording, including a shared-then-mut SYMMETRY pin that a rule reading only the incoming argument would let through. TWO shapes on the spec's negative list DO flip in their all-const spellings (heap two-cursor, object-plus-own-field over an all-u8 region) -- reported rather than special-cased, because special-casing would reintroduce exactly the disagreement this entry removes. The existing malloc-region-slice-arg-invalid.c pin is untouched because const char * is Char_S on x86-64, so those params stay &mut [i8]. THE DIAGNOSTIC NEEDED NO REWORDING and the reason inverts the finding: 'aliasing mutable pointer arguments' is now TRUE wherever it fires, since it only fires when a borrow really is MutRefType. It was FALSE for shared/shared before -- that WAS the defect. Pinned verbatim in 10 test files plus 126x in the Kernel rejection report. Gate 1040/1040, clippy 57 (+0) over 294 crates 0 skipped, binding both axes flat, both ratchets unmoved, TRACTOR 41/252 with ZERO per-case changes (FR-201's additivity signature). Golden movement measured twice: a paired 1228-input sweep found exactly ONE change, the new test's own rc 1->0. INDEPENDENT CONFIRMATION OF FR-221's reason split falls out of the zero: the 83 aliasing cases are still 83 because every corpus site has at least one mutable side -- merge_sort_lib's le() is non-const in the C, so both borrows type as &mut regardless of the callee being read-only. AN EMIT-STAGE CORRECTNESS WIN WORTH +0 PASS. ON UNIFYING THE FOUR COPIES (reported, not done): they unify into TWO helpers, not one. :3141/:7349/:7501 share an identical loop body and want one checkBorrowCollision; the heap arm must NOT join (different key space, null-root per FR-146) nor the C++ arm (carries receiver state). All four should share the PREDICATE so the sentence exists once. SEQUENCE: :7501 is cheap; :7349 NEEDS ITS OWN SPIKE because it runs inside a per-arm dispatch where armRoots is rebuilt per arm, so mutability-awareness could admit a shape whose arms individually pass but which the FR-93 lowering re-materialises."
