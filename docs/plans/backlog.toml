summary = "Opened 2026-09-03 by the FR-183 stdin spike, which found it while building its own oracle. Reproduced with fopen+fgets+printf(\"%s\") alone, no new feature needed: native ff fe 81 7a 0a 0a, emitted c3 bf c3 be c2 81 7a 0a 0a. Root cause is the __emitrust_cstr Latin-1 Display funnel (ImportCFunctions.cpp:2929) -- every byte renders as a char, so anything above 0x7f becomes two UTF-8 bytes. THE FIX ALREADY EXISTS AND IS GATED TOO NARROWLY: the raw-bytes bypass __emitrust_cstr_out (ImportCFunctions.cpp:2951) does the right thing but its use site is guarded by matchArgvWholeSubscript (ImportCStatements.cpp:8090) -- argv only. Widening that guard to any whole-char-buffer %s argument is the repair. It masked 484 of the spike fuzz cases until the probe switched to raw-byte comparison, which is the tell: a Latin-1 round-trip looks right in a terminal and only a byte-diff catches it; the corpus never caught it because every EndToEnd %s payload is ASCII. Orthogonal to FR-183 and does not gate its GO, but stdin widens the reachable set enormously (002/009/017/028/029 all pipe arbitrary bytes into a char buffer), so land it before or alongside. Second, minor, pre-existing: emitted println! line-flushes where C stdio block-buffers on a pipe -- 46x slowdown measured on an 8.2M-line run with md5-identical output, a latent HARNESS_ERROR timeout source."
