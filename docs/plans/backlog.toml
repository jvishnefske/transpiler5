title = "Mechanical ledger/emitter drift audit: six more defects, and the census does not rank by tag after all"
summary = "Opened 2026-09-10, a MECHANICAL AUDIT commissioned after four other-bucket blind spots were found by accident in one session. Worth +0 TRACTOR -- instrument work. THE PREMISE WAS WRONG AND I HAD REPEATED IT IN FR-239 AND FR-240: the census does NOT rank by tag. scripts/tractor-census.py:231-239 prefers the full diagnostic over the coarse blocker with a comment recording why -- ranking on the tag collapsed 124 of 211 non-passing cases into a single other bucket. Reproduced on the live export census: of 133 cases with a non-empty blocker set, 111 would present as exactly ('other',) under the tag view; 13 distinct tag-sets against 39 distinct wording-sets. So 'invisible to the ranking instrument' was FALSE for the census specifically, but remains TRUE for the consumers that do read the tag: RatchetReport.cpp:74, RatchetManifest.tags at :165 WHICH IS A GATE, FrontierSearch.cpp:561, ShardMetadata.h:123, and the ledger's own blocker tabulation. METHOD with blind spots measured not asserted: anchored on emitError plus the deferred builders, merging adjacent literals -- 1283 statements, 901 literal fragments, 802 assembled messages; classify_blocker IMPORTED AND EXECUTED. Needles spanning an interpolation are invisible to the method and the cost was measured: 1 of 3 dead-needle candidates was a false positive from exactly that cause, so the two reported dead are grep-confirmed. SIX NEW DEFECTS: (1) TWO NODE-NAMED FAMILIES HAVE NO PREFIX ROW -- kNodeNamedPrefixes carries the assignable-expression, expression and statement variants but NOT the POINTER ones, so 'unsupported pointer expression: <Node>' and 'unsupported pointer cast (<Kind>)' lose their node class across 55 DISTINCT CORPUS CASES; FR-239's errno finding IS this bug and the general fix subsumes it. (2) DEAD NEEDLE 'written with a null pointer' (ptr-to-ptr-null-write) in BOTH mirrors with no emitter anywhere, grep-verified. (3) DEAD NEEDLE 'explicit class template specialization' -- W2.28 admitted explicit full specializations and deleted the rejection, keeping only the PARTIAL one, and the row survived in both mirrors. (4) MIRROR GAP AND IT IS LIVE: 'has no bit-exact Rust mapping' -> libm-not-bit-exact exists at RejectionLedger.cpp:234 and is ABSENT from run_realworld.py, grep-verified; FR-224 minted that tag precisely to stop expf falling into other and the RealWorld survey has reported other for it ever since; 3 corpus cases. (5) MIRROR GAP: 'was not reached: sibling specialization', C++ only, same shape. (6) A MIS-CLASSIFICATION WORSE THAN AN other: the widened global-address needle at RejectionLedger.cpp:106 (ptr-to-ptr-global-target) sits at row 5 ABOVE the returned-pointer rows and swallows 'return sites mix a global address and NULL' and 'returned pointer value (a bare return cannot carry the global address)', so a reader ranking the FR-62 cursor-parameter front would count returned-pointer work as cursor-parameter work -- FR-230's manufactured-lever shape, more dangerous than other because other at least advertises that it knows nothing. other IS NOT THE DEFECT CLASS I THOUGHT: 607 of 802 assembled messages classify other and MOST ARE FINE -- 'global initializer does not match its type' (21 sites), 'call argument count mismatch' (14) and friends are INTERNAL CONSISTENCY CHECKS with zero corpus hits, and a tag for them is a bucket nobody can act on; site count is the wrong instrument, exactly as CLAUDE.md section 3 says. Only the 22 wordings appearing in a REAL case's blocker set are candidates and realistically only the top six plus the two node-named families are worth a needle. THE RECOMMENDED TEST IS A NEEDLE-LIVENESS TEST NOT AN other ALLOWLIST: an allowlist would need a line per new diagnostic, review pressure would push people to add the line rather than think, and the census does not read tags anyway. The liveness half is nearly tax-free and would have caught THREE of the four accidental finds plus both dead needles and both mirror gaps: (a) every needle must be a substring of some enumerated literal with a LIVE-VIA waiver for interpolated ones (exactly one today); (b) the two mirrors must be table-identical modulo documented C++-only rows, a pure equality assertion; (c) no needle may shadow a later row with a different tag. And other becomes a REPORT not a gate: print the wordings that classify other AND appear in the newest census blocker sets -- empty most of the time, and exactly the signal that was missing. ROOT CAUSE, measured: 54 of 89 tags are asserted NOWHERE in test/ except inside the Python mirror itself, which is why needles rot. LANDED 2026-09-10 AT +0 EMIT AND +0 PASS as predicted by both sides. All six fixed plus a SEVENTH the liveness check found on its first run, and the check is now in the fast tier as test/Driver/rejection-ledger-needles.c over scripts/check-rejection-ledger.py. DEFECT 7, FOUND BY THE TEST RATHER THAN BY A HUMAN, WHICH IS THE WHOLE ARGUMENT FOR THE TEST: stl-unrecognized-receiver HAD NEVER BEEN REACHABLE -- all five wordings it was minted for end 'receiver is not a recognized STL type' and the generic 'is not a recognized STL type' row sat ABOVE it and took all five; nothing pinned either tag. FIX 6's PRESCRIBED REMEDY WAS INSUFFICIENT AND I HAD IT HALF RIGHT: moving the broad global-address row below the returned-pointer group fixes 'returned pointer value (a bare return cannot carry the global address)' but NOT 'return sites mix a global address and NULL', which says MIX not DISAGREE and so matches none of the three existing returned-pointer needles; both a new row and the reorder were needed. FIX 1's delimiter question answered: no special handling needed, since the extraction is a run of word characters and ')' is not one. MEASURED MOVEMENT over the 110433-item kernel rejection report: other 59050 -> 53319 (-5731), entirely from fix 1 (ptr-cast:ArrayToPointerDecay +3819, ptr-expr:CStyleCastExpr +1060, :StmtExpr +499, :CallExpr +353), with EVERY OTHER TAG MOVING BY EXACTLY 0 -- direct evidence that fixes 6 and 7 disturbed no neighbour. The check derives _NODE_NAMED_RE from a (needle, tag-prefix) table so the word-character class has one definition; liveness allows a LIVE_VIA waiver for interpolation-built needles and the waiver is SELF-VERIFYING (a stale one and a broken anchor both FAIL); mirror equality is row-for-row with drift reported as a SET difference. NEGATIVE-TESTED not assumed: against the pre-fix tables it emits exactly 7 errors naming defects 2-5 and the two unreachable rows, and with only defect 7 re-introduced, exactly 1. AN HONEST LIMIT DOCUMENTED IN THE SCRIPT: check (c) CANNOT catch defect 6 and cannot without the other-allowlist that was deliberately rejected, because defect 6 is MESSAGE-level ambiguity between two rows that both still win other wordings, and the table is BUILT on deliberate ordering; the compromise is two sound structural rules plus a printed ambiguity inventory of 12 wordings with each winner named. A THIRD NODE-NAMED FAMILY WAS DELIBERATELY LEFT ALONE: 'unsupported cast (<CastKind>)', five emitters, 443 kernel items (PointerToIntegral 327, BitCast 116) -- NOT behaviour-neutral, since the specific UserDefinedConversion row sits ABOVE the node-named prefixes so a generic prefix would tag only the non-UDC kinds; recorded as a follow-on rather than smuggled in. Gate 1093/1093, clippy 57 (+0) with 294 files / 0 skipped / hash unchanged, binding 2307 (+0) and p95 5 (+0), CTestSuite 220/220, Cpp17Suite 35/35, golden movement 0 BY CONSTRUCTION as well as measurement since classifyBlocker's result flows only into RejectedItem::blockerTag and every consumer is a report, manifest or metadata path. NOTED NOT FIXED: test/Kernel/*.txt are now stale historical snapshots; nothing gates them and hand-editing a record of an unreproducible run would be worse. ACCEPTANCE: the six defects fixed (two rows added to the Python mirror, two dead rows deleted from both, the two pointer prefixes added to kNodeNamedPrefixes, the global-address row moved below the returned-pointer rows), then the liveness test. RatchetManifest.tags is a GATE so the prefix change WILL move it -- expect and record that movement."
