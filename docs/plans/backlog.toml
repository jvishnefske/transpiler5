[[items]]
id = "FR-209"
kind = "record"
status = "landed"
size = "M"
title = "FR-100's forwarding fixpoint records an edge only for arithmetic pointees, so an exported facade that delegates its struct pointer is refused"
summary = "Opened 2026-09-08 by the FR-178 re-measurement spike, as a NAMED CONSTRAINT that was previously invisible. CImporterInternal.h:9331-9335 inside collectSliceParamsImpl skips the forwarding edge unless the pointee isArithmeticType(), so a struct pointee falls through to the conservative sliceParams.insert at :9352 and the parameter becomes &mut [T] -- refused by every FR-182/FR-202 export class. MINIMAL DIFFERENTIAL, three functions in one file: inner(c) with member access only -> &mut Ctx EXPORTED; outer(c) forwarding the whole pointer -> &mut [Ctx] REFUSED; solo(c) control -> &mut Ctx EXPORTED. This is a GENERAL refusal of the 'exported facade delegates to internals' idiom, not a SPHINCS+ quirk, and it is the source of the 'address of a scalar object cannot be passed as a slice parameter' blocker at the call site (reproduced in 8 lines). THE USER-FACING PART IS THE WORST PART: the shape is reported as 'its signature is not all-scalar', factually true and completely uninformative -- it names neither the delegation nor the pointee-kind rule that decided it. At minimum this needs a LOCATED diagnostic. Widening the edge to record pointees is NOT costed: it moves emitted signatures repo-wide and would move goldens. LANDED 2026-09-09 as FR-219. The refusal now names the delegation and points a located note at the forwarding call; +0 items and +0 TRACTOR by construction, emitted Rust byte-identical. THE PAIRED SWEEP CAUGHT TWO WAYS THE FIRST VERSION WOULD HAVE LIED: (1) keying on the C parameter position and ParamKind::Slice described the WRONG argument, because an FR-62 owner method carries a synthesized receiver and some Slice-classified params are emitted as i64 cursors -- ParamKind is not the last word on the emitted type; (2) a function that forwards AND subscripts is still a slice without the call, so blaming the delegation would be false -- a soleReason check now suspends the forward's demand, asks, and restores it wholesale, and only sole-reason records surface. A second real instance was found in the shipping suite (do_indexing in flexible-array-member-tail-local.c, whose own comment already said slice-classifies). Widening the forwarding edge is reported and NOT costed: one sole-reason instance across 785 files, rarer than FR-215 implied, but the gate excludes internal-linkage functions that a widening would include, so it is not a blast-radius measurement."
