title = "A unique_ptr payload passed by mutable reference emitted a crate that did not compile -- and one spelling compiled clean and threw the write away"
summary = "LANDED 2026-09-03, found by the FR-187 borrowed_box spike while looking for a clippy fold. THREE broken shapes, not the one specified: h(*p) with Node& and hi(p->id) with int& both emitted rustc E0596 (unbuildable), and hi((*p).id) with int& BUILT CLEAN AND PRODUCED THE WRONG ANSWER -- clang++ prints id=101, the emitted crate id=1. isStlBoxWriteExpr recognised *p and the ARROW member form but not non-arrow (*p).field, so that spelling loaded the whole payload into a staged local and handed the callee a borrow of the COPY. cargo build cannot see this, which is why the fix keys on the AST place root rather than the emitted borrow. FIX: located rejection at the emitBorrowArgument chokepoint guarded by isMutParam, over a new matchStlBoxPayloadPlaceBase that accepts the non-arrow form -- `unsupported: mutable reference argument borrowed from a std::unique_ptr payload`, tag stl-unique-ptr-ref-argument REUSED not minted. Rejection rather than widening is right: the borrow mode is driven by the CALLEE parameter and a const Node& must keep the shared borrow. THE OVER-REJECTION GUARD IS LOAD-BEARING and independently verified: const Node&, const int& and by-value all still import. Pinned on BOTH sides -- import in test/Import/Cpp/stl-unique-ptr-ref-argument.cpp and RUNTIME in refargs in test/EndToEnd/stl-unique-ptr.cpp, because a FileCheck of the IR cannot tell a silent miscompile from working code and a byte-diff can. Gate 964/964, 207 insertions ZERO deletions. EPOCH CONSEQUENCE not a regression: the edited test is in the frozen epoch-5 corpus so clippy_eval now refuses with DRIFTED; measured in isolation the entire +16 is the added corpus lines and the compiler change is 94 -> 94 (+0). Epoch-5 must be closed and epoch-6 frozen."
