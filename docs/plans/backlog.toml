size = "M"
title = "An extern_decl obligation can outlive the rejection of its own definition"
summary = "SLICE 1 LANDED 2026-08-30, gate 919/919, whole-program crate byte-identical. MY ROOT CAUSE AND SEVERITY WERE BOTH WRONG: the obligation outlives the rejection of its USE, not its definition -- pendingExternGlobals.try_emplace is a permanent side effect that rollbackTo never undoes -- and it is a LIVE HEAD defect reproducible in NINE lines, not a future risk gating FR-166. I told the spike not to hand-reduce after failing three times; it reduced it anyway, and the ingredients I missed were that the rejection must land after the body registers the global and that the symbol must be a GLOBAL, since extern function prototypes are correctly rolled back. Fix is 31 lines: skip materializing a deferred extern_decl global with no surviving IR use. Function obligations stay hard rejections, which is what keeps link-merge-errors.c passing. Corpus sizing: zero unresolved at HEAD but 3,095 symbols are one importer fix away, of which 127 are cause-asymmetric functions this fix does not help (FR-171). Found by the FR-166 spike 2026-08-30. A symbol whose declaration and definition are BOTH dropped is harmless, but if anything makes the declaration importable while the definition is still dropped for an unrelated reason, the obligation becomes a hard unresolved-external with no escape hatch at LinkMerge.cpp:1068. Measured on VL_INTERFACE_IO_SYSTEMD: at HEAD both sides cascade off SdVarlinkInterface so the link is clean; under FR-166 the declaration imports, the definition still fails non-constant global initializer, and the 501-object whole-program link dies -- 48 shards excluded to get a building crate. THIS GATES FR-166 and will gate every future fix that makes a previously cascaded type importable, which is the entire point of the FR-165 leverage work, so it will recur. Directions: (a) link policy -- when a shard records that a definition was rejected, demote the matching obligation to a drop-with-cascade rather than a hard error; the shards already carry per-item rejection ledgers so the fact is available at merge time. (b) fix the non-constant global initializer shape, narrower and only moves the problem to the next asymmetric symbol. NOT SPIKED."
