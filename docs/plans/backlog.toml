title = "The 252-case corpus is 125 programs, one of which is 128 cases -- and the reachable SPHINCS+ prize is 20, not 128"
summary = "Opened 2026-09-09, from re-deriving FR-223 against the corpus itself rather than its case list. THE 252-CASE CORPUS IS 125 PROGRAMS AND ONE OF THEM IS 128 CASES. test_case is a SYMLINK in 127 of 252 cases; tractor-eval.discover follows it correctly so the SCORE is right, but nobody had resolved the links to count DISTINCT programs. Measured by realpath: 252 cases -> 125 trees, 124 of them 1 case each and ONE tree 128 cases (51% of the corpus). The 128 are SPHINCS+ sharing 005_sphincs_PQCgenKAT_sign_blake_128f_simple/test_case, differing only in build config and in what the harness asks for: 48 exec + 80 lib. THE SCORE RESTATED: 41/252 cases IS 41/124 ordinary programs (33%) PLUS 0/128 SPHINCS+. Every per-case ranking this project has done was half-dominated by one program's configuration count -- the corpus-level form of the counting error FR-221 hit at site level. IMPLICATION: the ordinary cohort's ceiling is 124, so its whole remaining prize is 83 cases; SPHINCS+ alone is 128, and nothing else is within a factor of five. BUT THE REACHABLE SPHINCS+ PRIZE IS 20, NOT 128, and the export taxonomy says so with no new work: the 80 lib cases are only FOUR distinct symbols at 20 configs each. initialize_hash_function(spx_ctx *ctx) is ONE struct pointer = CLASS 1, exportable, 20 cases. prf_addr(out, const spx_ctx*, const uint32_t addr[8]), gen_message_random(R, sk_prf, optrand, m, mlen, ctx) and hash_message(digest, tree, leaf_idx, R, pk, m, mlen, ctx) carry three, four and five reference parameters with output buffers whose lengths are SPX_N macros the signature never states -- FR-181's HARD NO-GO verbatim, 60 cases, unreachable without overturning a recorded NO-GO (m/mlen is a declared CLASS 2 pair but one undeclarable length refuses the whole signature). So the corpus's largest lever is initialize_hash_function at 20 cases, gated behind the 5-fix import package the census measured for every SPHINCS+ lib case (aliasing mutable pointer arguments; non-constant array size; string function argument must designate a char array; the address of a scalar object cannot be passed as a slice parameter; unsupported pointer cast ArrayToPointerDecay). THE 48 exec CASES ARE STRICTLY HARDER THAN THE 80 lib ONES AND THE REASON IS TARGET CLOSURE, NOT SCOPE -- same 28 source files; the lib closures exclude rng.c, the bin closure includes it via PQCgenKAT_sign.c -> randombytes, which is the whole of why openssl gates them. libcrypto in the devshell therefore yields ZERO cases by itself: it converts 48 unmeasurable cases into measurable ones which then face the 5-fix package over a 28-file whole-program closure PLUS a working main. FR-223 ranked that item (1); on this evidence it is LAST. RANKED PATH FORWARD REPLACING FR-223's: (1) initialize_hash_function, 20 cases -- the 5-fix package then a CLASS 1 export, costed as a PACKAGE, no member worth anything alone, which is exactly what FR-221 measured when it deleted one member and got +0; (2) FR-224's shim table +4 to +6; (3) argv up to +5 but NOT one fix; (4) the other three SPHINCS+ symbols, 60 cases, blocked on FR-181's HARD NO-GO, do not start without overturning it; (5) openssl in the devshell, a measurement prerequisite with no direct yield. NOT IMPLEMENTED BY THIS ENTRY -- it is a measurement, and its claim is that this ranking is the one the corpus supports."
