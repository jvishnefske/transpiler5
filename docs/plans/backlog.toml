# Machine-readable backlog index over design.md.
#
# design.md remains the AUTHORITATIVE evidence ledger: every item here has a
# prose entry there (checkbox + spike verdict + measured evidence), found via
# `anchor`. This file is the QUEUE: status, rank, and dependency edges, cheap
# to query (`docs/plans/plan.py next`) instead of reading 12k lines.
#
# SYNC RULE (enforced by `plan.py check`, run by test/Driver/backlog-check.c
# in the fast lit tier): every unchecked `- [ ] FR-*/W2.*` box in design.md
# must have an entry here whose status is not landed/no-go, and vice versa.
# Update BOTH files in the same commit.
#
# status: open      = not started (spike still required if kind != tooling)
#         spiked    = spike verdict recorded in design.md; ready to implement
#         landed    = box checked in design.md (kept only when another item's
#                     blocked_by references it)
#         deferred  = deliberately parked, with the reason in design.md
#         in-flight = claimed by a live session (wave in the main tree or a
#                     running spike); `plan.py next` skips it -- the
#                     cross-session double-pick guard. Set it when you
#                     launch, move to spiked/landed when done.
# rank:   ascending priority among non-landed items; derived from the Track 5
#         demand measurement (2026-08-21) and the safe-failure rule (defects
#         that can miscompile outrank features).
# size:   S (<1 day), M (one wave), L (multi-wave / needs a design decision)

schema = 1

