[[items]]
id = "FR-215"
kind = "record"
status = "no-go"
size = "L"
title = "FR-174's top-ranked sub-item is not a mechanism, its amplification is not where FR-174 thought, and its largest piece is a union item"
summary = "SPIKED 2026-09-09, NO-GO AS RANKED. FR-174's top sub-item is not a mechanism, the amplification that earned it #1 is not where FR-174 thought, and its largest amplifying piece is not a pointer item at all. Re-derived at HEAD with FR-174's own method: 1592->1103 (direct 353->291, gated 1239->812), i.e. 31% smaller; family share held 66%->69.2%. Denominator differs (9842 vs 13342) and that gap is unresolved, so ratios are the comparable figure. RANKING PREMISE FALSE: at HEAD, union-arm-cannot-alias is 81.0x, volatile-qualified 13.0x, FILE* 11.3x -- all ahead of this item's 3.8x. THREE MECHANISMS, aggregate 3.79x blending 1.03x/8.1x/38.6x, established by instrumenting the single terminal residual at ImportCTypes.cpp:383-385 and re-running the identical census: 607 fn-ptr void* (9.95x), 205 array-element-is-pointer (1.03x, 178/199 const char *const), 193 anonymous-union pointer arm (38.60x), 82 fn-ptr incomplete-record pointee. THE 38.6x BUCKET IS A UNION ITEM: collectRecordFields flattens the anonymous union and calls mapType directly, bypassing mapStructFieldType's data-pointer->i64 shortcut, and FR-167 phase 1's trial/rollback replays the flatten-path wording. 17-line reproducer at plain HEAD. Rolled into the union family: 508 items behind ~50 direct sites = FR-167 phase 2. THE COSTED INCREMENT IS SAFE AND NET-NEGATIVE: 15 lines classifying a fn-ptr void* as the inert i64 cursor resolves 299 items and surfaces 303, ledger NET +4 -- the WRONG DIRECTION. 60 symbols blocked->clean, 0 clean->blocked, EndToEnd 325/325 with zero golden churn, 501-object link rc=0, cargo clean, FR-171's tripwire verified honest. A good change that buys nothing. TRACTOR +0 STRUCTURALLY: the reason appears ZERO times in the 202 EMIT_FAIL reasons. TRACTOR's real front is 'aliasing mutable pointer arguments', 80 of 252 (32%) -- nothing in FR-174's five sub-items competes. FR-61f-c HALF transfers, checked not assumed: the gate asks no aliasing question (bare isPointerType), so FR-136's points-to NO-GO is untouched; fnptr-void* is not representation either (it already exists twice, it was an unwritten classification arm); but array-elem IS representation, proven by the real tools refusing hand-written IR at parse time (invalid array element type, EmitRustTypes.cpp:79-83) -- a DIALECT change. FR-168's over-count does NOT apply: 0 of 291 direct sites are ported elsewhere; raw fan-out 7.7x. RECOMMENDS: FR-167 phase 2 (508 items, ~50 sites); and const char *const tables -> padded [[i8; W]; N] (~165 items, no dialect change) carrying two miscompile fences (a NULL hole must stay a located rejection since padding to '' flips !!table[i]; bare sizeof changes N*8->N*W). ALSO CORRECTS OUR OWN HARNESS RECIPE: --extra-cflags=-I<openssl-dev>/include BREAKS cmake configure -- all 202 EMIT_FAIL then report one cmake error instead of real blockers, PASS unchanged at 41. And it is worth +0 regardless: exactly ONE corpus file includes openssl (a SPHINCS+ rng.c), so the 48 are SPHINCS+ variants where it is only the FIRST failure. A sixth instance of the first-failure trap."
