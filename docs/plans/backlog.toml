size = "L"
title = "The const char *const string table lowers to the padded 2-D form at NET -100, and its NULL fence is 9x more load-bearing than the spike estimated"
summary = "LANDED 2026-09-09, implements FR-215's second recommendation. static const char *const t[N] = {literals} now lowers to the already-supported padded [[i8; W]; N] form -- no new op, type or dialect change; the recognizer hooks into createGlobal ahead of the mapType that produced the old rejection, so function-local statics come free. THE NULL FENCE FIRED ON 28 REAL SYSTEMD TABLES, NOT 3 -- ~9x more load-bearing than the spike estimated. FR-215 named virt.c:167, catalog.c:31, pager.c:304; the real set includes sigchld_code_table, sigsegv_code_table, sigill_code_table, sigfpe_code_table, sigbus_code_table, sigtrap_code_table, sigpoll_code_table, sigsys_code_table, sched_policy_table, dmi_vendors, rlmap, versions, string_bits and more. Every one is a DELIBERATE gap whose point is that the slot reads NULL (sigchld_code_table[0] is empty because SI code 0 is unused). Padding NULL to '' flips !!table[i], so without the fence those would have been 28 SILENTLY WRONG PROGRAMS. Located at the offending element, falling back to the declaration for a designated-init hole since an unlocated rejection is not a rejection; covers explicit 0/(void*)0, the sentinel idiom, C99 6.7.8p21 zero-fill, and designated gaps. A companion rejection keeps rows out of pointer-value contexts because padded rows have no address. POPULATION CORRECTION TO FR-215: its classifier undercounted the DOMINANT form. A source census finds 421 designated enum-indexed tables (systemd's DEFINE_STRING_TABLE_LOOKUP) against 15 positional. Clang resolves designators to positional slots before the importer sees them, so they are admitted. LEDGER: distinct blocked 21089 -> 20989, NET -100 (107 resolved, all pointer-type-outside-a-parameter-position; 7 surfaced, all the NULL fence; 21 more moved to the specific NULL wording). Ported globals 298 -> 399. Contrast FR-215's costed void* increment at NET +4 -- this one moves the right way. THE BYTE-DIFF CAUGHT A DIVERGENCE IN THE FIRST DRAFT, the one semantic difference padding makes: reading PAST a short element's terminator is UB in the pointer form but reads 0 in the padded form -- native printed adjacent .rodata where the crate printed 0. Not a miscompile of a conforming program, but documented in the test. A NUANCE THE SPEC HAD WRONG: sizeof folds from the CLANG AST TYPE, still const char *const[N], so it emits N*8 -- the same number the native prints. It does not CHANGE; it becomes a number that no longer DESCRIBES the emitted storage. Rejecting is still right since a memcpy extent from it would be wrong. sizeof(t)/sizeof(t[0]) folds to N ahead of the fence and is pinned positively -- rejecting ELEMENTSOF would have gutted the feature. STORAGE COST: 101 tables go 5,096 B -> 11,214 B (2.20x, reproducing FR-215's 2.22x); widest IMAGE_SEARCH_PATH [[i8; 108]; 4]. A 1 MiB per-table cap refuses pathological blowup; 0 tables hit it. TIGHTENINGS beyond brief: const pointee required (char *const t[] previously failed at the op verifier with a NON-located error), and sizeof(t[0])/sizeof(*t) fenced too. Gate 1031/1031, clippy 57 (+0) at epoch-7, binding both axes flat, both corpus ratchets unmoved, TRACTOR 41/252 -- exactly the +0 FR-215 predicted structurally. Golden movement 0 MOVED (720 identical, 360 both-rejected, 2 newly admitted = the new tests), with the full lit suite run alongside the sweep per FR-167's split-file blindness warning. NOT comparable to FR-215's absolutes: measured over a fresh systemd clone (2ff84cf) and a self-pinned population."
