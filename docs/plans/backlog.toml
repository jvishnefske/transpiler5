[[items]]
id = "FR-135"
rank = 26
kind = "defect"
status = "open"
size = "S"
title = "UPSTREAM: cf.switch custom assembly cannot round-trip a negative case value"
summary = "Found by FR-134's spike. MLIR prints a negative cf.switch case value as an unsigned decimal (-2 -> 18446744073709551614) and its own parser then rejects it as 'integer value too large', so emitrust-cc --emit=import output is not always re-parsable by emitrust-opt. Confirmed UPSTREAM by a two-line hand-written probe; our IR is correct and its generic form round-trips fine. Debugging workflow only -- both affected corpus units (switch-general.c, unsigned.c) emit correct Rust and byte-diff green, because the pipeline never re-parses its own text, which is also why the suite is blind to it. Workaround: --mlir-print-op-generic. Fix belongs upstream in cf.switch's printer."
blocked_by = []
anchor = "FR-135 DEFECT (UPSTREAM, found by FR-134's spike)"

