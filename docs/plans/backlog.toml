title = "Every emitted crate has the wrong stdout buffering model, and only a non-flushing termination makes it observable"
summary = "Opened 2026-09-09, found by the FR-224 implementation's own byte-diff oracle while trying to admit abort. EVERY EMITTED CRATE HAS THE WRONG STDOUT BUFFERING MODEL AND EXACTLY ONE CONSTRUCT MAKES IT OBSERVABLE. C's stdout is FULLY buffered when it is not a terminal (a pipe or file), flushed at exit or when the buffer fills; Rust's Stdout is a LineWriter and flushes on every newline. For every NORMAL termination the two agree, MEASURED not assumed -- return and exit flush on both sides and produce byte-identical output including a trailing partial line with no newline. They diverge for any termination that does NOT flush: printf(\\\"before abort\\\\n\\\"); abort(); makes clang+glibc with stdout redirected to a file write NOTHING (C11 7.22.4.1p2 leaves the flush implementation-defined and glibc declines), while the emitted crate writes 'before abort' because the LineWriter already flushed on the newline. Diff 0a1 > before abort. THE DIVERGENCE IS THE SILENTLY-WRONG DIRECTION -- the emitted program prints bytes the reference build does not -- so abort now REFUSES located, with wording naming the real cause rather than the call. Nothing local to the call can fix it: flushing at the call site writes MORE than glibc, not less. WHY 1044 GREEN TESTS NEVER SAW THIS: it is NOT a blind spot of the byte-diff oracle, which caught it the moment a test had the shape -- it is a GAP IN THE CORPUS, since no EndToEnd test terminates without flushing, so the whole suite exercises only the case where the models agree. The lesson generalises: an oracle only refutes the shapes somebody wrote down, and a green suite is evidence about its own population. THE FIX, scoped and NOT COSTED: a fully-buffered BufWriter<Stdout> flushed at normal exit only -- a crate-wide output-model change that shifts EVERY emitted byte of every crate that prints, needing the full byte-diff wave and a large golden re-verification. Whether anything else observes the difference today is UNMEASURED, and so is the golden churn; check _Exit, quick_exit and a fatal signal via raise first, since they share the non-flushing shape. LANDED 2026-09-10, ALL FIVE CLAUSES MET. TRACTOR EMIT 69 -> 70, PASS 57 -> 57 (+0) -- bin2hex_lib clears EMIT and lands in SYMBOL_MISSING exactly as projected, being a two-pointer export case; the +1 is an EMIT number and is reported as one. THE OBVIOUS IMPLEMENTATION WAS WRONG AND THE MEASUREMENT SAYS SO: a BufWriter does NOT reproduce C. glibc's _IO_new_file_xsputn fills the buffer, flushes only when a write no longer FITS, then passes whole 4096-blocks straight through, while a BufWriter flushes what it HOLDS instead of filling. Measured at six boundaries (7 bytes -> 0 on disk at abort, 6000 -> 4096, one 4096 -> 4096, two 4096 -> 4096, 8192 -> 8192, 4097 -> 4096): the runtime reproduces ALL SIX and a BufWriter matches only the first. THREE MORE PLACES THE OBVIOUS ANSWER WAS WRONG: (1) macro shadowing must be TEXTUAL -- use crate::__emitrust_print as print; compiles and silently leaves a nested mod's println! bound to the std prelude, so only macro_rules! at the top of the file covers nested modules and the placement is load-bearing; (2) block-begin insertion is not enough -- a --link merge re-seats the runtime behind earlier shards' items and breaks the joint-vs-link byte diff, so items are marked and HOISTED AT RENDER TIME; (3) a per-shard runtime SHAPE is a hard error -- a pass-through writer for a module without c_main beside a buffered one for a module with it gives rustc E0428 when --link merges shards that split that way, so the runtime text is IDENTICAL in every module and only a runtime AtomicBool varies, which also makes the failure direction safe (--crate-type=lib on a main-bearing TU degrades to unbuffered writes rather than filling a buffer nobody flushes). EVERY EXIT PATH ENUMERATED AND PINNED, because a missed flush is silent truncation and would have been worse than the bug: return from main (entry wrapper), C exit(status) (flush spliced ahead of EVERY std::process::exit UNCONDITIONALLY, since a shard cannot know whether it will be linked into a bin and guessing wrong truncates silently), a Rust panic (hook chained in the init, which keeps the bounds-panic and actor-panic tests showing their stdout), and abort, which flushes nothing by design. No unsafe; no #[allow] needed since rustc's dead_code lint skips identifiers beginning with _. GOLDEN CHURN COUNTED AND RE-VERIFIED, NOT RE-BLESSED: 1342 files swept, MOVED 485 of which 3 are new tests so 482 pre-existing moved; 480 byte-identical, 376 rejected by both, 0 newly rejected, 1 newly accepted (the flipped pin). ALL 485 checked to carry the runtime -- none moved for any other reason. Re-verification by each file's own oracle: 298 EndToEnd by byte-diff, 68 c-testsuite and 35 Cpp17Suite by execution and output diff in their ratchets, the FileCheck goldens by the full lit run (required by the split-file blindness rule, since the hash sweep alone would have missed the libc-shim-invalid.c sub-units). The FR-224 abort pin was MOVED FORWARD not deleted: abort-stmt is gone because the refusal is gone, abort-value stays with wording unchanged, the abort-stdout-flush ledger tag is deleted in the same change as its rejection, a NOTSTUBBED scan asserts the function is no longer stubbed, and the comment KEEPS FR-224's history explaining the refusal was RIGHT and its cause lay elsewhere. TWO MEASUREMENT-LAYER DEFECTS SURFACED AND FIXED IN THE SAME COMMIT: binding_eval.py's DEFAULT_BASELINE still named the CLOSED binding-baseline-epoch6.json so a bare invocation exited 2 with 'refusing to measure' and every caller passed --baseline by hand -- that is CLAUDE.md's 'three consumers name the baseline document' drift, ONE CONSUMER SHORT, and it predates this work; re-pinned to epoch-7. And FR-228 INFLATED THE BINDING METRIC'S DENOMINATOR: its runtime is ~44 counted statements in EVERY crate, so statements jumped 19695 -> 32481 and free/100 stmts FELL 11.71 -> 7.10 WITH NO EMITTER CHANGE BEHIND IT. Both ratchet axes are ABSOLUTE and unaffected so nothing fired and nothing was re-pinned; CLAUDE.md warns a per-100-statements ratio is gameable by REMOVING good statements and this is the mirror image, gameable by ADDING neutral ones. The report now says so inline; excluding runtime items needs a change to the syn-based probe and is NOT done. _Exit / quick_exit / raise NOT implemented, refusals pinned verbatim: _Exit is ALMOST free since std::process::exit(n) WITHOUT the flush splice reproduces C exactly when stdout is a file (measured 0 bytes), but it FAILS ON A TTY where glibc line-buffers and C writes the complete line while dropping the partial one (measured through a pty), so admitting it requires the writer to own the terminal case too; raise is further off since Rust std has no raise and raise(SIGABRT) is only abort-equivalent while no handler is installed. The 4096 buffer size is st_blksize-dependent -- right on every filesystem here and the six boundaries reproduce exactly, but NO lit test prints past 4096 then aborts, since that would assert a property of the checkout's filesystem rather than of the emitter. Byte-diff run with stdout redirected to a FILE in every RUN line, not a tty. I RE-VERIFIED THE TWO LOAD-BEARING CASES MYSELF in the main tree: printf-then-abort gives rc 134 and 0 BYTES ON BOTH SIDES (it wrote 12 bytes before this change), and 900 lines plus a partial line then exit(3) gives 8008 bytes BYTE-IDENTICAL across the 4096 boundary. Gate 1074/1074, clippy 57 (+0) at epoch-7 with the population hash unchanged, binding both axes flat, CTestSuite 220/220, Cpp17Suite 35/35. ACCEPTANCE, ALL MET: (1) a fully-buffered stdout writer flushed at normal exit only; (2) printf-then-abort byte-identical to the clang native with stdout redirected to a FILE, and still byte-identical to a terminal run; (3) the partial-line-then-exit shape stays byte-identical, i.e. the fix does not trade one divergence for another; (4) abort's located refusal is replaced by a working lowering and bin2hex_lib clears EMIT; (5) golden churn reported as a COUNT and every moved golden re-verified by its own oracle rather than re-blessed."
