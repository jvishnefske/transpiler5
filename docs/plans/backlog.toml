[[items]]
id = "FR-223"
kind = "record"
status = "open"
rank = 8
size = "M"
title = "The census the project has been missing: 21 FRs and 43 tests moved TRACTOR by one, and marginal yield is a property of the SET"
summary = "Opened 2026-09-09. THE CENSUS THE PROJECT HAS BEEN MISSING, and it reframes the goal: 21 FRs AND 43 NEW TESTS THIS SESSION MOVED TRACTOR BY ONE CASE (40 -> 41). THE GATE IS NOT THE GOAL. Every prior ranking used a FIRST-FAILURE histogram, wrong SEVEN times (FR-61f x2, FR-165, FR-138, FR-177, FR-178, FR-221); FR-177 tried per-case blocker SETS and was still wrong because it measured only the EMIT stage of a THREE-stage rubric. scripts/tractor-census.py measures every case's COMPLETE emit blocker set via --recover --incremental, joined against the rubric's own results.json so PASS is never redefined, plus SET-COVER. MARGINAL YIELD IS A PROPERTY OF THE SET: a blocker in 83 cases is worth ZERO if all 83 also need four other fixes. CORPUS SHAPE at 41/252: exec 13 PASS / 92, lib 28 PASS / 160. BLOCKER-SET DEPTH over the 148 non-passing cases that reach the importer: 48 need 1 fix, 19 need 2, 33 need 3, 48 need 5. THE 5-FIX SET CLEARS +82 EMIT BUT ALL 82 ARE lib AND ZERO ARE exec -- clearing emit is not PASS, a lib case must then export a dlsym-able symbol, which is FR-178's finding and the EIGHTH instance of the trap, caught this time before the work was dispatched. EXPORT CEILING MEASURED, not assumed: of 80 classifiable lib entry points, 46 are CLASS 0 (all-scalar) and 15 are CLASS 1/2, so 76% are exportable and only 19 have >=2 pointer parameters (FR-181's HARD NO-GO cohort). 54 CASES NEVER REACH THE IMPORTER AT ALL: 48 openssl (exec, so they need no export -- get libcrypto into the devshell), 5 argv (main drops, so NO CRATE is written and the bin crate never exists), 1 returned pointer. RANKED PATH FORWARD, in measured order: (1) openssl in the devshell, (2) the 15 sole-blocker exec cases (see FR-224), (3) argv support, (4) the 61 exportable lib entry points. HARNESS CORRECTION carried here so it is not lost: run tractor-eval.py with a PRIVATE --out (the default is shared and two agents overwrote each other) and NO --extra-cflags -- the openssl recipe that used to be documented BREAKS cmake configure, so all 202 EMIT_FAIL cases then report one 'cmake configure failed' instead of their real blocker, destroying the census while leaving PASS unchanged. CORRECTED 2026-09-09: EVERY DEPTH ABOVE IS A LOWER BOUND, NOT A COUNT. --recover drops whole TOP-LEVEL ITEMS, so every blocker INTERIOR to a rejected function is structurally invisible -- 004_nineality_sieve reports depth 1 (argv) and needs AT LEAST FOUR (argv, strtol-with-endptr, fprintf to stderr, endptr-vs-argv[1] pointer identity). '48 need 1 fix' is '48 show one blocker at recovery granularity', the first-failure error wearing a set-cover costume, and it is why this entry's ranked item (3) 'argv support' was understated as one fix. The tool now labels depth a LOWER BOUND, records per-case dropped_items, and SPLITS sole-blocker into CONFIRMED vs PARTIAL; re-measured, argv moves to PARTIAL and the libc: family stays CONFIRMED. SECOND BLIND SPOT FIXED: when recovery drops c_main a bin crate cannot be emitted at all, so no crate and no progress JSON were written and those cases scored depth 0 -- the tool now retries as --crate-type=lib, recovering 6; the other 48 fail in clang's PARSER before any import and are a distinct notes class. AND THE TWO 48-CASE COHORTS HERE ARE NOT THE SAME 48 (see FR-225): the 'need 5' are SPHINCS+ lib extractions, the 'openssl' are SPHINCS+ exec KAT drivers, same 28 files, different TARGET CLOSURE. DEFINITIVE SET-COVER 2026-09-09 after three instrument corrections: the census was ranking on the progress JSON's COARSE blocker tag, collapsing 124 of 211 non-passing cases into one 'other' bucket; it now ranks on the item's full diagnostic sentence. Two exclusions were added and BOTH changed the answer -- unreached-by-import is a MARKER not a fixable blocker (leaving it in let the optimiser spend a fix on it and report a 4-fix set of +34 no engineering could deliver), and PARTIAL cases are excluded so every number is a case that really would clear EMIT. 154 of 211 qualify. 1 fix -> +14 EMIT (exec 4, lib 10) system-header call [FR-224]; 2 -> +21 (exec 6, lib 15) + pointer assigned a non-address value; 3 -> +34 (exec 0, lib 34) aliasing mut ptr args + non-constant array size + string fn argument must designate a char array; 4 -> +48 (exec 4, lib 44) that set + system-header call; 5 -> +82 (exec 0, lib 82) + address of a scalar as a slice parameter + ArrayToPointerDecay. THE 5-FIX SET IS EXACTLY THE SPHINCS+ PACKAGE FR-226 MEASURED and clears 82 lib EMIT, reproducing this entry's original '+82 all lib' from a completely different code path, so that figure is confirmed twice. Composition priced against FR-227's export wall: 20 are initialize_hash_function (12 blake exportable via the unaccessed-pointer class, 8 sha2 not), 60 are the walled multi-reference symbols, 2 other -- so five importer fixes plus one export class is +12 PASS and 60 of the 82 stay SYMBOL_MISSING however good the importer gets. THE CHEAPEST REAL YIELD IS THE 1- AND 2-FIX ROWS, the only rows containing exec cases, which need no export at all. CORRECTED AGAIN 2026-09-09 AND THIS ONE IS A DEFECT IN THE INSTRUMENT: THE 'SOLE BLOCKER, CONFIRMED' COLUMN WAS ~92% UNVERIFIED. RejectionLedger prints item.stubbed ? 'stubbed' : 'dropped' and the census counted only 'dropped '; a STUBBED item hides its interior identically (the importer bails at the first error inside any item it rejects). 138 stubbed vs 12 dropped corpus-wide, so 36 of the 39 CONFIRMED cases contained a stubbed item. Proven IN SITU by the FR-229 spike. THERE IS NO 'CONFIRMED' SET AND THERE CANNOT BE ONE -- every non-passing case has a rejected item, that being what makes it non-passing, so every set is a LOWER BOUND and every yield an UPPER BOUND. Column removed, not repaired; the tool reads per-item status from the progress JSON, labels the single-blocker table an explicit upper bound, and prints a REJECTED ITEMS PER CASE histogram. FIRST CALIBRATION POINT, worth more than the column was: predicted +14 EMIT for the system-header fix, FR-224 delivered +7 -- roughly HALF. Discount by ~2x until there are more data points. THE HISTOGRAM RECALIBRATES SPHINCS+ DOWNWARD SHARPLY: 60 cases have 0 rejected items (never emitted a crate -- the openssl parse failures), 43 have 1, 19 have 2, and the 7/8/14/15 groups are 80 cases, the SPHINCS+ lib cohort, EACH HIDING SEVEN TO FIFTEEN STUBBED FUNCTIONS. For the 5-fix set to clear them, those five classes would have to be the complete blocker set of all 7-15 stubbed functions in every case, and nothing measured says they are -- so '+82 EMIT for 5 fixes' is a VERY LOOSE upper bound and FR-226's '+12 PASS' inherits that looseness. Re-cost FR-226 by fixing ONE class and re-measuring the stub count: THE STUB COUNT PER CASE IS NOW THE CHEAP PROGRESS SIGNAL that did not exist before, and it moves after each fix without needing the whole set. By contrast the SHALLOW cohort is trustworthy-ish: 43 cases have exactly ONE rejected item, which is where FR-229's family lives and why its spike could hand-verify residue as zero for 10 of 12 programs. CENSUS SNAPSHOT AT 55/252 (2026-09-10, after FR-224 and both FR-229 waves): <=7 pointer assigned a non-address value (exec 2, lib 5); <=4 argv (exec 4); <=4 pointer variable has no known target object (exec 2, lib 2); <=2 each for void pointer parameter, address of a global, bit-field initializer, locale ctype lookup and scanf conversion; <=1 each for the abort stdout-flush refusal, the libm accuracy refusal, pointer-to-pointer parameter, the last system-header call, pointer-cast-reinterprets-pointee, and comparison of pointers into different objects. TWO MOVEMENTS WORTH READING: 'the address of a scalar object is not a string region' is GONE from the table entirely (it was <=5 before the byte-view waves), the cleanest available confirmation that FR-229 hit a real CLASS rather than five special cases; and 'scanf conversion' APPEARED at <=2, which is NOT a regression -- those are 035/038 exec, the last two members of FR-229's family, whose byte-view blocker cleared and revealed the %f behind it. A blocker appearing because the one in front of it was fixed is the expected shape of progress. The rejected-items histogram is essentially unchanged (60/35/17/1/4 plus the 7-8-14-15 SPHINCS+ groups at 80), so none of this session's work touched the deep cohort, exactly as predicted. THE RANKED PATH FORWARD IN THIS ENTRY IS SUPERSEDED BY FR-225 AND FR-226. ACCEPTANCE: the census script is checked in and its numbers reproduce at HEAD; each ranked item is costed by SET-COVER before dispatch, never by frequency."
