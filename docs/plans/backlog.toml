title = "A %s argument is materialized at argument-lowering time, not read at conversion time, so a later argument that writes the buffer is lost"
summary = "Opened 2026-09-03 by FR-191, which found it and deliberately preserved it unchanged. printf(\"[%s] %d\\n\", buf, bump()) where bump() writes into buf: native prints [Bb] 1, the emitted crate prints [ab] 1. C evaluates every argument before printf writes anything and then converts %s by reading the pointer AT CONVERSION TIME, so the write is visible; the emitter snapshots the region when it lowers the argument, so it is not. REPRODUCES WITH PURE-ASCII PAYLOADS AND PREDATES FR-191 -- a different bug from the Latin-1 funnel that merely lives next door. FR-191 found it while fencing its own ordering hazard and preserved it exactly rather than stacking a second failure on top: its raw-bytes bypass is declined whenever a later argument has side effects, which keeps this shape on its existing wrong-but-unchanged path. The fix is a snapshot-vs-borrow decision that runs into Rust's borrow rules -- reading at conversion time means holding a borrow across the evaluation of an argument that mutably borrows the same buffer -- so it needs its own spike, not a patch."
