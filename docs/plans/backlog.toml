[[items]]
id = "FR-214"
kind = "feature"
status = "landed"
size = "M"
title = "A binding-hygiene metric for the emitted Rust -- two Pareto axes, and the first thing it measured was its own Goodhart trap"
summary = "LANDED 2026-09-09. nix/clippy-eval/binding_eval.py plus a syn-based Rust probe, shaped like clippy_eval.py and IMPORTING its is_pinned/pinned_population so the two cannot drift on what 'the same population' means. AXIS A free temporaries: generated-named, exactly one use, in the next statement, and inlining crosses no side effect. That last condition mirrors FR-192's laterArgSideEffects and is the load-bearing one, but measured honestly it rejects only 14 of 2213 candidates (0.63%) because the emitter already emits ~one effect per statement -- it is a correctness guard on the DEFINITION, not a volume filter, and will bite when statements start being fused. A CONDITION THE SPEC DID NOT ASK FOR, added because the metric would otherwise reward a behaviour change: a use that is a method receiver, field base or index base does not MOVE the value, so inlining pulls its drop from end-of-block to end-of-statement -- observable for a side-effecting Drop. Now requires the let's annotation to prove no Drop is possible; cost 106 sites (2040->1934). AXIS B expression nesting depth (p95 5, max 12, mean 2.50), the anti-cramming guard. VALIDATED BY THE BYTE-DIFF ORACLE, not inspection: every flagged binding mechanically inlined across all 232 crates that have any, both copies built, stdout/stderr/exit byte-diffed under three argv vectors -- 221/221 runnable crates IDENTICAL, 1895 bindings inlined, zero divergences. Two first-pass divergences were the ORACLE's fault: Rust's panic header embeds the OS thread id. TWO RATCHET INPUTS DEMOTED TO REPORTED-ONLY for measured reasons. depth_max is a single-statement tripwire whose outliers are compound-assignment expansion and bitfield masking, i.e. not the cramming it exists to catch. And free_per_100_stmts is THE GOODHART TRAP, sprung by FR-213 the same day: merging 30 late-init pairs left free_temps at EXACTLY 1934 and dropped statements 16373->16343, so the RATIO rose and the ratchet fired on a change that improved the code and did not touch binding hygiene. Removing a good statement must never read as debt. Axis A now ratchets the ABSOLUTE count -- sound because the epoch freezes the population, and what clippy_eval already does with total_warnings. The ratio stays reported since it is what carries meaning ACROSS epochs. Ratchet verified per input: free_temps fires, depth_p95 fires INDEPENDENTLY (Pareto works), reported-only fields do not. Baseline pinned at epoch-6: free_temps 1934, depth p95 5. DELIBERATELY NOT WIRED INTO THE MESON GATE -- wants a few waves of stability first. NOT SEEN, all failing toward NOT counting: a C local literally spelled v3, non-conforming macro bodies, inline format args (0 at baseline), anything needing type resolution."
