title = "Fold Deref::deref(&p) to *p at emission -- 19 warnings, zero goldens moved, no dialect change"
summary = "LANDED 2026-09-03: measured 132 -> 101 (-31) at the epoch-6 pin, borrowed_box 31 -> 0 and gone from the queue, ZERO goldens moved, IR pin unshifted, gate 968/968, +168/-23 in TranslateToRust.cpp alone with lib/ImportC untouched (confirming the spike's central claim). THE SPIKE WAS WRONG ABOUT ONE THING AND THE INCREMENT CAUGHT IT: it recorded \"no new lint of any kind\", but three sites move from borrow_deref_ref (6->3) to explicit_auto_deref (0->3) -- the same three borrows relabelled, a wash, so the whole -31 is borrowed_box. Constraint 4's PREMISE (\"buys no lint\") is therefore measurably false; it buys 3. The decision may still be right since &p relies on deref coercion resolving against the annotation, which is the real fragility -- but it must be re-argued on that, not on the refuted lint count. Two deliberate narrowing tightenings and one latent hazard reported-not-guarded (a read-only deref_mut chain would want a shared borrow while postInitMutation still emits let mut, a LOUD unused_mut failure; unreachable because the importer rejects deref_mut for reads). Original spike verdict follows. Route 2 (relax emitrust.deref to take an opaque receiver) is NO-GO for a non-obvious reason: it is not a POINTEE relaxation but an operand-KIND flip -- the Box place is lvalue<opaque<Box<T>>>, not an opaque value, and loading it would MOVE the box. Worse, DerefOp::verify's only invariant (result value type == operand pointee) CANNOT be preserved for an opaque receiver, because opaque<Box<i32>> carries a rendered type STRING not a structural pointee, so relaxing means deleting the check on exactly the shape that motivated it. It would also erase the emitrust.addr_of mut that is the ONLY IR record that a Box access is a mutable borrow, read by bindingIsBorrowed (which keeps a Drop-carrying binding out of loop-body dead-store elision, the FR-105/130 danger zone), isInlineNonBarrier and postInitMutation. Route 3 (emission-side fold) is GO and strictly better: no dialect/importer/op change, exactly one test pins the spelling and it pins IR not Rust so ZERO goldens move, byte-identical to clang native on four inputs, projects 94 -> 75 (-19) all from one file. CONSTRAINTS: do not fold under a whole-value load of a non-Copy payload (*Deref::deref(&p) can never move, *p can -- a loud E0507 would become a silent move-out skipping the box's Drop); suppress the TEXT but keep the ops in the IR so the three analyses still see their inputs, and do not reuse droppedOps (gated on isPureProducer which excludes both ops); fold only single-use chains; do not fold &*P further to P; leave the sibling Index::index map fold alone."
