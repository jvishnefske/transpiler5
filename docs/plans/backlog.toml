title = "An enum with any enumerator outside i32 range is rejected whole (278 items, 11x)"
summary = "PHASE 1 LANDED 2026-08-30 once FR-168 cleared the blocker. Gate 923/923, 501 shards with ZERO exclusions, whole-program crate 12,371,799 bytes, cargo 0 errors, all verified by regenerating every shard. does-not-fit-in-i32 occurrences 1165 to 6; ledger resolved 469 / surfaced 144 / net -325; 17 _SD_ENUM_FORCE_S64 enums now emit against zero at HEAD. THE SPIKE PROTOTYPE CONTRADICTED THE CONSTRAINT and the implementer caught it: it relaxed the non-wide gate to isUInt<32>, which is the FR-169 relaxation, and that was the real cause of a fast-tier FAIL the spike reported as negative tests. Shipped version keeps the non-wide gate signed-only, so 6 systemd enums including EPOLLET stay rejected rather than being admitted as u32 and miscompiled. Byte identity measured by hashing emit-rust and emit-mlir for all 992 test sources: exactly 2 differ, both new tests. SPIKED GO 2026-08-30 but CANNOT LAND ALONE -- blocked on FR-168. 11 sites assume 32-bit storage, 8 need changing. Measured: 471 items resolved, 146 newly-surfaced second-layer blockers, net -325; my 278 projection was low on resolved and high on net. Byte identity holds (281/281 EndToEnd, all crate goldens, zero bytes moved); the only 3 failures are negative tests pinning the removed rejection. BLOCKER: FR-166 breaks the 501-object whole-program link, because making SdVarlinkInterface importable turns a symmetric pair of drops into a live extern_decl obligation whose definition is still dropped -- 48 shards excluded to get a building crate. A MISCOMPILE sits in the obvious extension (FR-169): castEnumToI32 discards signedness, so relaxing the 32-bit UNSIGNED range gives native cmp 1 1 1 vs rust cmp 1 0 1. Entry premise falsified: the guard rejects values that fit u32 storage exactly, so glibc EPOLL_EVENTS is refused for that reason not the 64-bit one. Anonymous enums are nearly a non-issue. Operational: adding an EnumDefOp attribute invalidates every existing shard bytecode. Opened 2026-08-30 from the FR-165 root-cause pass. ImportCAggregates.cpp:2034-2039 refuses an entire enum if any enumerator falls outside INT32 range. Gates 278 items -- 25 direct plus 253 cascaded, 11x amplification -- across 19 distinct enums. The C is deliberate and idiomatic: systemd's _SD_ENUM_FORCE_S64 macro appends an out-of-range enumerator precisely to force 64-bit width, and every flags enum in sd-json.h and sd-varlink.h carries it, which is why the SdJsonVariant and SdVarlink type families all fall over. Looks tractable because variantValues is already SmallVector<int64_t> and the comment below the rejection says storage follows clang's underlying type choice, so a width notion exists -- but do not assume; measure the dialect and emitter constraints first. NOT SPIKED."
