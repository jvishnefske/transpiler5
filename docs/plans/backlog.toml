title = "The instrument that ranks all work measured only the first of three stages, and recommended the one set the rubric cannot pay for"
summary = "Opened and LANDED 2026-09-10, forced by FR-233. Worth +0 TRACTOR by construction -- it is the ranking tool, not the compiler. FR-233 established that the export stage gates the lib half of the corpus; tractor-census.py could not see it, so its top recommendation was a set whose cases are structurally incapable of scoring. Script-only (+344/-23); no .cpp, no test, no oracle touched. WHAT IT NOW REPORTS over the 160 lib cases: 93 refused, 64 exports, 3 absent, with refusal WORDINGS KEPT APART rather than bucketed (88 FR-139 all-scalar, 3 FR-182 unfaithful-layout pointer, 2 FR-209 delegation-induced slice) because collapsing them drops a real class into the other junk heap where nobody ranks it. CALIBRATED, the part that makes it trustworthy: on the 50 cases whose outcome the export stage already decides, 36/36 PASS read exports and 13/13 SYMBOL_MISSING read otherwise; a disagreement means the parser is wrong, not the binary. THE RANKING ACTUALLY CHANGED: the 3-fix cover headline is unchanged at +34 EMIT but 33 of the 34 are EXPORT-WALLED and one exports; re-optimising with walled cases out of the objective picks a COMPLETELY DIFFERENT 3-fix set worth 11 PAYABLE (exec 8, lib-exports 3) instead of 1 -- argv, pointer variable has no known target object, and taking the address of a global variable. The instrument no longer recommends the aliasing/non-constant-array-size/string-function trio. IT CONTRADICTED FR-233 AND FR-233 WAS WRONG (see that entry corrected item 3): SPX_initialize_hash_function exports today in all 12 blake configurations. A DEFECT IN ITS OWN FIRST IMPLEMENTATION, RECORDED BECAUSE IT WILL RECUR: matching the target symbol by string equality reported 32 SPHINCS+ cases as absent while emitrust-cc was plainly printing their refusals -- the warning and emitrust-progress.json both carry the RUST name (spx_prf_addr) and only the export_name attribute carries the C spelling (SPX_prf_addr), an attribute that exists only for symbols that already export. There is no machine-readable C-to-Rust map in any tool output, so attribution goes through a documented case/underscore fold used ONLY when the fold is unique and never to declare an export (dlsym needs exact); 68 of the 160 verdicts rest on that fold and the report says so. A SOFT SPOT SURFACED RATHER THAN HIDDEN: --recover stubs a body and FR-202 bound and FR-226 unaccessed pointer are decided FROM THE BODY, so a stub can satisfy never accesses the pointer VACUOUSLY; 12 exports verdicts are on stubbed items and 6 of those reach the C ABI through a delegating wrapper and are genuinely soft, while the other 6 are FR-139 plain no_mangle which reads the signature only. Both numbers printed and in census.json. EVERY EXISTING CAUTION SURVIVES VERBATIM -- the EVERY DEPTH IS A LOWER BOUND docstring, the deleted-CONFIRMED-column warning, the FR-224 +14/+7 calibration, and the AND AT THE EMIT STAGE ONLY paragraph. The new column is labelled an OBSERVATION of what this binary does today, never a prediction: a walled case is not unreachable, it needs an export-class fix IN ADDITION to the importer one. A CORRECTION TO MY OWN SPEC: tractor-census.py IS NOT IN THE FAST LIT TIER. I told the agent it was; grep -rn tractor-census matches only CLAUDE.md, design.md and the two plan files -- no test, no meson.build, no lit.cfg.py. I had conflated it with plan.py check, which IS gated. THE TOOL THIS REPO RANKS ALL WORK WITH HAS NO TEST AT ALL; a real gap, not fixed here. Fast tier run anyway: 731 lit tests passed, 0 failed. TWO C++ CHANGES IDENTIFIED AND DELIBERATELY NOT MADE, either of which would delete the fold heuristic and make the census exact: the export refusal warning names the Rust item rather than the C symbol the harness dlsyms, and emitrust-progress.json likewise records only the Rust name where a c_symbol field would serve every downstream consumer. Each recover crate now also writes export-warnings.txt so verdicts can be re-derived without a second six-minute corpus pass."
