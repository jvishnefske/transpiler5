title = "The worst dispatch-switch shape is not Duff's device and the blowup is not in tail copies; the unbounded emitDispatchSwitch path is now bounded"
summary = "LANDED 2026-09-08, closes FR-197's SECOND residual (the unbounded emitDispatchSwitch path). TWO CORRECTIONS TO THE PROSE. (a) FR-198 framed this residual as Duff-specific; measured, DUFF IS THE MILDER SHAPE. The worst is an ordinary fall-through ladder wrapped in one if, which reproduces FR-197's PLAIN-path curve almost constant-for-constant (438 vs 445 lines at N=8; 14300 vs 14307 at N=32) -- the nesting changes the ROUTE, not the blowup. (b) FR-197's mechanism claim is only PARTLY confirmed: its constant-counting reproduces (the (N-k+1) ramp) but section BODIES are not duplicated -- 32 distinct printf format strings each appear EXACTLY ONCE, and growing each body 16x costs 14300->14301 lines. The N^2/2 cost is the control-flow skeleton and rematerialized constants, not tail copies -- which is also why bounding section COUNT bounds the blowup. FR-197's 'NOT MEASURED: the exact N at which the pipeline crosses a practical timeout' is now measured for this path: N=80 finishes in 192.70s, N=100 does NOT finish in 400s and emits NOTHING -- no output, no diagnostic. That hang is the defect. Output growth is quadratic (constant second difference of 192); wall time is far worse (N=48->80 is 1.67x in N for 19.8x in time, about N^5.8). THE DECISIVE CONTROL that makes the bound a scalpel: the same nesting and same label count with every section ending in break is EXACTLY LINEAR (3N+11 lines, 0.11s to N=128). So the quantity to bound is the FALL-THROUGH CHAIN, not the label count -- a label-count bound would have over-rejected every large-but-linear switch. emitDispatchSwitch now measures the longest run of consecutive sections that can fall into one another (recursive source-order scan, since dispatch-path labels sit at arbitrary depth) and refuses past the SAME kMaxSwitchFallThroughChain = 32 FR-198 chose. The fall-in flag is a deliberate OVER-approximation, so the measured chain can only be longer than reality and no hang slips past. Boundary exact: 32 imports, 3