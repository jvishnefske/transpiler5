# ---- FR-61f remainders, re-ranked by ONLY-OFFENDER measurement (2026-08-26).
# A first-failure rejection count is an UPPER BOUND on a clause's yield, not
# its yield -- widening an early clause just hands those loops to a later one.
# Every yield below is what a single-kind widening actually unlocks. Prose:
# design.md, the "STILL OUT after 61f-10" block under the 61f entry.

[[items]]
id = "FR-61f-d"
rank = 23
kind = "feature"
status = "open"
size = "M"
title = "Range-for: structured control flow in the body, and descending -> .rev()"
summary = "The `if` leg LANDED as 61f-12 (82 first-failure rejections, realized yield +7 -- about 8%, the third confirmation of the upper-bound lesson); the nested-loop leg landed in 61f-6. What REMAINS is `?:`/&&/||/StmtExpr/switch and every jump. break/continue/goto/return STAY FENCED -- emitrust.for has no exit edge, so admitting them is an op-design change, not a widening. Descending (12) is a SEPARATE and smaller item, and is NOT the self-contained importer change earlier entries called it: it needs a new emitrust.for attribute plus emitter support, because (lo..hi).rev() is NOT hi..lo -- C's `i > LO; i -= K` is ((LO+1)..=HI).rev().step_by(K), and that LO+1 risks overflow at the type max."
blocked_by = []
anchor = "STILL OUT after 61f-10"

[[items]]
id = "FR-61f-f"
rank = 21
kind = "feature"
status = "spiked"
size = "S"
title = "Range-for: induction reuse across a second nested pair blocks the lift"
summary = "Isolated by differential probe during 61f-12, not inferred. Two nested i/j loop pairs in one function: with FRESH inductions in the second pair ALL FOUR loops lift (0 loop{}); with the SAME i/j reused, only two lift and two stay loop{}. That is exactly the shape of the last four loop{} in test/EndToEnd/struct-long-arrays.c, which 61f-12 could not clear. The assignment-form dead-after analysis (inductionDeadAfter/walkAfter/effectOn) is the only clause that inspects induction reuse, so that is where to look. Cheap-looking and well-scoped -- but measure the realized yield before building: this FR has now measured the first-failure-to-realized ratio at roughly one in eight, three times."
blocked_by = []
anchor = "STILL OUT after 61f-10"

[[items]]
id = "FR-61f-c"
rank = 24
kind = "feature"
status = "open"
size = "L"
title = "Range-for: a body may touch a pointer (needs its own design pass)"
summary = "Biggest remainder by a wide margin: 201 of the 400 first-failure rejections on the post-61f-10 tree (121 body-touches-a-pointer + 80 non-comparison conditions, which are the pointer-walking heads `for (p = head; p; p = p->next)` and need a truthiness condition and a `p = p->next` step besides). A CHECKPOINT, not a foregone conclusion, and the ONE remainder where the cell-story-never-applied argument that carried 61f-6 and 61f-10 is genuinely FALSE -- here the cells are real. A pointer local never reaches the place/cell decision: emitLocalVar diverts to emitPointerLocal, which allocates raw memref cells on every arm, held as PointerLocalInfo::cursorCell, so placeBackedScalars is never consulted and CANNOT be (the cursor is a synthesized cell whose type is unrelated to the variable's mapped type). Liftability means teaching the pointer-region model to emit its cursor, its nullable discriminant and the CTS-P7 enum-of-bases discriminant as emitrust.variable places, then auditing every memref.load/store consumer. Core machinery: design pass before any code."
blocked_by = []
anchor = "STILL OUT after 61f-10"
