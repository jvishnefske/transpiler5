summary = "Opened 2026-09-11, first of the plan/tests/CI rewrite wave FR-242..FR-247; executes FIRST so the later five land as clean per-entry files. design.md is 25,474 lines and single-file range edits have silently deleted FR entries before (FR-113..115); the cure is to make the editable unit a small file. MEASURED 2026-09-11: 241 FR checkbox lines are 238 unique ids (FR-37 x3, FR-38 x2); six backlog items have no own entry; all 142 own-entry anchors already resolve inside their entry (zero exceptions); zero delimiter-lookalikes inside code fences; FR-157/171/233 prose-vs-status divergence is deliberate and must not be normalized. DECISIONS: checkboxes STAY (the box is the only status for ~100 pre-index FRs, the delimiter everything keys on, and the redundancy is the tripwire); hybrid layout defined as an ORDERED PARTITION of the original byte stream -- docs/plans/entries/ (~270 files, dup ids suffixed --2/--3), docs/design/ (11 chapter files), design.md slimmed to original lines 1-213 byte-identical, docs/plans/ledger.manifest lists members in order and plan.py JOINS them so every regex semantic is preserved by construction. THREE COMMITS: (a) plan.py dual-mode ledger_files()/ledger_text() + join subcommand + inert manifest-mode checks + scripts/split-ledger.py committed permanently; (b) the atomic split with the lossless proof sha256(concat of members) == sha256(original), full inventory assertions, backlog anchor_file additions; (c) protocol text in CLAUDE.md section 1, backlog.toml header, README ledger paragraph, then reconcile /home/j/mainwt and the systemd-probe worktree. ACCEPTANCE: lossless sha256 proof; plan.py check green with identical counts; plan.py brief byte-identical for all 148 ids; plan.py json identical."
