title = "CI rewrite: fail-fast tiers, live cache, scheduled ratchet workflow"
summary = "Opened 2026-09-11. Today's CI is one ~90-minute job: both lit tiers unordered, a duplicate c-testsuite ledger run (lit swallows passing stdout; cured by FR-243's side-channel), no clippy/binding ratchets, and a cache standing on a dead service (free Magic Nix Cache EOL 2025-02-01; magic-nix-cache-action@v8 works only via a reverse-engineered unpublished GitHub API). Replacement: nix-community/cache-nix-action@v6 (native actions/cache over /nix/store, no external account, built-in GC). ONE GATE JOB, ORDERED STEPS (not multi-job: cache restore is per-job fixed cost and both lit tiers are serialized is_parallel:false): checkout submodules:true; nix-installer-action@v16 + cache-nix-action@v6 keyed on flake.lock (gc-max-store-size-linux 8G); actions/cache on ~/.cargo/registry with the FR-62 tokio warm step verbatim; meson setup+compile; fast tier with EMITRUST_LEDGER_SUMMARY_DIR=$RUNNER_TEMP/ledgers then slow tier, both --print-errorlogs; ledger summaries step (if: always()) into $GITHUB_STEP_SUMMARY replacing the duplicate step; upload testlog.txt on failure. NEW ratchets.yml: weekly cron + workflow_dispatch; clippy_eval.py at its epoch pin and binding_eval.py; uploads JSON reports; exit 1/2 fails the workflow -- visibility without gating PRs; only TRACTOR needs private data and stays out of CI. macOS explicitly out of scope. ACCEPTANCE: green gh runs of both workflows on the pushed branch (dispatch ratchets.yml once) before merge; first post-switch run is expectedly cold, then keyed on flake.lock; FlakeHub Cache is the escape hatch if restores thrash."
