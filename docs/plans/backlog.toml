summary = "LANDED 2026-09-07, FR-193's two borrow-conflict unbuildables. s.merge(&s) (E0499) and s += s (E0502) both exited 0 then were refused by rustc. NOT one root cause. emitCXXMemberCall (ImportCExpressions.cpp:3504-3519) and its twin at :3624-3639 call placeExprRoot directly, and that walk (CImporterInternal.h:9846) peels MemberExpr and ArraySubscriptExpr but never a UnaryOperator/UO_AddrOf -- so a pointer arg spelled &s yielded a NULL root and the check silently did not fire. The composition already existed one function away in addressArgumentRoot. New borrowArgumentPlace/borrowArgumentRoot/borrowArgumentRootsAtCxxThis supply it at three sites; placeExprRoot itself left alone (five other call sites; &x is not a place). s += s never reached either check -- the STL OO_PlusEqual arm (:4855-4934) had no aliasing check at all. CORRECTS THE SPEC: the third site is mostly unreachable -- a member operator+=(const S*) is omitted at class-import time whether or not it aliases, so the reachable member-operator shape is operator()(const S*), i.e. s(&s), and that is what is pinned. s += s DID NOT NEED A FENCE: push_str(&rhs.clone()) staged through a temp is always equal to C++'s append (which copies from the operand), so it was MADE TO WORK -- abab 4 / abQabQ 6 byte-identical to clang++. The clone is gated on a root collision only, so non-aliasing s += t keeps its exact prior bytes and no golden moved. COST: five shapes that previously imported now refuse (a.m(&a), a.m(&a.field), a.peek(&a) on a const method, s(&s), merge(&*this)) -- all previously emitted crates rustc REJECTED, so no working program was lost; all reuse FR-48's sentence verbatim. SEPARATE DEFECT FOUND NOT FIXED: const S * maps to !emitrust.mut_ref (pointee constness is not carried into the borrow), which is the only reason the const-method case collides; it becomes an ACCEPT if a later wave maps pointer-to-const to &S. Gate 1013/1013, clippy 101 (+0), both ratchets unmoved."
