summary = "PHASE 1 LANDED 2026-08-30 once FR-173 cleared phase 0. Gate 928/928, cargo 0 errors, ledger net -95, 23 symbols blocked-to-clean and ZERO clean-to-blocked, crate 12,371,799 to 12,413,334 bytes. Diagnostic re-emission earned its keep immediately: the WIDE leg I listed as needing a rewrite did not, keeping its wording byte-for-byte, and shapes phase 1 cannot help keep their exact vocabulary AND arm locations. FR-173 backstop worked as a development signal -- short-circuiting the blob lookup yields member-does-not-exist rather than a silent E0609. A PREMISE IN MY BRIEF WAS FALSE: LINK ORDER CHANGES EMITTED BYTES -- the same 501 shards reordered give 12,373,168 not 12,371,799, because order drives tuN ordinals and first-occurrence dedup, so corpus comparisons must fix the order on both sides. SPIKED GO 2026-08-30, blocked on FR-173 phase 0. MY MECHANISM STORY WAS WRONG: FR-78 opaque diversion lives inside collectUnionSlot, which the anonymous-union flattening path NEVER CALLS, so the fix is a ROUTING change (stop flattening, let the ordinary union import handle it) not a widening of allArmsAggregate -- proven by rewriting six systemd shapes as named members, four of which already import unchanged. My 550-cascade reframing is directionally right but numerically wrong: 317 truly unblock and do not re-reject on arm access, but 226 hit a second blocker, overwhelmingly the pointer model; net 91 (phase 1) / 127 (phase 2), 23/44 symbols cleaned, cargo 0 errors both phases, raw union-type occurrences 118 to 7 to 2. Also falsified: four bare sites not three, 16 symbols not 14, and --link does not accept --incremental. METHOD CORRECTION: the 992-source hash sweep is blind to split-file sub-units, reporting 0/992 while six lit tests flipped. Opened 2026-08-30 from the FR-165 root-cause pass. 24 direct drops but 550 cascaded, the HIGHEST amplification measured in the corpus. By direct count it ranks 24th and would never be picked; by transitive weight it is the 7th large