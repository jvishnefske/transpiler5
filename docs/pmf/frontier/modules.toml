# FR-258: the real C++ modules the weekly emitrust-bx frontier is measured on.
#
# google/woff2 and google/brunsli are the two programs Cpp2Rust (PLDI'26) was
# evaluated on.  Each module is pinned to an exact commit; scripts/bx-frontier.py
# refuses to run against a checkout whose HEAD differs from `sha`.
#
# Downloaded code is DATA: the frontier never runs a project's build scripts.
# It only feeds the listed translation units to `clang++ -std=c++17
# -fsyntax-only` (inside emitrust-bx and bx-census), with `include_dirs`
# passed through CPLUS_INCLUDE_PATH (emitrust-bx has no -I flag).
#
# TU scope = the module's own library + CLI code, as its CMake build compiles
# it by default.  Every exclusion is justified next to it.  Paths and globs are
# relative to the module's checkout.

# ---------------------------------------------------------------- dependencies
# Header-only use: only the include dirs are put on the search path; no
# dependency TU is ever analysed.

[[dep]]
name = "brotli"
repo = "https://github.com/google/brotli.git"
sha = "d89c4b1c52e25ddafe047bc78bbee5c1e24b1809"
include_dirs = ["c/include"]

# --------------------------------------------------------------------- modules

[[module]]
name = "woff2"
repo = "https://github.com/google/woff2.git"
sha = "7b67e12355fe7da148db5c19d4261f0a498a9537"
tus = ["src/*.cc"]
exclude = [
  # libFuzzer entry points (LLVMFuzzerTestOneInput): test harnesses built as
  # separate STATIC fuzz targets in CMakeLists.txt, not part of the codec.
  "src/convert_woff2ttf_fuzzer.cc",
  "src/convert_woff2ttf_fuzzer_new_entry.cc",
]
# woff2's own CMakeLists: include_directories("src" "include")
include_dirs = ["include", "src"]
deps = ["brotli"]

[[module]]
name = "brunsli"
repo = "https://github.com/google/brunsli.git"
sha = "c18b9625ef045b0b89ebb4439ae2339e2160df71"
tus = ["c/common/*.cc", "c/dec/*.cc", "c/enc/*.cc", "c/tools/*.cc"]
exclude = [
  # Empty placeholder TU that CMake's GenerateExportHeader target needs
  # (add_library(brunsli-export OBJECT c/common/nothing.cc)); no code.
  "c/common/nothing.cc",
]
# Not listed in `tus`, deliberately:
#   c/tests/**      gtest unit tests + libFuzzer targets (test harness; would
#                   also need googletest, which we do not fetch)
#   c/experimental/ opt-in Bazel `experimental` config only; not in the
#                   default CMake build
#   java/, wasm/    JNI / Emscripten bindings (need jni.h / emscripten.h)
include_dirs = ["c/include"]
deps = ["brotli"]
# brunsli_export.h is GENERATED by CMake's GenerateExportHeader; the frontier
# writes this stub (a static build's export macros are empty) into its own
# output dir and puts that dir on the include path.  No project code runs.
[[module.generated]]
path = "brunsli/brunsli_export.h"
content = """
#ifndef BRUNSLI_EXPORT_H_
#define BRUNSLI_EXPORT_H_
#define BRUNSLI_EXPORT
#define BRUNSLI_NO_EXPORT
#endif
"""
